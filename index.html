      panel.appendChild(roleAcc.wrap);

      mafiaStepper.querySelector('[data-act="dec"]').addEventListener('click', () => {
        if (d.mafiaCount > 1){ d.mafiaCount -= 1; mafiaStepper.querySelector('.val').textContent = d.mafiaCount; updateSummary(); }
      });
      mafiaStepper.querySelector('[data-act="inc"]').addEventListener('click', () => {
        const max = Math.max(1, d.players.length - 2);
        if (d.mafiaCount < max){ d.mafiaCount += 1; mafiaStepper.querySelector('.val').textContent = d.mafiaCount; updateSummary(); }
      });

      const summary = el(`<div class="role-summary"></div>`);
      panel.appendChild(summary);
      const warnMsg = el(`<p style="color:var(--rust); font-size:0.85rem; margin-top:-8px;"></p>`);
      panel.appendChild(warnMsg);

      const startBtn = el(`<button class="btn" style="width:100%; margin-top:6px;">როლების დარიგება და დაწყება</button>`);

      const updateSummary = () => {
        const n = d.players.length;
        const citizens = n - d.mafiaCount - (d.doctorEnabled?1:0) - (d.detectiveEnabled?1:0);
        summary.innerHTML = '';
        summary.appendChild(el(`<span class="role-tag">მაფია: ${d.mafiaCount}</span>`));
        if (d.doctorEnabled) summary.appendChild(el(`<span class="role-tag">ექიმი: 1</span>`));
        if (d.detectiveEnabled) summary.appendChild(el(`<span class="role-tag">დეტექტივი: 1</span>`));
        summary.appendChild(el(`<span class="role-tag ${citizens<1 ? 'warn':''}">მოქალაქე: ${citizens}</span>`));
        roleAcc.setSummary(`მაფია ${d.mafiaCount}${d.doctorEnabled?' + ექიმი':''}${d.detectiveEnabled?' + დეტექტივი':''}`);

        const valid = n >= 5 && citizens >= 1;
        startBtn.disabled = !valid;
        if (n < 5){ warnMsg.style.display='block'; warnMsg.textContent = 'მინიმუმ 5 მოთამაშეა საჭირო თამაშის დასაწყებად.'; }
        else if (citizens < 1){ warnMsg.style.display='block'; warnMsg.textContent = 'როლების ჯამი აღემატება მოთამაშეთა რაოდენობას: შეამცირეთ მაფია ან გამორთეთ როლი.'; }
        else warnMsg.style.display='none';
      };

      renderPlayers();
      updateSummary();

      startBtn.addEventListener('click', () => {
        if (startBtn.disabled) return;
        this.assignRoles();
        d.revealIndex = 0;
        d.revealShown = false;
        d.phase = 'reveal';
        App.render();
      });
      panel.appendChild(startBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    assignRoles(){
      const d = this.data;
      const names = d.players;
      const doctorN = d.doctorEnabled ? 1 : 0;
      const detectiveN = d.detectiveEnabled ? 1 : 0;
      const citizensN = names.length - d.mafiaCount - doctorN - detectiveN;
      let pool = [];
      for (let i=0;i<d.mafiaCount;i++) pool.push('mafia');
      if (doctorN) pool.push('doctor');
      if (detectiveN) pool.push('detective');
      for (let i=0;i<citizensN;i++) pool.push('citizen');
      pool = shuffle(pool);
      d.players = names.map((name, i) => ({ name, role: pool[i], alive: true }));
    },

    /* ----------------------- ROLE REVEAL (pass-and-play) ----------------------- */
    renderReveal(){
      const d = this.data;
      const wrap = this.topBar(false);
      const player = d.players[d.revealIndex];
      const meta = ROLE_META[player.role];

      const panel = el(`<div class="panel"><h2>როლების გაცნობა (${d.revealIndex + 1} / ${d.players.length})</h2></div>`);
      const passCard = el(`
        <div class="pass-card">
          <div class="to-player">გადაეცი ტელეფონი: <strong>${escapeHtml(player.name)}</strong></div>
        </div>
      `);
      const card = el(`
        <div class="flip-card ${d.revealShown ? 'revealed ' + meta.className : ''}">
          ${d.revealShown
            ? `<div class="role-name">${meta.label}</div><div class="role-desc">${meta.desc}</div>`
            : 'დააჭირე, რომ ნახო შენი როლი 🤫<br><span style="font-size:0.8rem; opacity:0.85;">(დარწმუნდი, სხვები არ უყურებენ)</span>'}
        </div>
      `);
      card.addEventListener('click', () => {
        if (!d.revealShown){ d.revealShown = true; App.render(); }
      });
      passCard.appendChild(card);

      const nextBtn = el(`
        <button class="btn" style="width:100%; margin-top:18px;" ${d.revealShown ? '' : 'disabled'}>
          ${d.revealIndex < d.players.length - 1 ? 'შემდეგი მოთამაშე' : 'თამაშის დაწყება'}
        </button>
      `);
      nextBtn.addEventListener('click', () => {
        if (!d.revealShown) return;
        if (d.revealIndex < d.players.length - 1){
          d.revealIndex += 1;
          d.revealShown = false;
          App.render();
        } else {
          d.phase = 'game';
          d.nightNumber = 1;
          d.dayNumber = 0;
          this.startNight();
        }
      });
      passCard.appendChild(nextBtn);
      panel.appendChild(passCard);
      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- NIGHT / DAY NARRATOR ----------------------- */
    alivePlayers(){ return this.data.players.filter(p => p.alive); },

    startNight(){
      const d = this.data;
      d.nightKillTarget = null;
      d.nightSaveTarget = null;
      d.eliminatedThisNight = null;
      const intro = d.pendingNightIntro ? d.pendingNightIntro + ' ' : '';
      d.pendingNightIntro = null;

      const steps = [{ type:'narration', text: intro + 'ღამე დგება. ყველამ დახუჭეთ თვალები.' }];
      steps.push({ type:'narration', text:'მაფია, გაიღვიძეთ და ჩუმად მიუთითეთ მსხვერპლი.' });
      steps.push({ type:'nightKill' });
      steps.push({ type:'narration', text:'მაფია, დაიძინეთ.' });
      if (d.doctorEnabled){
        steps.push({ type:'narration', text:'ექიმი, გაიღვიძეთ და აირჩიეთ, ვის იხსნით ამ ღამით.' });
        steps.push({ type:'nightSave' });
        steps.push({ type:'narration', text:'ექიმი, დაიძინეთ.' });
      }
      if (d.detectiveEnabled){
        steps.push({ type:'narration', text:'დეტექტივი, გაიღვიძეთ, ჩუმად მიუთითეთ ვისი შემოწმებაც გსურთ, და დაიძინეთ.' });
      }
      steps.push({ type:'narration', text:'ყველა, გაიღვიძეთ!' });

      d.scriptSteps = steps;
      d.scriptIndex = 0;
      d.phaseLabel = 'night';
      App.render();
    },

    finishNight(){
      const d = this.data;
      let died = null;
      if (d.nightKillTarget && d.nightKillTarget !== d.nightSaveTarget) died = d.nightKillTarget;
      if (died){ died.alive = false; d.eliminatedThisNight = died; Sound.fail(); }
      else d.eliminatedThisNight = null;

      const winner = this.checkWinner();
      if (winner){ d.winner = winner; d.phase = 'end'; Sound.win(); App.render(); return; }
      this.startDay();
    },

    startDay(){
      const d = this.data;
      d.dayNumber += 1;
      Sound.whoosh();
      const resultText = d.eliminatedThisNight
        ? `ღამით მოკვდა: ${d.eliminatedThisNight.name} (${ROLE_META[d.eliminatedThisNight.role].label}).`
        : 'ღამით არავინ მოკვდა.';
      d.scriptSteps = [
        { type:'narration', text: resultText + ' დღე დადგა. განიხილეთ ეჭვები.' },
        { type:'dayVote' }
      ];
      d.scriptIndex = 0;
      d.phaseLabel = 'day';
      App.render();
    },

    finishDay(selected){
      const d = this.data;
      let resultText;
      if (selected){
        selected.alive = false;
        resultText = `განდევნილია: ${selected.name} (${ROLE_META[selected.role].label}).`;
        Sound.fail();
      } else {
        resultText = 'არავინ განიდევნა.';
      }
      const winner = this.checkWinner();
      if (winner){ d.winner = winner; d.phase = 'end'; Sound.win(); App.render(); return; }
      d.nightNumber += 1;
      d.pendingNightIntro = resultText;
      Sound.whoosh();
      this.startNight();
    },

    checkWinner(){
      const alive = this.alivePlayers();
      const aliveMafia = alive.filter(p => p.role === 'mafia').length;
      const aliveOthers = alive.length - aliveMafia;
      if (aliveMafia === 0) return 'citizens';
      if (aliveMafia >= aliveOthers) return 'mafia';
      return null;
    },

    renderGame(){
      const d = this.data;
      const wrap = this.topBar(true);
      const step = d.scriptSteps[d.scriptIndex];
      const panel = el(`<div class="panel"></div>`);
      panel.appendChild(el(`
        <div class="phase-banner ${d.phaseLabel}">
          <span class="dot"></span>${d.phaseLabel === 'night' ? 'ღამე ' + d.nightNumber : 'დღე ' + d.dayNumber}
        </div>
      `));

      if (step.type === 'narration'){
        panel.appendChild(el(`<div class="narration-box">${escapeHtml(step.text)}</div>`));
        const isLastNightStep = d.phaseLabel === 'night' && d.scriptIndex === d.scriptSteps.length - 1;
        const nextBtn = el(`<button class="btn" style="width:100%;">${isLastNightStep ? 'ღამის შედეგის გამოცხადება' : 'შემდეგი'}</button>`);
        nextBtn.addEventListener('click', () => {
          if (isLastNightStep) this.finishNight();
          else { d.scriptIndex += 1; App.render(); }
        });
        panel.appendChild(nextBtn);
      } else if (step.type === 'nightKill'){
        panel.appendChild(el(`<p style="text-align:center; color:var(--ink-soft); margin-top:-4px;">ვინ აირჩია მაფიამ მსხვერპლად?</p>`));
        const listEl = el(`<div class="pick-list"></div>`);
        this.alivePlayers().forEach(p => {
          const opt = el(`<button class="pick-option">${escapeHtml(p.name)}</button>`);
          opt.addEventListener('click', () => { d.nightKillTarget = p; d.scriptIndex += 1; App.render(); });
          listEl.appendChild(opt);
        });
        const noneOpt = el(`<button class="pick-option none-option">ვერ გადაწყვიტეს / არავინ აირჩია</button>`);
        noneOpt.addEventListener('click', () => { d.nightKillTarget = null; d.scriptIndex += 1; App.render(); });
        listEl.appendChild(noneOpt);
        panel.appendChild(listEl);
      } else if (step.type === 'nightSave'){
        panel.appendChild(el(`<p style="text-align:center; color:var(--ink-soft); margin-top:-4px;">ვინ იხსნა ექიმმა?</p>`));
        const listEl = el(`<div class="pick-list"></div>`);
        this.alivePlayers().forEach(p => {
          const opt = el(`<button class="pick-option">${escapeHtml(p.name)}</button>`);
          opt.addEventListener('click', () => { d.nightSaveTarget = p; d.scriptIndex += 1; App.render(); });
          listEl.appendChild(opt);
        });
        const noneOpt = el(`<button class="pick-option none-option">ექიმმა არავინ იხსნა</button>`);
        noneOpt.addEventListener('click', () => { d.nightSaveTarget = null; d.scriptIndex += 1; App.render(); });
        listEl.appendChild(noneOpt);
        panel.appendChild(listEl);
      } else if (step.type === 'dayVote'){
        panel.appendChild(el(`<p style="text-align:center; color:var(--ink-soft); margin-top:-4px;">ვინ გაირიცხა კენჭისყრით?</p>`));
        const listEl = el(`<div class="pick-list"></div>`);
        this.alivePlayers().forEach(p => {
          const opt = el(`<button class="pick-option">${escapeHtml(p.name)}</button>`);
          opt.addEventListener('click', () => this.finishDay(p));
          listEl.appendChild(opt);
        });
        const noneOpt = el(`<button class="pick-option none-option">არავინ გავარდა</button>`);
        noneOpt.addEventListener('click', () => this.finishDay(null));
        listEl.appendChild(noneOpt);
        panel.appendChild(listEl);
      }

      panel.appendChild(this.renderRoster());
      wrap.appendChild(panel);
      return wrap;
    },

    renderRoster(){
      const d = this.data;
      const box = el(`<div class="roster"><h4>მოთამაშეები</h4><ul class="roster-list"></ul></div>`);
      const ul = box.querySelector('ul');
      d.players.forEach(p => {
        const li = el(`
          <li class="${p.alive ? '' : 'eliminated'}">${escapeHtml(p.name)}${p.alive ? '' : `<span class="r-tag">${ROLE_META[p.role].label}</span>`}</li>
        `);
        ul.appendChild(li);
      });
      return box;
    },

    /* ----------------------- END SCREEN ----------------------- */
    renderEnd(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"></div>`);
      panel.appendChild(el(`
        <div class="winner-banner">
          <div class="crown">${d.winner === 'mafia' ? '🕵️' : '🏆'}</div>
          <h3>${d.winner === 'mafia' ? 'გაიმარჯვა მაფიამ' : 'გაიმარჯვეს მშვიდობიანმა მოქალაქეებმა'}</h3>
        </div>
      `));

      const table = el(`<table class="review-table"><thead><tr><th>მოთამაშე</th><th>როლი</th><th>სტატუსი</th></tr></thead><tbody></tbody></table>`);
      const tbody = table.querySelector('tbody');
      d.players.forEach(p => {
        tbody.appendChild(el(`
          <tr><td>${escapeHtml(p.name)}</td><td>${ROLE_META[p.role].label}</td><td>${p.alive ? 'გადარჩა' : 'გარიცხულია'}</td></tr>
        `));
      });
      panel.appendChild(table);

      const actions = el(`<div class="action-row">
        <button class="btn">იგივე მოთამაშეებით თავიდან</button>
        <button class="btn ghost">მთავარ გვერდზე</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        const names = d.players.map(p => p.name);
        const cfg = { mafiaCount: d.mafiaCount, doctorEnabled: d.doctorEnabled, detectiveEnabled: d.detectiveEnabled };
        this.init();
        this.data.players = names.slice();
        this.data.mafiaCount = cfg.mafiaCount;
        this.data.doctorEnabled = cfg.doctorEnabled;
        this.data.detectiveEnabled = cfg.detectiveEnabled;
        App.render();
      });
      actions.children[1].addEventListener('click', () => { App.clearSavedGame(App.state.view); App.goHome(); });
      panel.appendChild(actions);

      wrap.appendChild(panel);
      return wrap;
    }
  };

  /* ========================================================================
     GAME 5: იმპოსტორი (IMPOSTER) — 3+ players. Each round, almost everyone
     gets the same question; one secret imposter gets a similar-but-different
     one. Everyone answers out loud, the group discusses, then votes.
  ======================================================================== */
  const Imposter = {
    data: null,

    init(){
      this.data = {
        phase: 'setup',        // rules | setup | reveal | discuss | result | final
        previousPhase: 'setup',
        players: [],
        totalRounds: 5,
        currentRound: 0,
        selectedCategoryIds: IMPOSTOR_CATEGORIES.map(c => c.id),
        questionPool: [],
        usedQuestionIndices: [],
        currentPair: null,
        imposterIndex: 0,
        revealIndex: 0,
        revealShown: false,
        totals: {}
      };
    },

    render(){
      const d = this.data;
      if (d.phase === 'rules') return this.renderRules();
      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'reveal') return this.renderReveal();
      if (d.phase === 'discuss') return this.renderDiscuss();
      if (d.phase === 'result') return this.renderResult();
      return this.renderFinal();
    },

    topBar(showBack){
      const wrap = el(`<div></div>`);
      const bar = el(`<div class="top-bar"></div>`);
      if (showBack){
        const back = el(`<button class="back-link">← მთავარ გვერდზე</button>`);
        back.addEventListener('click', () => App.quitToMenu());
        bar.appendChild(back);
      } else {
        bar.appendChild(el(`<span></span>`));
      }
      const rulesLink = el(`<button class="rules-link">📖 წესები</button>`);
      rulesLink.addEventListener('click', () => {
        this.data.previousPhase = this.data.phase;
        this.data.phase = 'rules';
        App.render();
      });
      bar.appendChild(rulesLink);
      wrap.appendChild(bar);
      return wrap;
    },

    /* ----------------------- RULEBOOK ----------------------- */
    renderRules(){
      const wrap = el(`<div></div>`);
      const back = el(`<button class="back-link">← უკან</button>`);
      back.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      wrap.appendChild(back);

      const panel = el(`<div class="panel rulebook"><h2>იმპოსტორის წესები</h2></div>`);
      panel.appendChild(el(`
        <p>ყოველ რაუნდში თითქმის ყველა მოთამაშე იღებს ერთსა და იმავე კითხვას.
        ერთ ფარულ მოთამაშეს, <strong>იმპოსტორს</strong>, კი ერგება ძალიან
        მსგავსი, მაგრამ სხვა კითხვა. არავინ იცის, ვინ არის იმპოსტორი და
        იმპოსტორმაც არ იცის, რომ განსხვავებული კითხვა ჰქონდა.</p>
      `));

      panel.appendChild(el(`<h3>რაუნდის მსვლელობა</h3>`));
      panel.appendChild(el(`
        <ol>
          <li>ტელეფონი გადადის ხელიდან ხელში: თითოეული მოთამაშე მარტო ეცნობა საკუთარ კითხვას.</li>
          <li>ყველა, რიგრიგობით, ხმამაღლა პასუხობს საკუთარ კითხვას, ისე, თითქოს ყველას ერთი და იგივე ჰქონდეს.</li>
          <li>პასუხების მოსმენის შემდეგ ჯგუფი განიხილავს და ცდილობს გამოცნოს, ვის ეპასუხა "სხვანაირად".</li>
          <li>დააჭირეთ "გამოვლენას": აპი გიჩვენებთ, ვინ იყო იმპოსტორი და ორივე კითხვას.</li>
        </ol>
      `));

      panel.appendChild(el(`<h3>ქულები</h3>`));
      panel.appendChild(el(`
        <ul>
          <li>თუ ჯგუფმა სწორად გამოიცნო იმპოსტორი, ყველა დანარჩენს ერგება 1 ქულა.</li>
          <li>თუ ვერ გამოიცნეს, იმპოსტორს ერგება 2 ქულა.</li>
        </ul>
      `));

      panel.appendChild(el(`<h3>რჩევები</h3>`));
      panel.appendChild(el(`
        <ul>
          <li>ნუ უპასუხებთ ზედმეტად ბუნდოვნად: თუ ეჭვს გაჩენთ, ადვილად გამოგამჟღავნებენ.</li>
          <li>იმპოსტორო, ყურადღებით უსმინე დანარჩენებს და სცადე მოირგო მათი პასუხების ტონი.</li>
          <li>3 მოთამაშეც საკმარისია, თუმცა 5+ მოთამაშით დისკუსია ბევრად საინტერესო ხდება.</li>
        </ul>
      `));

      const backBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">დაბრუნება</button>`);
      backBtn.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      panel.appendChild(backBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- SETUP ----------------------- */
    renderSetup(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>იმპოსტორი: მოთამაშეები</h2></div>`);

      const playerField = el(`
        <div class="field-row">
          <label>დაამატე მოთამაშეები (მინიმუმ 3)</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი..." maxlength="20">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const nameInput = playerField.querySelector('input');
      const startBtn = el(`<button class="btn" style="width:100%; margin-top:6px;">დაწყება</button>`);
      const warnMsg = el(`<p style="color:var(--rust); font-size:0.85rem; margin-top:8px;"></p>`);

      const updateValidity = () => {
        const n = d.players.length;
        const valid = n >= 3 && d.selectedCategoryIds.length > 0;
        startBtn.disabled = !valid;
        warnMsg.style.display = n < 3 ? 'block' : 'none';
        if (n < 3) warnMsg.textContent = 'მინიმუმ 3 მოთამაშეა საჭირო.';
        if (catWarn) catWarn.style.display = d.selectedCategoryIds.length === 0 ? 'block' : 'none';
      };
      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm" aria-label="წაშლა">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); updateValidity(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val) return;
        d.players.push(val);
        nameInput.value = '';
        renderPlayers(); updateValidity();
        nameInput.focus();
      };
      playerField.querySelector('.btn').addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPlayer(); } });
      panel.appendChild(playerField);

      const roundsAcc = makeAccordion('რაუნდების რაოდენობა', roundLabel(d.totalRounds));
      roundsAcc.body.appendChild(el(`<div class="chip-group"></div>`));
      const roundsGroup = roundsAcc.body.querySelector('.chip-group');
      [3,5,7,Infinity].forEach(r => {
        const chip = el(`<button type="button" class="chip ${d.totalRounds===r?'active':''}">${roundLabel(r)}</button>`);
        chip.addEventListener('click', () => {
          d.totalRounds = r;
          roundsGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
          roundsAcc.setSummary(roundLabel(r));
        });
        roundsGroup.appendChild(chip);
      });
      panel.appendChild(roundsAcc.wrap);

      const catAcc = makeAccordion('თემები', `${d.selectedCategoryIds.length} არჩეული`);
      const catField = catAcc.body;
      catField.appendChild(el(`<div class="chip-group cat-opts"></div>`));
      catField.appendChild(el(`
        <div class="action-row" style="margin-top:8px;">
          <button type="button" class="btn ghost" style="flex:1;">ყველას მონიშვნა</button>
          <button type="button" class="btn ghost" style="flex:1;">არცერთის მონიშვნა</button>
        </div>
      `));
      const catGroup = catField.querySelector('.cat-opts');
      const catWarn = el(`<p style="color:var(--rust); font-size:0.85rem; margin-top:8px; display:none;">მინიმუმ ერთი თემა მაინც უნდა იყოს არჩეული.</p>`);
      const renderCatChips = () => {
        catGroup.innerHTML = '';
        IMPOSTOR_CATEGORIES.forEach(cat => {
          const active = d.selectedCategoryIds.includes(cat.id);
          const chip = el(`<button type="button" class="chip ${active?'active':''}">${escapeHtml(cat.label)}</button>`);
          chip.addEventListener('click', () => {
            if (d.selectedCategoryIds.includes(cat.id)) d.selectedCategoryIds = d.selectedCategoryIds.filter(id => id !== cat.id);
            else d.selectedCategoryIds.push(cat.id);
            renderCatChips();
            updateValidity();
          });
          catGroup.appendChild(chip);
        });
        catAcc.setSummary(`${d.selectedCategoryIds.length} არჩეული`);
      };
      const [selectAllBtn, selectNoneBtn] = catField.querySelectorAll('.action-row button');
      selectAllBtn.addEventListener('click', () => { d.selectedCategoryIds = IMPOSTOR_CATEGORIES.map(c=>c.id); renderCatChips(); updateValidity(); });
      selectNoneBtn.addEventListener('click', () => { d.selectedCategoryIds = []; renderCatChips(); updateValidity(); });
      renderCatChips();
      panel.appendChild(catAcc.wrap);
      panel.appendChild(catWarn);

      panel.appendChild(warnMsg);
      panel.appendChild(startBtn);

      startBtn.addEventListener('click', () => {
        if (startBtn.disabled) return;
        d.players.forEach(p => d.totals[p] = 0);
        d.questionPool = [];
        IMPOSTOR_CATEGORIES.forEach(cat => {
          if (d.selectedCategoryIds.includes(cat.id)) d.questionPool.push(...cat.questions);
        });
        d.usedQuestionIndices = [];
        this.startRound();
      });

      renderPlayers();
      updateValidity();

      wrap.appendChild(panel);
      return wrap;
    },

    pickQuestionPair(){
      const d = this.data;
      const available = d.questionPool.map((q,i)=>i).filter(i => !d.usedQuestionIndices.includes(i));
      const pool = available.length ? available : d.questionPool.map((q,i)=>i);
      if (!available.length) d.usedQuestionIndices = [];
      const idx = pickRandom(pool);
      d.usedQuestionIndices.push(idx);
      return d.questionPool[idx];
    },

    startRound(){
      const d = this.data;
      d.currentRound += 1;
      d.currentPair = this.pickQuestionPair();
      d.imposterIndex = Math.floor(Math.random() * d.players.length);
      d.revealIndex = 0;
      d.revealShown = false;
      d.phase = 'reveal';
      App.render();
    },

    /* ----------------------- REVEAL (pass-and-play) ----------------------- */
    renderReveal(){
      const d = this.data;
      const wrap = this.topBar(false);
      const isImposter = d.revealIndex === d.imposterIndex;
      const question = isImposter ? d.currentPair.imposter : d.currentPair.original;
      const name = d.players[d.revealIndex];

      const panel = el(`<div class="panel"><h2>რაუნდი ${d.currentRound} / ${roundLabel(d.totalRounds)}: კითხვის გაცნობა (${d.revealIndex+1} / ${d.players.length})</h2></div>`);
      const passCard = el(`<div class="pass-card"><div class="to-player">გადაეცი ტელეფონი: <strong>${escapeHtml(name)}</strong></div></div>`);
      const card = el(`
        <div class="flip-card ${d.revealShown ? 'revealed':''}">
          ${d.revealShown
            ? `<div class="role-name" style="font-size:1.1rem;">შენი კითხვაა:</div><div class="role-desc" style="font-size:1.05rem;">${escapeHtml(question)}</div>`
            : 'დააჭირე, რომ ნახო შენი კითხვა 🤫<br><span style="font-size:0.8rem; opacity:0.85;">(დარწმუნდი, სხვები არ უყურებენ)</span>'}
        </div>
      `);
      card.addEventListener('click', () => { if (!d.revealShown){ d.revealShown = true; App.render(); } });
      passCard.appendChild(card);

      const nextBtn = el(`
        <button class="btn" style="width:100%; margin-top:18px;" ${d.revealShown ? '' : 'disabled'}>
          ${d.revealIndex < d.players.length - 1 ? 'შემდეგი მოთამაშე' : 'ყველამ ნახა, დისკუსია'}
        </button>
      `);
      nextBtn.addEventListener('click', () => {
        if (!d.revealShown) return;
        if (d.revealIndex < d.players.length - 1){
          d.revealIndex += 1;
          d.revealShown = false;
          App.render();
        } else {
          d.phase = 'discuss';
          App.render();
        }
      });
      passCard.appendChild(nextBtn);
      panel.appendChild(passCard);
      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- DISCUSSION ----------------------- */
    renderDiscuss(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>რაუნდი ${d.currentRound}: დისკუსია</h2></div>`);
      panel.appendChild(el(`
        <div class="narration-box">ყველამ, რიგრიგობით, ხმამაღლა უპასუხეთ საკუთარ კითხვას.<br>შემდეგ განიხილეთ და გამოიცანით, ვინ იყო იმპოსტორი.</div>
      `));
      const revealBtn = el(`<button class="btn" style="width:100%;">გამოვლენა</button>`);
      revealBtn.addEventListener('click', () => { d.phase = 'result'; App.render(); });
      panel.appendChild(revealBtn);
      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- RESULT / SCORING ----------------------- */
    renderResult(){
      const d = this.data;
      const wrap = this.topBar(true);
      const imposterName = d.players[d.imposterIndex];
      const panel = el(`<div class="panel"><h2>რაუნდი ${d.currentRound}: შედეგი</h2></div>`);

      panel.appendChild(el(`
        <div class="winner-banner" style="padding:6px 0 14px;">
          <div class="crown">🎭</div>
          <h3>იმპოსტორი იყო: ${escapeHtml(imposterName)}</h3>
        </div>
      `));

      const qBox = el(`<div style="background:var(--surface); border:1.5px solid var(--paper-line); border-radius:10px; padding:14px 16px; margin-bottom:16px;"></div>`);
      qBox.appendChild(el(`<p style="margin:0 0 8px;"><strong>ორიგინალი კითხვა:</strong> ${escapeHtml(d.currentPair.original)}</p>`));
      qBox.appendChild(el(`<p style="margin:0;"><strong>იმპოსტორის კითხვა:</strong> ${escapeHtml(d.currentPair.imposter)}</p>`));
      panel.appendChild(qBox);

      panel.appendChild(el(`<p style="text-align:center; color:var(--ink-soft); font-size:0.92rem;">ჯგუფმა სწორად გამოიცნო იმპოსტორი?</p>`));

      let endCheckbox = null;
      if (d.totalRounds === Infinity){
        const endToggleRow = el(`
          <label style="display:flex; align-items:center; justify-content:center; gap:8px; margin:10px 0 4px; font-size:0.9rem; color:var(--ink-soft); cursor:pointer;">
            <input type="checkbox" style="width:16px; height:16px;"> ეს იყოს ბოლო რაუნდი
          </label>
        `);
        endCheckbox = endToggleRow.querySelector('input');
        panel.appendChild(endToggleRow);
      }

      const btnRow = el(`<div class="action-row" style="justify-content:center;"></div>`);
      const yesBtn = el(`<button class="btn">კი, გამოიცნეს</button>`);
      const noBtn = el(`<button class="btn secondary">არა, ვერ გამოიცნეს</button>`);
      const applyAndContinue = (guessedCorrectly) => {
        d.players.forEach((p, i) => {
          if (guessedCorrectly){ if (i !== d.imposterIndex) d.totals[p] += 1; }
          else { if (i === d.imposterIndex) d.totals[p] += 2; }
        });
        const shouldContinue = d.totalRounds === Infinity
          ? !(endCheckbox && endCheckbox.checked)
          : (d.currentRound < d.totalRounds);
        if (shouldContinue) this.startRound();
        else { d.phase = 'final'; Sound.win(); App.render(); }
      };
      yesBtn.addEventListener('click', () => applyAndContinue(true));
      noBtn.addEventListener('click', () => applyAndContinue(false));
      btnRow.appendChild(yesBtn);
      btnRow.appendChild(noBtn);
      panel.appendChild(btnRow);

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- FINAL ----------------------- */
    renderFinal(){
      const d = this.data;
      const players = d.players.map(p => ({ name:p, score: d.totals[p] || 0 }));
      const sorted = players.slice().sort((a,b)=>b.score-a.score);
      const winner = sorted[0];
      const wrap = this.topBar(true);
      const panel = el(`
        <div class="panel">
          <h2>თამაში დასრულდა</h2>
          <div class="final-winner">
            <div class="crown">🏆</div>
            <h3>${winner ? escapeHtml(winner.name) : '—'}</h3>
            <div style="color:var(--ink-soft)">გაიმარჯვა ${winner ? winner.score : 0} ქულით</div>
          </div>
        </div>
      `);
      panel.appendChild(el(`<div>${renderScoreboardList(players)}</div>`));
      const actions = el(`<div class="action-row">
        <button class="btn">თავიდან იგივე მოთამაშეებით</button>
        <button class="btn ghost">მთავარ გვერდზე</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        const names = d.players.slice();
        const rounds = d.totalRounds;
        this.init();
        this.data.players = names;
        this.data.totalRounds = rounds;
        names.forEach(p => this.data.totals[p] = 0);
        this.startRound();
      });
      actions.children[1].addEventListener('click', () => { App.clearSavedGame(App.state.view); App.goHome(); });
      panel.appendChild(actions);
      wrap.appendChild(panel);
      return wrap;
    }
  };

  /* ========================================================================
     GAME 6: ჩაძირობანა (BATTLESHIP) — exactly 2 players, 8x8 grid,
     5 ships [4,3,3,2,2]. Pass-and-play: each player privately places ships
     behind a gate, then takes turns firing at the other's grid. A hit lets
     the same player fire again immediately; a miss requires an explicit
     "pass the phone" tap before the gate re-covers the board.
  ======================================================================== */
  const Battleship = {
    data: null,
    SHIP_SIZES: [4,3,3,2,2],
    BOARD_SIZE: 8,

    init(){
      this.data = {
        phase: 'setup',     // rules | setup | placement | game | end
        previousPhase: 'setup',
        players: [],
        boards: null,       // [{ships:[{cells:[{r,c}],size,hits}], toPlace:[sizes]}, ...]
        shotsAt: null,      // [Set('r,c'), Set('r,c')] — all cells fired at board i
        placementActiveIndex: 0,
        placementGateRevealedFor: null,
        selectedShipSize: null,
        orientation: 'H',
        placementError: '',
        attackerIndex: 0,
        gateRevealedFor: null,
        awaitingHandoff: false,
        lastMessage: '',
        winnerIndex: null
      };
    },

    render(){
      const d = this.data;
      if (d.phase === 'rules') return this.renderRules();
      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'placement') return this.renderPlacement();
      if (d.phase === 'end') return this.renderEnd();
      return this.renderGame();
    },

    topBar(showBack){
      const wrap = el(`<div></div>`);
      const bar = el(`<div class="top-bar"></div>`);
      if (showBack){
        const back = el(`<button class="back-link">← მთავარ გვერდზე</button>`);
        back.addEventListener('click', () => App.quitToMenu());
        bar.appendChild(back);
      } else {
        bar.appendChild(el(`<span></span>`));
      }
      const rulesLink = el(`<button class="rules-link">📖 წესები</button>`);
      rulesLink.addEventListener('click', () => {
        this.data.previousPhase = this.data.phase;
        this.data.phase = 'rules';
        App.render();
      });
      bar.appendChild(rulesLink);
      wrap.appendChild(bar);
      return wrap;
    },

    /* ----------------------- RULEBOOK ----------------------- */
    renderRules(){
      const wrap = el(`<div></div>`);
      const back = el(`<button class="back-link">← უკან</button>`);
      back.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      wrap.appendChild(back);

      const panel = el(`<div class="panel rulebook"><h2>ზღვის ბრძოლის წესები</h2></div>`);
      panel.appendChild(el(`<p>ორი მოთამაშისთვის. თითოეულს აქვს 8×8 საკუთარი ველი და 5 ხომალდი: ერთი 4-უჯრიანი, ორი 3-უჯრიანი და ორი 2-უჯრიანი. მიზანია მოწინააღმდეგის ყველა ხომალდის ჩაძირვა მანამ, სანამ თქვენსას ჩაძირავენ.</p>`));

      panel.appendChild(el(`<h3>განლაგება</h3>`));
      panel.appendChild(el(`
        <ul>
          <li>ორივე მოთამაშე ფარულად ალაგებს საკუთარ ხომალდებს ტელეფონის გადაცემით.</li>
          <li>აირჩიეთ ხომალდი, აირჩიეთ მიმართულება (ჰორიზონტალური/ვერტიკალური), შემდეგ დააჭირეთ საწყის უჯრას.</li>
          <li>ხომალდები არ შეიძლება ერთმანეთზე გადაფარვას ან ველის გარეთ გასვლას.</li>
          <li>"შემთხვევითი განლაგება" ღილაკს შეუძლია დარჩენილი ხომალდები ავტომატურად დაალაგოს.</li>
        </ul>
      `));

      panel.appendChild(el(`<h3>სროლა</h3>`));
      panel.appendChild(el(`
        <ul>
          <li>რიგრიგობით ისვრით მოწინააღმდეგის ველზე უჯრის არჩევით.</li>
          <li>თუ მოხვდით, იმავე მოთამაშე ისვრის ისევ. თუ ააცდა, ტელეფონი გადაეცემა მოწინააღმდეგეს.</li>
          <li>ხომალდი ითვლება ჩაძირულად, როცა მისი ყველა უჯრა მოხვედრილია.</li>
        </ul>
      `));

      panel.appendChild(el(`<h3>გამარჯვება</h3>`));
      panel.appendChild(el(`<p>ვინც პირველი ჩაძირავს მოწინააღმდეგის ყველა ხომალდს, იმარჯვებს.</p>`));

      const backBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">დაბრუნება</button>`);
      backBtn.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      panel.appendChild(backBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- SETUP ----------------------- */
    renderSetup(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>ჩაძირობანა: მოთამაშეები</h2></div>`);

      const playerField = el(`
        <div class="field-row">
          <label>ორი მოთამაშის სახელი</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი..." maxlength="20">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const inlineAdd = playerField.querySelector('.inline-add');
      const nameInput = playerField.querySelector('input');
      const startBtn = el(`<button class="btn" style="width:100%; margin-top:6px;">ხომალდების განლაგება</button>`);
      const warnMsg = el(`<p style="color:var(--rust); font-size:0.85rem; margin-top:8px;"></p>`);

      const updateValidity = () => {
        const n = d.players.length;
        startBtn.disabled = n !== 2;
        inlineAdd.style.display = n >= 2 ? 'none' : 'flex';
        warnMsg.style.display = n === 2 ? 'none' : 'block';
        warnMsg.textContent = 'ზუსტად 2 მოთამაშეა საჭირო.';
      };
      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm" aria-label="წაშლა">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); updateValidity(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val || d.players.length >= 2) return;
        d.players.push(val);
        nameInput.value = '';
        renderPlayers(); updateValidity();
        nameInput.focus();
      };
      playerField.querySelector('.btn').addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPlayer(); } });
      panel.appendChild(playerField);
      panel.appendChild(warnMsg);
      panel.appendChild(startBtn);

      startBtn.addEventListener('click', () => {
        if (startBtn.disabled) return;
        this.startPlacement();
      });

      renderPlayers();
      updateValidity();
      wrap.appendChild(panel);
      return wrap;
    },

    startPlacement(){
      const d = this.data;
      d.boards = [0,1].map(() => ({ ships: [], toPlace: this.SHIP_SIZES.slice() }));
      d.shotsAt = [new Set(), new Set()];
      d.placementActiveIndex = 0;
      d.placementGateRevealedFor = null;
      d.selectedShipSize = null;
      d.orientation = 'H';
      d.placementError = '';
      d.phase = 'placement';
      App.render();
    },

    /* ----------------------- PLACEMENT ----------------------- */
    shipCellsFor(size, r, c, orientation){
      const cells = [];
      for (let i=0;i<size;i++){
        cells.push(orientation === 'H' ? { r, c: c+i } : { r: r+i, c });
      }
      return cells;
    },

    canPlace(idx, cells){
      const n = this.BOARD_SIZE;
      for (const cell of cells){
        if (cell.r < 0 || cell.r >= n || cell.c < 0 || cell.c >= n) return false;
      }
      const occupied = new Set();
      this.data.boards[idx].ships.forEach(s => s.cells.forEach(c => occupied.add(c.r+','+c.c)));
      for (const cell of cells){ if (occupied.has(cell.r+','+cell.c)) return false; }
      return true;
    },

    tryPlaceShip(idx, size, r, c){
      const d = this.data;
      const cells = this.shipCellsFor(size, r, c, d.orientation);
      if (!this.canPlace(idx, cells)){
        d.placementError = 'ხომალდი ვერ თავსდება აქ.';
        return false;
      }
      d.boards[idx].ships.push({ cells, size, hits: 0 });
      const pos = d.boards[idx].toPlace.indexOf(size);
      if (pos !== -1) d.boards[idx].toPlace.splice(pos, 1);
      d.selectedShipSize = null;
      d.placementError = '';
      return true;
    },

    randomPlaceRemaining(idx){
      const d = this.data;
      const remaining = d.boards[idx].toPlace.slice();
      remaining.forEach(size => {
        let placed = false, attempts = 0;
        while (!placed && attempts < 300){
          attempts++;
          const orientation = Math.random() < 0.5 ? 'H' : 'V';
          const r = Math.floor(Math.random() * this.BOARD_SIZE);
          const c = Math.floor(Math.random() * this.BOARD_SIZE);
          const cells = this.shipCellsFor(size, r, c, orientation);
          if (this.canPlace(idx, cells)){
            d.boards[idx].ships.push({ cells, size, hits: 0 });
            const pos = d.boards[idx].toPlace.indexOf(size);
            if (pos !== -1) d.boards[idx].toPlace.splice(pos, 1);
            placed = true;
          }
        }
      });
      d.placementError = '';
      d.selectedShipSize = null;
    },

    renderPlacement(){
      const d = this.data;
      const idx = d.placementActiveIndex;
      const wrap = this.topBar(false);

      if (d.placementGateRevealedFor !== idx){
        const passCard = el(`<div class="panel"><div class="pass-card"><div class="to-player">გადაეცი ტელეფონი: <strong>${escapeHtml(d.players[idx])}</strong></div></div></div>`);
        const card = el(`<div class="flip-card">დააჭირე, რომ დაიწყო ხომალდების განლაგება 🚢</div>`);
        card.addEventListener('click', () => { d.placementGateRevealedFor = idx; App.render(); });
        passCard.querySelector('.pass-card').appendChild(card);
        wrap.appendChild(passCard);
        return wrap;
      }

      const panel = el(`<div class="panel"><h2>განალაგე ხომალდები: ${escapeHtml(d.players[idx])}</h2></div>`);
      const board = d.boards[idx];

      const tray = el(`<div class="ship-tray"></div>`);
      // build tray from toPlace list directly (each remaining ship is its own selectable chip)
      board.toPlace.forEach((size, i) => {
        const chip = el(`<button type="button" class="chip ${d.selectedShipSize === size ? 'active':''}">ხომალდი (${size})</button>`);
        chip.addEventListener('click', () => { d.selectedShipSize = size; d.placementError=''; App.render(); });
        tray.appendChild(chip);
      });
      if (!board.toPlace.length){
        tray.appendChild(el(`<span class="role-tag">ყველა ხომალდი განლაგებულია ✓</span>`));
      }
      panel.appendChild(tray);

      const controls = el(`<div class="action-row" style="justify-content:center;"></div>`);
      const orientBtn = el(`<button type="button" class="btn ghost">მიმართულება: ${d.orientation === 'H' ? 'ჰორიზონტალური' : 'ვერტიკალური'}</button>`);
      orientBtn.addEventListener('click', () => { d.orientation = d.orientation === 'H' ? 'V' : 'H'; App.render(); });
      const randomBtn = el(`<button type="button" class="btn secondary">შემთხვევითი განლაგება</button>`);
      randomBtn.addEventListener('click', () => { this.randomPlaceRemaining(idx); App.render(); });
      controls.appendChild(orientBtn);
      controls.appendChild(randomBtn);
      panel.appendChild(controls);

      if (d.placementError){
        panel.appendChild(el(`<p style="text-align:center; color:var(--rust); font-size:0.85rem; margin:6px 0 0;">${escapeHtml(d.placementError)}</p>`));
      }

      const occupied = new Set();
      board.ships.forEach(s => s.cells.forEach(c => occupied.add(c.r+','+c.c)));
      const grid = el(`<div class="bs-grid"></div>`);
      for (let r=0;r<this.BOARD_SIZE;r++){
        for (let c=0;c<this.BOARD_SIZE;c++){
          const isShip = occupied.has(r+','+c);
          const cell = el(`<button type="button" class="bs-cell ${isShip?'ship':''} ${d.selectedShipSize && !isShip ? 'clickable':''}"></button>`);
          if (d.selectedShipSize && !isShip){
            cell.addEventListener('click', () => {
              if (this.tryPlaceShip(idx, d.selectedShipSize, r, c)) App.render();
              else App.render();
            });
          }
          grid.appendChild(cell);
        }
      }
      panel.appendChild(grid);

      const proceedAfterPlacement = () => {
        if (idx === 0){
          d.placementActiveIndex = 1;
          d.placementGateRevealedFor = null;
          d.selectedShipSize = null;
          d.orientation = 'H';
          App.render();
        } else {
          d.attackerIndex = 0;
          d.gateRevealedFor = null;
          d.awaitingHandoff = false;
          d.lastMessage = '';
          d.phase = 'game';
          App.render();
        }
      };

      if (board.toPlace.length === 0){
        panel.appendChild(el(`<p style="text-align:center; color:var(--ink-soft); font-size:0.9rem; margin:12px 0 8px;">დარწმუნებული ხართ ამ განლაგებით?</p>`));
        const confirmRow = el(`<div class="action-row" style="justify-content:center;"></div>`);
        const yesBtn = el(`<button class="btn">დიახ, ასეა კარგად</button>`);
        const resetBtn = el(`<button class="btn ghost">თავიდან დალაგება</button>`);
        yesBtn.addEventListener('click', proceedAfterPlacement);
        resetBtn.addEventListener('click', () => {
          board.ships = [];
          board.toPlace = this.SHIP_SIZES.slice();
          d.selectedShipSize = null;
          d.placementError = '';
          App.render();
        });
        confirmRow.appendChild(yesBtn);
        confirmRow.appendChild(resetBtn);
        panel.appendChild(confirmRow);
      }

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- GAME ----------------------- */
    shipAt(idx, r, c){
      return this.data.boards[idx].ships.find(s => s.cells.some(cell => cell.r === r && cell.c === c));
    },

    allSunk(idx){
      return this.data.boards[idx].ships.every(s => s.hits >= s.cells.length);
    },

    fireAt(r, c){
      const d = this.data;
      const attacker = d.attackerIndex;
      const opponent = 1 - attacker;
      const key = r + ',' + c;
      if (d.shotsAt[opponent].has(key)) return;
      d.shotsAt[opponent].add(key);
      const ship = this.shipAt(opponent, r, c);
      if (ship){
        ship.hits += 1;
        if (this.allSunk(opponent)){
          d.winnerIndex = attacker;
          d.phase = 'end';
          Sound.win();
          App.render();
          return;
        }
        if (ship.hits >= ship.cells.length){
          d.lastMessage = `ჩაძირე ხომალდი (ზომა ${ship.size})! ისვრი ისევ.`;
          Sound.success();
        } else {
          d.lastMessage = 'მოხვედრა! ისვრი ისევ.';
          Sound.pop();
        }
        d.awaitingHandoff = false;
      } else {
        d.lastMessage = 'ააცდა.';
        d.awaitingHandoff = true;
        Sound.fail();
      }
      App.render();
    },

    renderGame(){
      const d = this.data;
      const attacker = d.attackerIndex;
      const opponent = 1 - attacker;
      const wrap = this.topBar(true);

      if (d.gateRevealedFor !== attacker){
        const panel = el(`<div class="panel"></div>`);
        const passCard = el(`<div class="pass-card"><div class="to-player">გადაეცი ტელეფონი: <strong>${escapeHtml(d.players[attacker])}</strong></div></div>`);
        const card = el(`<div class="flip-card">დააჭირე, რომ დაიწყო შენი სვლა 🎯</div>`);
        card.addEventListener('click', () => { d.gateRevealedFor = attacker; d.awaitingHandoff = false; App.render(); });
        passCard.appendChild(card);
        panel.appendChild(passCard);
        wrap.appendChild(panel);
        return wrap;
      }

      const panel = el(`<div class="panel"><h2>${escapeHtml(d.players[attacker])}-ის სვლა</h2></div>`);
      const remainingShips = d.boards[opponent].ships.filter(s => s.hits < s.cells.length).length;
      panel.appendChild(el(`<div class="bs-status">მოწინააღმდეგის ხომალდები დარჩენილია: ${remainingShips}</div>`));
      panel.appendChild(el(`<div class="bs-message">${escapeHtml(d.lastMessage || '')}</div>`));

      if (d.awaitingHandoff){
        const passBtn = el(`<button class="btn" style="width:100%;">ტელეფონის გადაცემა</button>`);
        passBtn.addEventListener('click', () => {
          d.attackerIndex = opponent;
          d.gateRevealedFor = null;
          d.awaitingHandoff = false;
          d.lastMessage = '';
          App.render();
        });
        panel.appendChild(passBtn);
      } else {
        const grid = el(`<div class="bs-grid"></div>`);
        for (let r=0;r<this.BOARD_SIZE;r++){
          for (let c=0;c<this.BOARD_SIZE;c++){
            const key = r+','+c;
            if (d.shotsAt[opponent].has(key)){
              const ship = this.shipAt(opponent, r, c);
              const sunk = ship && ship.hits >= ship.cells.length;
              const cell = el(`<div class="bs-cell ${ship ? (sunk?'sunk':'hit') : 'miss'}">${ship ? '✕' : '•'}</div>`);
              grid.appendChild(cell);
            } else {
              const cell = el(`<button type="button" class="bs-cell clickable"></button>`);
              cell.addEventListener('click', () => this.fireAt(r, c));
              grid.appendChild(cell);
            }
          }
        }
        panel.appendChild(grid);
      }

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- END ----------------------- */
    renderEnd(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`
        <div class="panel">
          <div class="winner-banner">
            <div class="crown">🏆</div>
            <h3>${escapeHtml(d.players[d.winnerIndex])} იმარჯვებს!</h3>
          </div>
        </div>
      `);
      const actions = el(`<div class="action-row">
        <button class="btn">იგივე მოთამაშეებით თავიდან</button>
        <button class="btn ghost">მთავარ გვერდზე</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        const names = d.players.slice();
        this.init();
        this.data.players = names;
        this.startPlacement();
      });
      actions.children[1].addEventListener('click', () => { App.clearSavedGame(App.state.view); App.goHome(); });
      panel.appendChild(actions);
      wrap.appendChild(panel);
      return wrap;
    }
  };

  /* ========================================================================
     GAME 7: ასოციაციები (ASSOCIATIONS) — everyone privately writes the
     first thing that comes to mind for a prompt word. Unlike ქალაქობანა,
     matching answers is GOOD here — points are earned for syncing with
     other players, not for being unique.
  ======================================================================== */
  const Associations = {
    data: null,

    init(){
      this.data = {
        phase: 'setup',        // rules | setup | play | review | final
        previousPhase: 'setup',
        players: [],
        mode: 'individual',     // individual | team (pairs of 2 collaborate on one answer)
        participants: [],       // built at game start: [{id, displayName}]
        totalRounds: 5,
        currentRound: 0,
        usedPromptIndices: [],
        currentPrompt: '',
        currentPlayerIndex: 0,
        roundAnswers: {},
        totals: {},
        timerSeconds: 20,
        timer: null
      };
    },

    render(){
      const d = this.data;
      if (d.phase === 'rules') return this.renderRules();
      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'play') return this.renderPlay();
      if (d.phase === 'review') return this.renderReview();
      return this.renderFinal();
    },

    topBar(showBack){
      const wrap = el(`<div></div>`);
      const bar = el(`<div class="top-bar"></div>`);
      if (showBack){
        const back = el(`<button class="back-link">← მთავარ გვერდზე</button>`);
        back.addEventListener('click', () => App.quitToMenu());
        bar.appendChild(back);
      } else {
        bar.appendChild(el(`<span></span>`));
      }
      const rulesLink = el(`<button class="rules-link">📖 წესები</button>`);
      rulesLink.addEventListener('click', () => {
        this.data.previousPhase = this.data.phase;
        this.data.phase = 'rules';
        App.render();
      });
      bar.appendChild(rulesLink);
      wrap.appendChild(bar);
      return wrap;
    },

    renderRules(){
      const wrap = el(`<div></div>`);
      const back = el(`<button class="back-link">← უკან</button>`);
      back.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      wrap.appendChild(back);

      const panel = el(`<div class="panel rulebook"><h2>ასოციაციების წესები</h2></div>`);
      panel.appendChild(el(`<p>ყოველ რაუნდში ყველას უჩნდება ერთი და იგივე სიტყვა. თითოეული, ფარულად და დანარჩენებისგან დამოუკიდებლად, წერს პირველ ასოციაციას, რაც თავში მოუვა.</p>`));
      panel.appendChild(el(`<h3>გუნდური რეჟიმი</h3>`));
      panel.appendChild(el(`<p>შეგიძლიათ ითამაშოთ წყვილებად — 2 მოთამაშე ერთად ეთანხმება ერთ პასუხზე. მინიმუმ 2 გუნდი (4 მოთამაშე), მაქსიმუმ 5 გუნდი (10 მოთამაშე). მოთამაშეები იწყვილებიან დამატების თანმიმდევრობით.</p>`));
      panel.appendChild(el(`<h3>ქულები</h3>`));
      panel.appendChild(el(`<p>აქ, ქალაქობანასგან განსხვავებით, <strong>დამთხვევა კარგია</strong>: რაც მეტ მოთამაშეს ერთნაირი პასუხი ჰქონდა, მით მეტ ქულას იღებენ ყველა ისინი. უნიკალური ან ცარიელი პასუხი 0 ქულის ტოლია.</p>`));
      panel.appendChild(el(`<h3>რჩევა</h3>`));
      panel.appendChild(el(`<p>ნუ დაფიქრდებით ზედმეტად: პირველი აზრი ხშირად ყველაზე გავრცელებულია!</p>`));

      const backBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">დაბრუნება</button>`);
      backBtn.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      panel.appendChild(backBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    renderSetup(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>ასოციაციები: მოთამაშეები</h2></div>`);

      const modeLabels = { individual:'ინდივიდუალური', team:'გუნდური (წყვილებად)' };
      const modeAcc = makeAccordion('რეჟიმი', modeLabels[d.mode]);
      modeAcc.body.appendChild(el(`<div class="chip-group mode-opts"></div>`));
      const modeGroup = modeAcc.body.querySelector('.mode-opts');
      const teamPreview = el(`<div class="chip-group" style="margin-top:10px;"></div>`);
      [['individual','ინდივიდუალური'], ['team','გუნდური (წყვილებად)']].forEach(([m,label]) => {
        const chip = el(`<button type="button" class="chip ${d.mode===m?'active':''}">${label}</button>`);
        chip.addEventListener('click', () => {
          d.mode = m;
          modeGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
          modeAcc.setSummary(modeLabels[m]);
          updateValidity();
        });
        modeGroup.appendChild(chip);
      });
      panel.appendChild(modeAcc.wrap);

      const playerField = el(`
        <div class="field-row">
          <label>დაამატე მოთამაშეები (მინიმუმ 2)</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი..." maxlength="20">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const nameInput = playerField.querySelector('input');
      const startBtn = el(`<button class="btn" style="width:100%; margin-top:6px;">დაწყება</button>`);
      const warnMsg = el(`<p style="color:var(--rust); font-size:0.85rem; margin-top:8px; display:none;"></p>`);

      const updateValidity = () => {
        const n = d.players.length;
        let valid;
        if (d.mode === 'team'){
          valid = n >= 4 && n <= 10 && n % 2 === 0;
          warnMsg.style.display = valid ? 'none' : 'block';
          if (n < 4) warnMsg.textContent = 'გუნდურ რეჟიმში მინიმუმ 4 მოთამაშეა საჭირო (2 გუნდი).';
          else if (n > 10) warnMsg.textContent = 'მაქსიმუმ 10 მოთამაშეა დაშვებული (5 გუნდი).';
          else if (n % 2 !== 0) warnMsg.textContent = 'გუნდურ რეჟიმში მოთამაშეთა რაოდენობა უნდა იყოს ლუწი.';

          teamPreview.style.display = 'flex';
          teamPreview.innerHTML = '';
          for (let i=0; i+1 < d.players.length; i+=2){
            teamPreview.appendChild(el(`<span class="chip active" style="cursor:default;">გუნდი ${i/2+1}: ${escapeHtml(d.players[i])} & ${escapeHtml(d.players[i+1])}</span>`));
          }
          if (d.players.length % 2 === 1){
            teamPreview.appendChild(el(`<span class="chip" style="cursor:default; color:var(--rust);">${escapeHtml(d.players[d.players.length-1])} — წყვილის გარეშე</span>`));
          }
        } else {
          valid = n >= 2;
          warnMsg.style.display = valid ? 'none' : 'block';
          warnMsg.textContent = 'მინიმუმ 2 მოთამაშეა საჭირო.';
          teamPreview.style.display = 'none';
          teamPreview.innerHTML = '';
        }
        startBtn.disabled = !valid;
      };
      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm" aria-label="წაშლა">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); updateValidity(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val) return;
        d.players.push(val);
        nameInput.value = '';
        renderPlayers(); updateValidity();
        nameInput.focus();
      };
      playerField.querySelector('.btn').addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPlayer(); } });
      panel.appendChild(playerField);
      panel.appendChild(teamPreview);

      const roundsAcc = makeAccordion('რაუნდების რაოდენობა', roundLabel(d.totalRounds));
      roundsAcc.body.appendChild(el(`<div class="chip-group rounds-opts"></div>`));
      const roundsGroup = roundsAcc.body.querySelector('.rounds-opts');
      [3,5,7,Infinity].forEach(r => {
        const chip = el(`<button type="button" class="chip ${d.totalRounds===r?'active':''}">${roundLabel(r)}</button>`);
        chip.addEventListener('click', () => {
          d.totalRounds = r;
          roundsGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
          roundsAcc.setSummary(roundLabel(r));
        });
        roundsGroup.appendChild(chip);
      });
      panel.appendChild(roundsAcc.wrap);

      const timerAcc = makeAccordion('დრო თითო მოთამაშეზე (წამი)', `${d.timerSeconds} წმ`);
      timerAcc.body.appendChild(el(`<div class="chip-group timer-opts"></div>`));
      const timerGroup = timerAcc.body.querySelector('.timer-opts');
      [15,20,30].forEach(sec => {
        const chip = el(`<button type="button" class="chip ${d.timerSeconds===sec?'active':''}">${sec}</button>`);
        chip.addEventListener('click', () => {
          d.timerSeconds = sec;
          timerGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
          timerAcc.setSummary(`${sec} წმ`);
        });
        timerGroup.appendChild(chip);
      });
      panel.appendChild(timerAcc.wrap);

      panel.appendChild(warnMsg);
      panel.appendChild(startBtn);

      startBtn.addEventListener('click', () => {
        if (startBtn.disabled) return;
        d.participants = [];
        if (d.mode === 'team'){
          for (let i=0; i+1 < d.players.length; i+=2){
            const displayName = `გუნდი ${i/2+1} (${d.players[i]} & ${d.players[i+1]})`;
            d.participants.push({ id: displayName, displayName });
          }
        } else {
          d.players.forEach(name => d.participants.push({ id: name, displayName: name }));
        }
        d.participants.forEach(p => d.totals[p.id] = 0);
        this.startRound();
      });

      renderPlayers();
      updateValidity();
      wrap.appendChild(panel);
      return wrap;
    },

    pickPrompt(){
      const d = this.data;
      const available = ASSOCIATION_WORDS.map((w,i)=>i).filter(i => !d.usedPromptIndices.includes(i));
      const pool = available.length ? available : ASSOCIATION_WORDS.map((w,i)=>i);
      if (!available.length) d.usedPromptIndices = [];
      const idx = pickRandom(pool);
      d.usedPromptIndices.push(idx);
      return ASSOCIATION_WORDS[idx];
    },

    startRound(){
      const d = this.data;
      d.currentRound += 1;
      d.currentPrompt = this.pickPrompt();
      d.currentPlayerIndex = 0;
      d.roundAnswers = {};
      d.phase = 'play';
      App.render();
    },

    renderPlay(){
      const d = this.data;
      const wrap = this.topBar(true);
      const participant = d.participants[d.currentPlayerIndex];
      if (!(participant.id in d.roundAnswers)) d.roundAnswers[participant.id] = '';

      const panel = el(`
        <div class="panel">
          <div class="turn-banner">რაუნდი ${d.currentRound} / ${roundLabel(d.totalRounds)}, თამაშობს: <strong>${escapeHtml(participant.displayName)}</strong></div>
          <div style="text-align:center; font-family:var(--font-display); font-size:2rem; color:var(--accent); margin:10px 0 4px;">${escapeHtml(d.currentPrompt)}</div>
          <p style="text-align:center; color:var(--ink-soft); font-size:0.9rem; margin-top:0;">${d.mode==='team' ? 'ორივემ ერთად შეთანხმდით ერთ პასუხზე:' : 'რა პირველი აზრი მოგივიდა თავში?'}</p>
        </div>
      `);
      const pauseOnNav = () => { d.timer && d.timer.pause(); };
      const backBtn = wrap.querySelector('.back-link');
      const rulesBtn = wrap.querySelector('.rules-link');
      if (backBtn) backBtn.addEventListener('click', pauseOnNav);
      if (rulesBtn) rulesBtn.addEventListener('click', pauseOnNav);

      const timerBadge = el(`<div class="timer-badge" style="display:block; width:84px; margin:0 auto 14px;">${d.timerSeconds}</div>`);
      panel.appendChild(timerBadge);

      const input = el(`<input type="text" placeholder="დაწერე ${d.mode==='team'?'გუნდის':'შენი'} ასოციაცია..." autocomplete="off" style="width:100%; padding:12px 14px; border:1.5px solid var(--paper-line); border-radius:8px; font-size:1.05rem; text-align:center;">`);
      input.addEventListener('input', () => { d.roundAnswers[participant.id] = input.value; });
      panel.appendChild(input);

      const finishBtn = el(`<button class="btn" style="width:100%; margin-top:14px;">დასრულება</button>`);
      const advance = () => {
        d.timer && d.timer.pause();
        if (d.currentPlayerIndex < d.participants.length - 1){
          d.currentPlayerIndex += 1;
          App.render();
        } else {
          d.phase = 'review';
          App.render();
        }
      };
      finishBtn.addEventListener('click', advance);
      panel.appendChild(finishBtn);
      wrap.appendChild(panel);

      d.timer = createTimer(d.timerSeconds, {
        onTick: (rem) => {
          timerBadge.textContent = Math.max(rem, 0);
          timerBadge.classList.toggle('low', rem <= 5);
        },
        onComplete: advance
      });
      d.timer.start();
      setTimeout(() => input.focus(), 30);

      return wrap;
    },

    computeRoundScores(){
      const d = this.data;
      const normalized = {};
      d.participants.forEach(p => { normalized[p.id] = (d.roundAnswers[p.id] || '').trim().toLowerCase(); });
      const counts = {};
      d.participants.forEach(p => { if (normalized[p.id]) counts[normalized[p.id]] = (counts[normalized[p.id]] || 0) + 1; });
      const result = {};
      d.participants.forEach(p => {
        const n = normalized[p.id];
        const matches = n ? counts[n] - 1 : 0;
        result[p.id] = { answer: (d.roundAnswers[p.id] || '').trim(), points: matches };
      });
      return result;
    },

    renderReview(){
      const d = this.data;
      const result = this.computeRoundScores();
      const wrap = el(`<div></div>`);
      const panel = el(`<div class="panel"><h2>რაუნდი ${d.currentRound}: "${escapeHtml(d.currentPrompt)}"</h2></div>`);

      const table = el(`<table class="review-table"><thead><tr><th>${d.mode==='team'?'გუნდი':'მოთამაშე'}</th><th>პასუხი</th><th>ქულა</th></tr></thead><tbody></tbody></table>`);
      const tbody = table.querySelector('tbody');
      d.participants.forEach(p => {
        const r = result[p.id];
        tbody.appendChild(el(`
          <tr>
            <td>${escapeHtml(p.displayName)}</td>
            <td>${r.answer ? escapeHtml(r.answer) : '<em style="color:var(--ink-soft)">—</em>'}</td>
            <td><span class="badge ${r.points>0?'unique':'invalid'}">+${r.points}</span></td>
          </tr>
        `));
      });
      panel.appendChild(table);

      const confirmBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">
        ${d.currentRound < d.totalRounds ? 'შემდეგი რაუნდი' : 'საბოლოო შედეგები'}
      </button>`);
      confirmBtn.addEventListener('click', () => {
        d.participants.forEach(p => { d.totals[p.id] += result[p.id].points; });
        if (d.currentRound < d.totalRounds) this.startRound();
        else { d.phase = 'final'; Sound.win(); App.render(); }
      });
      panel.appendChild(confirmBtn);

      if (d.totalRounds === Infinity){
        const endBtn = el(`<button class="btn ghost" style="width:100%; margin-top:8px;">თამაშის დასრულება</button>`);
        endBtn.addEventListener('click', () => {
          d.participants.forEach(p => { d.totals[p.id] += result[p.id].points; });
          d.phase = 'final';
          Sound.win();
          App.render();
        });
        panel.appendChild(endBtn);
      }

      wrap.appendChild(panel);
      return wrap;
    },

    renderFinal(){
      const d = this.data;
      const rows = d.participants.map(p => ({ name: p.displayName, score: d.totals[p.id] || 0 }));
      const sorted = rows.slice().sort((a,b)=>b.score-a.score);
      const winner = sorted[0];
      const wrap = this.topBar(true);
      const panel = el(`
        <div class="panel">
          <h2>თამაში დასრულდა</h2>
          <div class="final-winner">
            <div class="crown">🏆</div>
            <h3>${winner ? escapeHtml(winner.name) : '—'}</h3>
            <div style="color:var(--ink-soft)">გაიმარჯვა ${winner ? winner.score : 0} ქულით</div>
          </div>
        </div>
      `);
      panel.appendChild(el(`<div>${renderScoreboardList(rows)}</div>`));
      const actions = el(`<div class="action-row">
        <button class="btn">თავიდან თამაში</button>
        <button class="btn ghost">მთავარ გვერდზე</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        const names = d.players.slice();
        const mode = d.mode, rounds = d.totalRounds, secs = d.timerSeconds;
        this.init();
        this.data.players = names;
        this.data.mode = mode;
        this.data.totalRounds = rounds;
        this.data.timerSeconds = secs;
        this.data.participants = [];
        if (mode === 'team'){
          for (let i=0; i+1 < names.length; i+=2){
            const displayName = `გუნდი ${i/2+1} (${names[i]} & ${names[i+1]})`;
            this.data.participants.push({ id: displayName, displayName });
          }
        } else {
          names.forEach(name => this.data.participants.push({ id: name, displayName: name }));
        }
        this.data.participants.forEach(p => this.data.totals[p.id] = 0);
        this.startRound();
      });
      actions.children[1].addEventListener('click', () => { App.clearSavedGame(App.state.view); App.goHome(); });
      panel.appendChild(actions);
      wrap.appendChild(panel);
      return wrap;
    }
  };

  /* ========================================================================
     GAME 8: სიტყვობანა (WORD CHAIN) — each word must start with the last
     letter of the previous one. No hidden info — the whole chain is public,
     so there's no pass-and-play gate, just a shared turn tracker. A wrong
     first letter, a reused word, or a timeout eliminates that player on the
     spot; last player standing wins. Since there's no built-in Georgian
     dictionary, word realness is enforced by an honor-system "challenge"
     the group can raise right after a word is accepted.
  ======================================================================== */
  const Sitkvobana = {
    data: null,

    init(){
      this.data = {
        phase: 'setup',       // rules | setup | play | end
        previousPhase: 'setup',
        players: [],          // {name, alive}
        timerSeconds: 15,     // 15 | 30 | 45 | null (null = no time limit)
        requiredLetters: null,
        prevRequiredLetters: null,
        usedWords: [],
        activeIndex: 0,
        message: '',
        awaitingChallenge: false,
        acceptedByIndex: null,
        eliminationOrder: [],
        winner: null,
        timer: null
      };
    },

    render(){
      const d = this.data;
      if (d.phase === 'rules') return this.renderRules();
      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'end') return this.renderEnd();
      return this.renderPlay();
    },

    topBar(showBack){
      const wrap = el(`<div></div>`);
      const bar = el(`<div class="top-bar"></div>`);
      if (showBack){
        const back = el(`<button class="back-link">← მთავარ გვერდზე</button>`);
        back.addEventListener('click', () => App.quitToMenu());
        bar.appendChild(back);
      } else {
        bar.appendChild(el(`<span></span>`));
      }
      const rulesLink = el(`<button class="rules-link">📖 წესები</button>`);
      rulesLink.addEventListener('click', () => {
        this.data.previousPhase = this.data.phase;
        this.data.phase = 'rules';
        App.render();
      });
      bar.appendChild(rulesLink);
      wrap.appendChild(bar);
      return wrap;
    },

    renderRules(){
      const wrap = el(`<div></div>`);
      const back = el(`<button class="back-link">← უკან</button>`);
      back.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      wrap.appendChild(back);

      const panel = el(`<div class="panel rulebook"><h2>სიტყვობანას წესები</h2></div>`);
      panel.appendChild(el(`<p>რიგრიგობით ამბობთ სიტყვას, რომელიც უნდა იწყებოდეს წინა სიტყვის ბოლო <strong>ორი ასოთი</strong>.</p>`));
      panel.appendChild(el(`<p style="font-size:0.9rem; color:var(--ink-soft);">მაგალითად: "ლოგინი" მთავრდება "ნი"-თი, ასე რომ შემდეგი სიტყვა უნდა დაიწყოს "ნი"-თი — მაგალითად "ნიორი".</p>`));
      panel.appendChild(el(`<h3>გავარდნის პირობები</h3>`));
      panel.appendChild(el(`
        <ul>
          <li>სიტყვა არასწორი ორი ასოთი იწყება.</li>
          <li>სიტყვა უკვე ნახმარია ამ თამაშში.</li>
          <li>დრო ამოეწურა (თუ დროის ლიმიტი ჩართულია).</li>
        </ul>
      `));
      panel.appendChild(el(`<h3>დრო</h3>`));
      panel.appendChild(el(`<p>აირჩიეთ 15, 30 ან 45 წამი თითო სვლაზე, ან ითამაშეთ დროის გარეშე (დ/გ) — მაშინ დროის ამოწურვით გავარდნა არ ხდება.</p>`));
      panel.appendChild(el(`<h3>გამოწვევა</h3>`));
      panel.appendChild(el(`<p>ვინაიდან აპს არ აქვს ქართული ლექსიკონი ჩაშენებული, სიტყვის რეალურობას ჯგუფი თავად აკონტროლებს: მიღების შემდეგ ნებისმიერს შეუძლია დააჭიროს "გამოწვევას", თუ თვლის, რომ ასეთი სიტყვა არ არსებობს.</p>`));
      panel.appendChild(el(`<h3>გამარჯვება</h3>`));
      panel.appendChild(el(`<p>ბოლოს დარჩენილი მოთამაშე იმარჯვებს.</p>`));

      const backBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">დაბრუნება</button>`);
      backBtn.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      panel.appendChild(backBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    renderSetup(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>სიტყვობანა: მოთამაშეები</h2></div>`);

      const playerField = el(`
        <div class="field-row">
          <label>დაამატე მოთამაშეები (მინიმუმ 2)</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი..." maxlength="20">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const nameInput = playerField.querySelector('input');
      const startBtn = el(`<button class="btn" style="width:100%; margin-top:6px;">დაწყება</button>`);
      const warnMsg = el(`<p style="color:var(--rust); font-size:0.85rem; margin-top:8px; display:none;">მინიმუმ 2 მოთამაშეა საჭირო.</p>`);

      const updateValidity = () => {
        const valid = d.players.length >= 2;
        startBtn.disabled = !valid;
        warnMsg.style.display = valid ? 'none' : 'block';
      };
      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm" aria-label="წაშლა">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); updateValidity(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val) return;
        d.players.push(val);
        nameInput.value = '';
        renderPlayers(); updateValidity();
        nameInput.focus();
      };
      playerField.querySelector('.btn').addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPlayer(); } });
      panel.appendChild(playerField);

      const timerAcc = makeAccordion('დრო თითო სვლაზე (წამი)', d.timerSeconds === null ? 'დ/გ' : `${d.timerSeconds} წმ`);
      timerAcc.body.appendChild(el(`<div class="chip-group timer-opts"></div>`));
      const timerGroup = timerAcc.body.querySelector('.timer-opts');
      [15,30,45,null].forEach(sec => {
        const label = sec === null ? 'დ/გ' : String(sec);
        const chip = el(`<button type="button" class="chip ${d.timerSeconds===sec?'active':''}">${label}</button>`);
        chip.addEventListener('click', () => {
          d.timerSeconds = sec;
          timerGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
          timerAcc.setSummary(sec === null ? 'დ/გ' : `${sec} წმ`);
        });
        timerGroup.appendChild(chip);
      });
      panel.appendChild(timerAcc.wrap);

      panel.appendChild(warnMsg);
      panel.appendChild(startBtn);

      startBtn.addEventListener('click', () => {
        if (startBtn.disabled) return;
        this.startGame();
      });

      renderPlayers();
      updateValidity();
      wrap.appendChild(panel);
      return wrap;
    },

    startGame(){
      const d = this.data;
      d.players = d.players.map(p => (typeof p === 'string' ? { name: p, alive: true } : p));
      d.requiredLetters = null;
      d.prevRequiredLetters = null;
      d.usedWords = [];
      d.activeIndex = 0;
      d.message = '';
      d.awaitingChallenge = false;
      d.acceptedByIndex = null;
      d.eliminationOrder = [];
      d.winner = null;
      d.phase = 'play';
      App.render();
    },

    alivePlayers(d){ return d.players.filter(p => p.alive); },

    nextAliveIndex(d, from){
      const n = d.players.length;
      let i = (from + 1) % n, guard = 0;
      while (!d.players[i].alive && guard < n * 2){ i = (i + 1) % n; guard++; }
      return i;
    },

    // isCurrent(d) guards against stale deferred callbacks (e.g. a turn timer
    // that finishes after the player has already navigated away and started
    // a different game) — without this, a late timer would read/write into
    // whatever unrelated data object this.data now points to.
    isCurrent(d){ return this.data === d; },

    eliminatePlayer(d, idx, reason){
      if (!this.isCurrent(d)) return;
      d.players[idx].alive = false;
      d.eliminationOrder.push(d.players[idx].name);
      d.message = reason;
      d.awaitingChallenge = false;
      Sound.fail();
      const alive = this.alivePlayers(d);
      if (alive.length <= 1){
        d.winner = alive.length === 1 ? alive[0].name : null;
        d.phase = 'end';
        Sound.win();
        App.render();
        return;
      }
      d.activeIndex = this.nextAliveIndex(d, idx);
      App.render();
    },

    submitWord(d, raw){
      if (!this.isCurrent(d)) return;
      const word = raw.trim();
      const activeName = d.players[d.activeIndex].name;
      if (!word){
        this.eliminatePlayer(d, d.activeIndex, `${activeName}: სიტყვა არ დაწერა.`);
        return;
      }
      if (d.requiredLetters && word.slice(0, d.requiredLetters.length) !== d.requiredLetters){
        this.eliminatePlayer(d, d.activeIndex, `${activeName}: სიტყვა არასწორი ასოებით იწყებოდა (საჭირო იყო "${d.requiredLetters}").`);
        return;
      }
      const norm = word.toLowerCase();
      if (d.usedWords.some(w => w.toLowerCase() === norm)){
        this.eliminatePlayer(d, d.activeIndex, `${activeName}: სიტყვა უკვე გამოყენებულია.`);
        return;
      }
      d.prevRequiredLetters = d.requiredLetters;
      d.usedWords.push(word);
      d.requiredLetters = word.slice(-2);
      d.acceptedByIndex = d.activeIndex;
      d.awaitingChallenge = true;
      d.message = '';
      App.render();
    },

    challengeWord(d){
      if (!this.isCurrent(d)) return;
      const idx = d.acceptedByIndex;
      d.usedWords.pop();
      d.requiredLetters = d.prevRequiredLetters;
      this.eliminatePlayer(d, idx, `${d.players[idx].name}: სიტყვას გამოწვევა გაუკეთეს (არარსებული სიტყვა).`);
    },

    acceptContinue(d){
      if (!this.isCurrent(d)) return;
      d.awaitingChallenge = false;
      d.message = '';
      d.activeIndex = this.nextAliveIndex(d, d.acceptedByIndex);
      App.render();
    },

    renderPlay(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>სიტყვობანა</h2></div>`);
      const pauseOnNav = () => { d.timer && d.timer.pause(); };
      const bkBtn = wrap.querySelector('.back-link');
      const rlBtn = wrap.querySelector('.rules-link');
      if (bkBtn) bkBtn.addEventListener('click', pauseOnNav);
      if (rlBtn) rlBtn.addEventListener('click', pauseOnNav);

      if (d.message){
        panel.appendChild(el(`<div class="turn-note" style="color:var(--rust);">${escapeHtml(d.message)}</div>`));
      }

      if (d.usedWords.length){
        const chain = el(`<div class="chip-group" style="margin-bottom:14px;"></div>`);
        d.usedWords.slice(-6).forEach(w => chain.appendChild(el(`<span class="chip active" style="cursor:default;">${escapeHtml(w)}</span>`)));
        panel.appendChild(chain);
      }

      if (d.awaitingChallenge){
        const lastWord = d.usedWords[d.usedWords.length - 1];
        panel.appendChild(el(`
          <div class="narration-box">"${escapeHtml(lastWord)}" მიღებულია.<br>
          გინდათ ვინმეს გამოწვევა (თუ ეს რეალური სიტყვა არ არის)?</div>
        `));
        const btnRow = el(`<div class="action-row" style="justify-content:center;"></div>`);
        const challengeBtn = el(`<button class="btn secondary">გამოწვევა: არ არსებობს</button>`);
        const continueBtn = el(`<button class="btn">გაგრძელება</button>`);
        challengeBtn.addEventListener('click', () => this.challengeWord(d));
        continueBtn.addEventListener('click', () => this.acceptContinue(d));
        btnRow.appendChild(challengeBtn);
        btnRow.appendChild(continueBtn);
        panel.appendChild(btnRow);
        wrap.appendChild(panel);
        return wrap;
      }

      const activeName = d.players[d.activeIndex].name;
      panel.appendChild(el(`<div class="turn-banner">დგას: <strong>${escapeHtml(activeName)}</strong></div>`));
      panel.appendChild(el(`
        <div style="text-align:center; margin:6px 0 14px;">
          ${d.requiredLetters
            ? `<span style="color:var(--ink-soft); font-size:0.9rem;">სიტყვა უნდა იწყებოდეს ამ ორი ასოთი</span><div class="letter-hero" style="margin:8px auto; font-size:2.2rem; width:auto; min-width:84px; padding:0 10px;">${escapeHtml(d.requiredLetters)}</div>`
