      return wrap;
    },

    /* ----------------------- SETUP ----------------------- */
    renderSetup(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>საზღვაო ბრძოლა — მოთამაშეები</h2></div>`);

      const playerField = el(`
        <div class="field-row">
          <label>ორი მოთამაშის სახელი</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი..." maxlength="20">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const nameInput = playerField.querySelector('input');
      const startBtn = el(`<button class="btn" style="width:100%; margin-top:6px;">ხომალდების განლაგება</button>`);
      const warnMsg = el(`<p style="color:var(--rust); font-size:0.85rem; margin-top:8px;"></p>`);

      const updateValidity = () => {
        const n = d.players.length;
        startBtn.disabled = n !== 2;
        warnMsg.style.display = n === 2 ? 'none' : 'block';
        warnMsg.textContent = 'ზუსტად 2 მოთამაშეა საჭირო.';
      };
      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm" aria-label="წაშლა">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); updateValidity(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val || d.players.length >= 2) return;
        d.players.push(val);
        nameInput.value = '';
        renderPlayers(); updateValidity();
        nameInput.focus();
      };
      playerField.querySelector('.btn').addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPlayer(); } });
      panel.appendChild(playerField);
      panel.appendChild(warnMsg);
      panel.appendChild(startBtn);

      startBtn.addEventListener('click', () => {
        if (startBtn.disabled) return;
        this.startPlacement();
      });

      renderPlayers();
      updateValidity();
      wrap.appendChild(panel);
      return wrap;
    },

    startPlacement(){
      const d = this.data;
      d.boards = [0,1].map(() => ({ ships: [], toPlace: this.SHIP_SIZES.slice() }));
      d.shotsAt = [new Set(), new Set()];
      d.placementActiveIndex = 0;
      d.placementGateRevealedFor = null;
      d.selectedShipSize = null;
      d.orientation = 'H';
      d.placementError = '';
      d.phase = 'placement';
      App.render();
    },

    /* ----------------------- PLACEMENT ----------------------- */
    shipCellsFor(size, r, c, orientation){
      const cells = [];
      for (let i=0;i<size;i++){
        cells.push(orientation === 'H' ? { r, c: c+i } : { r: r+i, c });
      }
      return cells;
    },

    canPlace(idx, cells){
      const n = this.BOARD_SIZE;
      for (const cell of cells){
        if (cell.r < 0 || cell.r >= n || cell.c < 0 || cell.c >= n) return false;
      }
      const occupied = new Set();
      this.data.boards[idx].ships.forEach(s => s.cells.forEach(c => occupied.add(c.r+','+c.c)));
      for (const cell of cells){ if (occupied.has(cell.r+','+cell.c)) return false; }
      return true;
    },

    tryPlaceShip(idx, size, r, c){
      const d = this.data;
      const cells = this.shipCellsFor(size, r, c, d.orientation);
      if (!this.canPlace(idx, cells)){
        d.placementError = 'ხომალდი ვერ თავსდება აქ.';
        return false;
      }
      d.boards[idx].ships.push({ cells, size, hits: 0 });
      const pos = d.boards[idx].toPlace.indexOf(size);
      if (pos !== -1) d.boards[idx].toPlace.splice(pos, 1);
      d.selectedShipSize = null;
      d.placementError = '';
      return true;
    },

    randomPlaceRemaining(idx){
      const d = this.data;
      const remaining = d.boards[idx].toPlace.slice();
      remaining.forEach(size => {
        let placed = false, attempts = 0;
        while (!placed && attempts < 300){
          attempts++;
          const orientation = Math.random() < 0.5 ? 'H' : 'V';
          const r = Math.floor(Math.random() * this.BOARD_SIZE);
          const c = Math.floor(Math.random() * this.BOARD_SIZE);
          const cells = this.shipCellsFor(size, r, c, orientation);
          if (this.canPlace(idx, cells)){
            d.boards[idx].ships.push({ cells, size, hits: 0 });
            const pos = d.boards[idx].toPlace.indexOf(size);
            if (pos !== -1) d.boards[idx].toPlace.splice(pos, 1);
            placed = true;
          }
        }
      });
      d.placementError = '';
      d.selectedShipSize = null;
    },

    renderPlacement(){
      const d = this.data;
      const idx = d.placementActiveIndex;
      const wrap = this.topBar(false);

      if (d.placementGateRevealedFor !== idx){
        const passCard = el(`<div class="panel"><div class="pass-card"><div class="to-player">გადაეცი ტელეფონი: <strong>${escapeHtml(d.players[idx])}</strong></div></div></div>`);
        const card = el(`<div class="flip-card">დააჭირე, რომ დაიწყო ხომალდების განლაგება 🚢</div>`);
        card.addEventListener('click', () => { d.placementGateRevealedFor = idx; App.render(); });
        passCard.querySelector('.pass-card').appendChild(card);
        wrap.appendChild(passCard);
        return wrap;
      }

      const panel = el(`<div class="panel"><h2>განალაგე ხომალდები — ${escapeHtml(d.players[idx])}</h2></div>`);
      const board = d.boards[idx];

      const tray = el(`<div class="ship-tray"></div>`);
      // build tray from toPlace list directly (each remaining ship is its own selectable chip)
      board.toPlace.forEach((size, i) => {
        const chip = el(`<button type="button" class="chip ${d.selectedShipSize === size ? 'active':''}">ხომალდი (${size})</button>`);
        chip.addEventListener('click', () => { d.selectedShipSize = size; d.placementError=''; App.render(); });
        tray.appendChild(chip);
      });
      if (!board.toPlace.length){
        tray.appendChild(el(`<span class="role-tag">ყველა ხომალდი განლაგებულია ✓</span>`));
      }
      panel.appendChild(tray);

      const controls = el(`<div class="action-row" style="justify-content:center;"></div>`);
      const orientBtn = el(`<button type="button" class="btn ghost">მიმართულება: ${d.orientation === 'H' ? 'ჰორიზონტალური' : 'ვერტიკალური'}</button>`);
      orientBtn.addEventListener('click', () => { d.orientation = d.orientation === 'H' ? 'V' : 'H'; App.render(); });
      const randomBtn = el(`<button type="button" class="btn secondary">შემთხვევითი განლაგება</button>`);
      randomBtn.addEventListener('click', () => { this.randomPlaceRemaining(idx); App.render(); });
      controls.appendChild(orientBtn);
      controls.appendChild(randomBtn);
      panel.appendChild(controls);

      if (d.placementError){
        panel.appendChild(el(`<p style="text-align:center; color:var(--rust); font-size:0.85rem; margin:6px 0 0;">${escapeHtml(d.placementError)}</p>`));
      }

      const occupied = new Set();
      board.ships.forEach(s => s.cells.forEach(c => occupied.add(c.r+','+c.c)));
      const grid = el(`<div class="bs-grid"></div>`);
      for (let r=0;r<this.BOARD_SIZE;r++){
        for (let c=0;c<this.BOARD_SIZE;c++){
          const isShip = occupied.has(r+','+c);
          const cell = el(`<button type="button" class="bs-cell ${isShip?'ship':''} ${d.selectedShipSize && !isShip ? 'clickable':''}"></button>`);
          if (d.selectedShipSize && !isShip){
            cell.addEventListener('click', () => {
              if (this.tryPlaceShip(idx, d.selectedShipSize, r, c)) App.render();
              else App.render();
            });
          }
          grid.appendChild(cell);
        }
      }
      panel.appendChild(grid);

      const readyBtn = el(`<button class="btn" style="width:100%; margin-top:8px;" ${board.toPlace.length ? 'disabled':''}>მზადაა</button>`);
      readyBtn.addEventListener('click', () => {
        if (board.toPlace.length) return;
        if (idx === 0){
          d.placementActiveIndex = 1;
          d.placementGateRevealedFor = null;
          d.selectedShipSize = null;
          d.orientation = 'H';
          App.render();
        } else {
          d.attackerIndex = 0;
          d.gateRevealedFor = null;
          d.awaitingHandoff = false;
          d.lastMessage = '';
          d.phase = 'game';
          App.render();
        }
      });
      panel.appendChild(readyBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- GAME ----------------------- */
    shipAt(idx, r, c){
      return this.data.boards[idx].ships.find(s => s.cells.some(cell => cell.r === r && cell.c === c));
    },

    allSunk(idx){
      return this.data.boards[idx].ships.every(s => s.hits >= s.cells.length);
    },

    fireAt(r, c){
      const d = this.data;
      const attacker = d.attackerIndex;
      const opponent = 1 - attacker;
      const key = r + ',' + c;
      if (d.shotsAt[opponent].has(key)) return;
      d.shotsAt[opponent].add(key);
      const ship = this.shipAt(opponent, r, c);
      if (ship){
        ship.hits += 1;
        if (this.allSunk(opponent)){
          d.winnerIndex = attacker;
          d.phase = 'end';
          App.render();
          return;
        }
        d.lastMessage = (ship.hits >= ship.cells.length)
          ? `ჩაძირე ხომალდი (ზომა ${ship.size})! ისვრი ისევ.`
          : 'მოხვედრა! ისვრი ისევ.';
        d.awaitingHandoff = false;
      } else {
        d.lastMessage = 'ააცდა.';
        d.awaitingHandoff = true;
      }
      App.render();
    },

    renderGame(){
      const d = this.data;
      const attacker = d.attackerIndex;
      const opponent = 1 - attacker;
      const wrap = this.topBar(true);

      if (d.gateRevealedFor !== attacker){
        const panel = el(`<div class="panel"></div>`);
        const passCard = el(`<div class="pass-card"><div class="to-player">გადაეცი ტელეფონი: <strong>${escapeHtml(d.players[attacker])}</strong></div></div>`);
        const card = el(`<div class="flip-card">დააჭირე, რომ დაიწყო შენი სვლა 🎯</div>`);
        card.addEventListener('click', () => { d.gateRevealedFor = attacker; d.awaitingHandoff = false; App.render(); });
        passCard.appendChild(card);
        panel.appendChild(passCard);
        wrap.appendChild(panel);
        return wrap;
      }

      const panel = el(`<div class="panel"><h2>${escapeHtml(d.players[attacker])}-ის სვლა</h2></div>`);
      const remainingShips = d.boards[opponent].ships.filter(s => s.hits < s.cells.length).length;
      panel.appendChild(el(`<div class="bs-status">მოწინააღმდეგის ხომალდები დარჩენილია: ${remainingShips}</div>`));
      panel.appendChild(el(`<div class="bs-message">${escapeHtml(d.lastMessage || '')}</div>`));

      if (d.awaitingHandoff){
        const passBtn = el(`<button class="btn" style="width:100%;">ტელეფონის გადაცემა</button>`);
        passBtn.addEventListener('click', () => {
          d.attackerIndex = opponent;
          d.gateRevealedFor = null;
          d.awaitingHandoff = false;
          d.lastMessage = '';
          App.render();
        });
        panel.appendChild(passBtn);
      } else {
        const grid = el(`<div class="bs-grid"></div>`);
        for (let r=0;r<this.BOARD_SIZE;r++){
          for (let c=0;c<this.BOARD_SIZE;c++){
            const key = r+','+c;
            if (d.shotsAt[opponent].has(key)){
              const ship = this.shipAt(opponent, r, c);
              const sunk = ship && ship.hits >= ship.cells.length;
              const cell = el(`<div class="bs-cell ${ship ? (sunk?'sunk':'hit') : 'miss'}">${ship ? '✕' : '•'}</div>`);
              grid.appendChild(cell);
            } else {
              const cell = el(`<button type="button" class="bs-cell clickable"></button>`);
              cell.addEventListener('click', () => this.fireAt(r, c));
              grid.appendChild(cell);
            }
          }
        }
        panel.appendChild(grid);
      }

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- END ----------------------- */
    renderEnd(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`
        <div class="panel">
          <div class="winner-banner">
            <div class="crown">🏆</div>
            <h3>${escapeHtml(d.players[d.winnerIndex])} იმარჯვებს!</h3>
          </div>
        </div>
      `);
      const actions = el(`<div class="action-row">
        <button class="btn">იგივე მოთამაშეებით თავიდან</button>
        <button class="btn ghost">მთავარ გვერდზე</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        const names = d.players.slice();
        this.init();
        this.data.players = names;
        this.startPlacement();
      });
      actions.children[1].addEventListener('click', () => App.goHome());
      panel.appendChild(actions);
      wrap.appendChild(panel);
      return wrap;
    }
  };

  /* ========================================================================
     GAME 7: ასოციაციები (ASSOCIATIONS) — everyone privately writes the
     first thing that comes to mind for a prompt word. Unlike ქალაქობანა,
     matching answers is GOOD here — points are earned for syncing with
     other players, not for being unique.
  ======================================================================== */
  const Associations = {
    data: null,

    init(){
      this.data = {
        phase: 'setup',        // rules | setup | play | review | final
        previousPhase: 'setup',
        players: [],
        totalRounds: 5,
        currentRound: 0,
        usedPromptIndices: [],
        currentPrompt: '',
        currentPlayerIndex: 0,
        roundAnswers: {},
        totals: {},
        timerSeconds: 20,
        timer: null
      };
    },

    render(){
      const d = this.data;
      if (d.phase === 'rules') return this.renderRules();
      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'play') return this.renderPlay();
      if (d.phase === 'review') return this.renderReview();
      return this.renderFinal();
    },

    topBar(showBack){
      const wrap = el(`<div></div>`);
      const bar = el(`<div class="top-bar"></div>`);
      if (showBack){
        const back = el(`<button class="back-link">← მთავარ გვერდზე</button>`);
        back.addEventListener('click', () => App.goHome());
        bar.appendChild(back);
      } else {
        bar.appendChild(el(`<span></span>`));
      }
      const rulesLink = el(`<button class="rules-link">📖 წესები</button>`);
      rulesLink.addEventListener('click', () => {
        this.data.previousPhase = this.data.phase;
        this.data.phase = 'rules';
        App.render();
      });
      bar.appendChild(rulesLink);
      wrap.appendChild(bar);
      return wrap;
    },

    renderRules(){
      const wrap = el(`<div></div>`);
      const back = el(`<button class="back-link">← უკან</button>`);
      back.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      wrap.appendChild(back);

      const panel = el(`<div class="panel rulebook"><h2>ასოციაციების წესები</h2></div>`);
      panel.appendChild(el(`<p>ყოველ რაუნდში ყველას უჩნდება ერთი და იგივე სიტყვა. თითოეული, ფარულად და დანარჩენებისგან დამოუკიდებლად, წერს პირველ ასოციაციას, რაც თავში მოუვა.</p>`));
      panel.appendChild(el(`<h3>ქულები</h3>`));
      panel.appendChild(el(`<p>აქ, ქალაქობანასგან განსხვავებით, <strong>დამთხვევა კარგია</strong> — რაც მეტ მოთამაშეს ერთნაირი პასუხი ჰქონდა, მით მეტ ქულას იღებენ ყველა ისინი. უნიკალური ან ცარიელი პასუხი 0 ქულის ტოლია.</p>`));
      panel.appendChild(el(`<h3>რჩევა</h3>`));
      panel.appendChild(el(`<p>ნუ დაფიქრდებით ზედმეტად — პირველი აზრი ხშირად ყველაზე გავრცელებულია!</p>`));

      const backBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">დაბრუნება</button>`);
      backBtn.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      panel.appendChild(backBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    renderSetup(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>ასოციაციები — მოთამაშეები</h2></div>`);

      const playerField = el(`
        <div class="field-row">
          <label>დაამატე მოთამაშეები (მინიმუმ 2)</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი..." maxlength="20">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const nameInput = playerField.querySelector('input');
      const startBtn = el(`<button class="btn" style="width:100%; margin-top:6px;">დაწყება</button>`);
      const warnMsg = el(`<p style="color:var(--rust); font-size:0.85rem; margin-top:8px; display:none;">მინიმუმ 2 მოთამაშეა საჭირო.</p>`);

      const updateValidity = () => {
        const valid = d.players.length >= 2;
        startBtn.disabled = !valid;
        warnMsg.style.display = valid ? 'none' : 'block';
      };
      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm" aria-label="წაშლა">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); updateValidity(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val) return;
        d.players.push(val);
        nameInput.value = '';
        renderPlayers(); updateValidity();
        nameInput.focus();
      };
      playerField.querySelector('.btn').addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPlayer(); } });
      panel.appendChild(playerField);

      const roundsField = el(`<div class="field-row"><label>რაუნდების რაოდენობა</label><div class="chip-group rounds-opts"></div></div>`);
      const roundsGroup = roundsField.querySelector('.rounds-opts');
      [3,5,7].forEach(r => {
        const chip = el(`<button type="button" class="chip ${d.totalRounds===r?'active':''}">${r}</button>`);
        chip.addEventListener('click', () => {
          d.totalRounds = r;
          roundsGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
        });
        roundsGroup.appendChild(chip);
      });
      panel.appendChild(roundsField);

      const timerField = el(`<div class="field-row"><label>დრო თითო მოთამაშეზე (წამი)</label><div class="chip-group timer-opts"></div></div>`);
      const timerGroup = timerField.querySelector('.timer-opts');
      [15,20,30].forEach(sec => {
        const chip = el(`<button type="button" class="chip ${d.timerSeconds===sec?'active':''}">${sec}</button>`);
        chip.addEventListener('click', () => {
          d.timerSeconds = sec;
          timerGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
        });
        timerGroup.appendChild(chip);
      });
      panel.appendChild(timerField);

      panel.appendChild(warnMsg);
      panel.appendChild(startBtn);

      startBtn.addEventListener('click', () => {
        if (startBtn.disabled) return;
        d.players.forEach(p => d.totals[p] = 0);
        this.startRound();
      });

      renderPlayers();
      updateValidity();
      wrap.appendChild(panel);
      return wrap;
    },

    pickPrompt(){
      const d = this.data;
      const available = ASSOCIATION_WORDS.map((w,i)=>i).filter(i => !d.usedPromptIndices.includes(i));
      const pool = available.length ? available : ASSOCIATION_WORDS.map((w,i)=>i);
      if (!available.length) d.usedPromptIndices = [];
      const idx = pickRandom(pool);
      d.usedPromptIndices.push(idx);
      return ASSOCIATION_WORDS[idx];
    },

    startRound(){
      const d = this.data;
      d.currentRound += 1;
      d.currentPrompt = this.pickPrompt();
      d.currentPlayerIndex = 0;
      d.roundAnswers = {};
      d.phase = 'play';
      App.render();
    },

    renderPlay(){
      const d = this.data;
      const wrap = this.topBar(true);
      const playerName = d.players[d.currentPlayerIndex];
      if (!(playerName in d.roundAnswers)) d.roundAnswers[playerName] = '';

      const panel = el(`
        <div class="panel">
          <div class="turn-banner">რაუნდი ${d.currentRound} / ${d.totalRounds} — თამაშობს: <strong>${escapeHtml(playerName)}</strong></div>
          <div style="text-align:center; font-family:var(--font-display); font-size:2rem; color:var(--accent); margin:10px 0 4px;">${escapeHtml(d.currentPrompt)}</div>
          <p style="text-align:center; color:var(--ink-soft); font-size:0.9rem; margin-top:0;">რა პირველი აზრი მოგივიდა თავში?</p>
        </div>
      `);
      const pauseOnNav = () => { d.timer && d.timer.pause(); };
      const backBtn = wrap.querySelector('.back-link');
      const rulesBtn = wrap.querySelector('.rules-link');
      if (backBtn) backBtn.addEventListener('click', pauseOnNav);
      if (rulesBtn) rulesBtn.addEventListener('click', pauseOnNav);

      const timerBadge = el(`<div class="timer-badge" style="display:block; width:84px; margin:0 auto 14px;">${d.timerSeconds}</div>`);
      panel.appendChild(timerBadge);

      const input = el(`<input type="text" placeholder="დაწერე შენი ასოციაცია..." autocomplete="off" style="width:100%; padding:12px 14px; border:1.5px solid var(--paper-line); border-radius:8px; font-size:1.05rem; text-align:center;">`);
      input.addEventListener('input', () => { d.roundAnswers[playerName] = input.value; });
      panel.appendChild(input);

      const finishBtn = el(`<button class="btn" style="width:100%; margin-top:14px;">დასრულება</button>`);
      const advance = () => {
        d.timer && d.timer.pause();
        if (d.currentPlayerIndex < d.players.length - 1){
          d.currentPlayerIndex += 1;
          App.render();
        } else {
          d.phase = 'review';
          App.render();
        }
      };
      finishBtn.addEventListener('click', advance);
      panel.appendChild(finishBtn);
      wrap.appendChild(panel);

      d.timer = createTimer(d.timerSeconds, {
        onTick: (rem) => {
          timerBadge.textContent = Math.max(rem, 0);
          timerBadge.classList.toggle('low', rem <= 5);
        },
        onComplete: advance
      });
      d.timer.start();
      setTimeout(() => input.focus(), 30);

      return wrap;
    },

    computeRoundScores(){
      const d = this.data;
      const normalized = {};
      d.players.forEach(p => { normalized[p] = (d.roundAnswers[p] || '').trim().toLowerCase(); });
      const counts = {};
      d.players.forEach(p => { if (normalized[p]) counts[normalized[p]] = (counts[normalized[p]] || 0) + 1; });
      const result = {};
      d.players.forEach(p => {
        const n = normalized[p];
        const matches = n ? counts[n] - 1 : 0;
        result[p] = { answer: (d.roundAnswers[p] || '').trim(), points: matches };
      });
      return result;
    },

    renderReview(){
      const d = this.data;
      const result = this.computeRoundScores();
      const wrap = el(`<div></div>`);
      const panel = el(`<div class="panel"><h2>რაუნდი ${d.currentRound} — "${escapeHtml(d.currentPrompt)}"</h2></div>`);

      const table = el(`<table class="review-table"><thead><tr><th>მოთამაშე</th><th>პასუხი</th><th>ქულა</th></tr></thead><tbody></tbody></table>`);
      const tbody = table.querySelector('tbody');
      d.players.forEach(p => {
        const r = result[p];
        tbody.appendChild(el(`
          <tr>
            <td>${escapeHtml(p)}</td>
            <td>${r.answer ? escapeHtml(r.answer) : '<em style="color:var(--ink-soft)">—</em>'}</td>
            <td><span class="badge ${r.points>0?'unique':'invalid'}">+${r.points}</span></td>
          </tr>
        `));
      });
      panel.appendChild(table);

      const confirmBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">
        ${d.currentRound < d.totalRounds ? 'შემდეგი რაუნდი' : 'საბოლოო შედეგები'}
      </button>`);
      confirmBtn.addEventListener('click', () => {
        d.players.forEach(p => { d.totals[p] += result[p].points; });
        if (d.currentRound < d.totalRounds) this.startRound();
        else { d.phase = 'final'; App.render(); }
      });
      panel.appendChild(confirmBtn);
      wrap.appendChild(panel);
      return wrap;
    },

    renderFinal(){
      const d = this.data;
      const players = d.players.map(p => ({ name: p, score: d.totals[p] || 0 }));
      const sorted = players.slice().sort((a,b)=>b.score-a.score);
      const winner = sorted[0];
      const wrap = this.topBar(true);
      const panel = el(`
        <div class="panel">
          <h2>თამაში დასრულდა</h2>
          <div class="final-winner">
            <div class="crown">🏆</div>
            <h3>${winner ? escapeHtml(winner.name) : '—'}</h3>
            <div style="color:var(--ink-soft)">გაიმარჯვა ${winner ? winner.score : 0} ქულით</div>
          </div>
        </div>
      `);
      panel.appendChild(el(`<div>${renderScoreboardList(players)}</div>`));
      const actions = el(`<div class="action-row">
        <button class="btn">თავიდან თამაში</button>
        <button class="btn ghost">მთავარ გვერდზე</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        const names = d.players.slice();
        const rounds = d.totalRounds, secs = d.timerSeconds;
        this.init();
        this.data.players = names;
        this.data.totalRounds = rounds;
        this.data.timerSeconds = secs;
        names.forEach(p => this.data.totals[p] = 0);
        this.startRound();
      });
      actions.children[1].addEventListener('click', () => App.goHome());
      panel.appendChild(actions);
      wrap.appendChild(panel);
      return wrap;
    }
  };

  /* ========================================================================
     GAME 8: სიტყვობანა (WORD CHAIN) — each word must start with the last
     letter of the previous one. No hidden info — the whole chain is public,
     so there's no pass-and-play gate, just a shared turn tracker. A wrong
     first letter, a reused word, or a timeout eliminates that player on the
     spot; last player standing wins. Since there's no built-in Georgian
     dictionary, word realness is enforced by an honor-system "challenge"
     the group can raise right after a word is accepted.
  ======================================================================== */
  const Sitkvobana = {
    data: null,

    init(){
      this.data = {
        phase: 'setup',       // rules | setup | play | end
        previousPhase: 'setup',
        players: [],          // {name, alive}
        timerSeconds: 15,
        requiredLetter: null,
        prevRequiredLetter: null,
        usedWords: [],
        activeIndex: 0,
        message: '',
        awaitingChallenge: false,
        acceptedByIndex: null,
        eliminationOrder: [],
        winner: null,
        timer: null
      };
    },

    render(){
      const d = this.data;
      if (d.phase === 'rules') return this.renderRules();
      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'end') return this.renderEnd();
      return this.renderPlay();
    },

    topBar(showBack){
      const wrap = el(`<div></div>`);
      const bar = el(`<div class="top-bar"></div>`);
      if (showBack){
        const back = el(`<button class="back-link">← მთავარ გვერდზე</button>`);
        back.addEventListener('click', () => App.goHome());
        bar.appendChild(back);
      } else {
        bar.appendChild(el(`<span></span>`));
      }
      const rulesLink = el(`<button class="rules-link">📖 წესები</button>`);
      rulesLink.addEventListener('click', () => {
        this.data.previousPhase = this.data.phase;
        this.data.phase = 'rules';
        App.render();
      });
      bar.appendChild(rulesLink);
      wrap.appendChild(bar);
      return wrap;
    },

    renderRules(){
      const wrap = el(`<div></div>`);
      const back = el(`<button class="back-link">← უკან</button>`);
      back.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      wrap.appendChild(back);

      const panel = el(`<div class="panel rulebook"><h2>სიტყვობანას წესები</h2></div>`);
      panel.appendChild(el(`<p>რიგრიგობით ამბობთ სიტყვას, რომელიც უნდა იწყებოდეს წინა სიტყვის ბოლო ასოთი.</p>`));
      panel.appendChild(el(`<h3>გავარდნის პირობები</h3>`));
      panel.appendChild(el(`
        <ul>
          <li>სიტყვა არასწორ ასოზე იწყება.</li>
          <li>სიტყვა უკვე ნახმარია ამ თამაშში.</li>
          <li>დრო ამოეწურა.</li>
        </ul>
      `));
      panel.appendChild(el(`<h3>გამოწვევა</h3>`));
      panel.appendChild(el(`<p>ვინაიდან აპს არ აქვს ქართული ლექსიკონი ჩაშენებული, სიტყვის რეალურობას ჯგუფი თავად აკონტროლებს — მიღების შემდეგ ნებისმიერს შეუძლია დააჭიროს "გამოწვევას", თუ თვლის, რომ ასეთი სიტყვა არ არსებობს.</p>`));
      panel.appendChild(el(`<h3>გამარჯვება</h3>`));
      panel.appendChild(el(`<p>ბოლოს დარჩენილი მოთამაშე იმარჯვებს.</p>`));

      const backBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">დაბრუნება</button>`);
      backBtn.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      panel.appendChild(backBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    renderSetup(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>სიტყვობანა — მოთამაშეები</h2></div>`);

      const playerField = el(`
        <div class="field-row">
          <label>დაამატე მოთამაშეები (მინიმუმ 2)</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი..." maxlength="20">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const nameInput = playerField.querySelector('input');
      const startBtn = el(`<button class="btn" style="width:100%; margin-top:6px;">დაწყება</button>`);
      const warnMsg = el(`<p style="color:var(--rust); font-size:0.85rem; margin-top:8px; display:none;">მინიმუმ 2 მოთამაშეა საჭირო.</p>`);

      const updateValidity = () => {
        const valid = d.players.length >= 2;
        startBtn.disabled = !valid;
        warnMsg.style.display = valid ? 'none' : 'block';
      };
      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm" aria-label="წაშლა">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); updateValidity(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val) return;
        d.players.push(val);
        nameInput.value = '';
        renderPlayers(); updateValidity();
        nameInput.focus();
      };
      playerField.querySelector('.btn').addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPlayer(); } });
      panel.appendChild(playerField);

      const timerField = el(`<div class="field-row"><label>დრო თითო სვლაზე (წამი)</label><div class="chip-group timer-opts"></div></div>`);
      const timerGroup = timerField.querySelector('.timer-opts');
      [10,15,20].forEach(sec => {
        const chip = el(`<button type="button" class="chip ${d.timerSeconds===sec?'active':''}">${sec}</button>`);
        chip.addEventListener('click', () => {
          d.timerSeconds = sec;
          timerGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
        });
        timerGroup.appendChild(chip);
      });
      panel.appendChild(timerField);

      panel.appendChild(warnMsg);
      panel.appendChild(startBtn);

      startBtn.addEventListener('click', () => {
        if (startBtn.disabled) return;
        this.startGame();
      });

      renderPlayers();
      updateValidity();
      wrap.appendChild(panel);
      return wrap;
    },

    startGame(){
      const d = this.data;
      d.players = d.players.map(p => (typeof p === 'string' ? { name: p, alive: true } : p));
      d.requiredLetter = null;
      d.prevRequiredLetter = null;
      d.usedWords = [];
      d.activeIndex = 0;
      d.message = '';
      d.awaitingChallenge = false;
      d.acceptedByIndex = null;
      d.eliminationOrder = [];
      d.winner = null;
      d.phase = 'play';
      App.render();
    },

    alivePlayers(d){ return d.players.filter(p => p.alive); },

    nextAliveIndex(d, from){
      const n = d.players.length;
      let i = (from + 1) % n, guard = 0;
      while (!d.players[i].alive && guard < n * 2){ i = (i + 1) % n; guard++; }
      return i;
    },

    // isCurrent(d) guards against stale deferred callbacks (e.g. a turn timer
    // that finishes after the player has already navigated away and started
    // a different game) — without this, a late timer would read/write into
    // whatever unrelated data object this.data now points to.
    isCurrent(d){ return this.data === d; },

    eliminatePlayer(d, idx, reason){
      if (!this.isCurrent(d)) return;
      d.players[idx].alive = false;
      d.eliminationOrder.push(d.players[idx].name);
      d.message = reason;
      d.awaitingChallenge = false;
      const alive = this.alivePlayers(d);
      if (alive.length <= 1){
        d.winner = alive.length === 1 ? alive[0].name : null;
        d.phase = 'end';
        App.render();
        return;
      }
      d.activeIndex = this.nextAliveIndex(d, idx);
      App.render();
    },

    submitWord(d, raw){
      if (!this.isCurrent(d)) return;
      const word = raw.trim();
      const activeName = d.players[d.activeIndex].name;
      if (!word){
        this.eliminatePlayer(d, d.activeIndex, `${activeName} — სიტყვა არ დაწერა.`);
        return;
      }
      const firstLetter = word[0];
      if (d.requiredLetter && firstLetter !== d.requiredLetter){
        this.eliminatePlayer(d, d.activeIndex, `${activeName} — სიტყვა არასწორ ასოზე იწყებოდა (საჭირო იყო "${d.requiredLetter}").`);
        return;
      }
      const norm = word.toLowerCase();
      if (d.usedWords.some(w => w.toLowerCase() === norm)){
        this.eliminatePlayer(d, d.activeIndex, `${activeName} — სიტყვა უკვე გამოყენებულია.`);
        return;
      }
      d.prevRequiredLetter = d.requiredLetter;
      d.usedWords.push(word);
      d.requiredLetter = word[word.length - 1];
      d.acceptedByIndex = d.activeIndex;
      d.awaitingChallenge = true;
      d.message = '';
      App.render();
    },

    challengeWord(d){
      if (!this.isCurrent(d)) return;
      const idx = d.acceptedByIndex;
      d.usedWords.pop();
      d.requiredLetter = d.prevRequiredLetter;
      this.eliminatePlayer(d, idx, `${d.players[idx].name} — სიტყვას გამოწვევა გაუკეთეს (არარსებული სიტყვა).`);
    },

    acceptContinue(d){
      if (!this.isCurrent(d)) return;
      d.awaitingChallenge = false;
      d.message = '';
      d.activeIndex = this.nextAliveIndex(d, d.acceptedByIndex);
      App.render();
    },

    renderPlay(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>სიტყვობანა</h2></div>`);
      const pauseOnNav = () => { d.timer && d.timer.pause(); };
      const bkBtn = wrap.querySelector('.back-link');
      const rlBtn = wrap.querySelector('.rules-link');
      if (bkBtn) bkBtn.addEventListener('click', pauseOnNav);
      if (rlBtn) rlBtn.addEventListener('click', pauseOnNav);

      if (d.message){
        panel.appendChild(el(`<div class="turn-note" style="color:var(--rust);">${escapeHtml(d.message)}</div>`));
      }

      if (d.usedWords.length){
        const chain = el(`<div class="chip-group" style="margin-bottom:14px;"></div>`);
        d.usedWords.slice(-6).forEach(w => chain.appendChild(el(`<span class="chip active" style="cursor:default;">${escapeHtml(w)}</span>`)));
        panel.appendChild(chain);
      }

      if (d.awaitingChallenge){
        const lastWord = d.usedWords[d.usedWords.length - 1];
        panel.appendChild(el(`
          <div class="narration-box">"${escapeHtml(lastWord)}" — მიღებულია.<br>
          გინდათ ვინმეს გამოწვევა (თუ ეს რეალური სიტყვა არ არის)?</div>
        `));
        const btnRow = el(`<div class="action-row" style="justify-content:center;"></div>`);
        const challengeBtn = el(`<button class="btn secondary">გამოწვევა — არ არსებობს</button>`);
        const continueBtn = el(`<button class="btn">გაგრძელება</button>`);
        challengeBtn.addEventListener('click', () => this.challengeWord(d));
        continueBtn.addEventListener('click', () => this.acceptContinue(d));
        btnRow.appendChild(challengeBtn);
        btnRow.appendChild(continueBtn);
        panel.appendChild(btnRow);
        wrap.appendChild(panel);
        return wrap;
      }

      const activeName = d.players[d.activeIndex].name;
      panel.appendChild(el(`<div class="turn-banner">დგას: <strong>${escapeHtml(activeName)}</strong></div>`));
      panel.appendChild(el(`
        <div style="text-align:center; margin:6px 0 14px;">
          ${d.requiredLetter
            ? `<span style="color:var(--ink-soft); font-size:0.9rem;">სიტყვა უნდა იწყებოდეს ასოთი</span><div class="letter-hero" style="margin:8px auto;">${d.requiredLetter}</div>`
            : `<span style="color:var(--ink-soft); font-size:0.9rem;">პირველი სიტყვა — ნებისმიერით დაწყება შეიძლება</span>`}
        </div>
      `));

      const timerBadge = el(`<div class="timer-badge" style="display:block; width:84px; margin:0 auto 14px;">${d.timerSeconds}</div>`);
      panel.appendChild(timerBadge);

      const input = el(`<input type="text" placeholder="დაწერე სიტყვა..." autocomplete="off" style="width:100%; padding:12px 14px; border:1.5px solid var(--paper-line); border-radius:8px; font-size:1.05rem; text-align:center;">`);
      panel.appendChild(input);

      const submitBtn = el(`<button class="btn" style="width:100%; margin-top:14px;">დადასტურება</button>`);
      const doSubmit = () => {
        d.timer && d.timer.pause();
        this.submitWord(d, input.value);
      };
      submitBtn.addEventListener('click', doSubmit);
      input.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); doSubmit(); } });
      panel.appendChild(submitBtn);

      wrap.appendChild(panel);

      d.timer = createTimer(d.timerSeconds, {
        onTick: (rem) => {
          timerBadge.textContent = Math.max(rem, 0);
          timerBadge.classList.toggle('low', rem <= 5);
        },
        onComplete: () => this.eliminatePlayer(d, d.activeIndex, `${activeName} — დრო ამოეწურა.`)
      });
      d.timer.start();
      setTimeout(() => input.focus(), 30);

      return wrap;
    },

    renderEnd(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`
        <div class="panel">
          <div class="winner-banner">
            <div class="crown">🏆</div>
            <h3>${d.winner ? escapeHtml(d.winner) : 'თამაში დასრულდა'}</h3>
          </div>
        </div>
      `);
      if (d.eliminationOrder.length){
        const ol = el(`<ol style="max-width:320px; margin:0 auto 14px; color:var(--ink-soft); font-size:0.92rem;"></ol>`);
        d.eliminationOrder.forEach(name => ol.appendChild(el(`<li>${escapeHtml(name)} — გავარდა</li>`)));
        panel.appendChild(ol);
      }
      const actions = el(`<div class="action-row">
        <button class="btn">იგივე მოთამაშეებით თავიდან</button>
        <button class="btn ghost">მთავარ გვერდზე</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        const names = d.players.map(p => p.name);
        const secs = d.timerSeconds;
        this.init();
        this.data.players = names;
        this.data.timerSeconds = secs;
        this.startGame();
      });
      actions.children[1].addEventListener('click', () => App.goHome());
      panel.appendChild(actions);
      wrap.appendChild(panel);
      return wrap;
    }
  };

  /* ========================================================================
     GAME 9: ჯოკერი (JOKER) — researched from the documented Georgian rules
     (36-card deck incl. jokers, exact-bid trick prediction; source: pagat.com,
     credited to Alexander Tvaladze). This app is a bidding + scoring
     companion, not a card simulator — the actual trump reveal and trick
     play happen with a real physical deck. The app runs the deal schedule,
     collects each player's bid (enforcing the real "dealer may not complete
     the total" rule), takes the actual tricks won, and scores each hand.

     Deal schedule (exactly 4 players, per the documented rules):
     - სტანდარტული: 1,2,3,4,5,6,7,8 (8 hands) → 9,9,9,9 (4 hands)
       → 8,7,6,5,4,3,2,1 (8 hands) → 9,9,9,9 (4 hands) = 24 hands total.
     - ცხრიანები: just the eight 9-card hands (both "nines" blocks), for a
       much shorter session.

     Scoring (from the documented rules):
     - Bid met exactly, and bid was for ALL cards in the hand: 100 points
       per trick.
     - Bid met exactly (any other case, including a bid of 0/pass): 50
       points per trick bid, plus a 50-point bonus.
     - Bid missed (won more or fewer tricks than bid): 10 points per trick
       actually won.
     Highest total after all hands wins.
  ======================================================================== */
  function buildJokerSchedule(mode){
    if (mode === 'nines') return [9,9,9,9,9,9,9,9];
    const asc = [1,2,3,4,5,6,7,8];
    const nines = [9,9,9,9];
    const desc = [8,7,6,5,4,3,2,1];
    return [...asc, ...nines, ...desc, ...nines];
  }

  function jokerHandScore(bid, actual, cardsThisRound){
    if (bid === actual){
      if (bid === cardsThisRound) return 100 * bid;
      return 50 * bid + 50;
    }
    return 10 * actual;
  }

  const Joker = {
    data: null,
    PLAYER_COUNT: 4,

    init(){
      this.data = {
        phase: 'setup',       // rules | setup | bid | tricks | result | end
        previousPhase: 'setup',
        mode: 'standard',     // standard | nines
        players: [],          // {name, total}
        schedule: [],
        handIndex: 0,
        dealerIndex: 0,
        biddingOrder: [],     // player indices, starting left of dealer, dealer last
        biddingStep: 0,
        bids: [],             // bids[playerIndex] = number, filled as bidding proceeds
        lastHandResult: null  // for the result recap screen
      };
    },

    render(){
      const d = this.data;
      if (d.phase === 'rules') return this.renderRules();
      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'tricks') return this.renderTricks();
      if (d.phase === 'result') return this.renderResult();
      if (d.phase === 'end') return this.renderEnd();
      return this.renderBid();
    },

    topBar(showBack){
      const wrap = el(`<div></div>`);
      const bar = el(`<div class="top-bar"></div>`);
      if (showBack){
        const back = el(`<button class="back-link">← მთავარ გვერდზე</button>`);
        back.addEventListener('click', () => App.goHome());
        bar.appendChild(back);
      } else {
        bar.appendChild(el(`<span></span>`));
      }
      const rulesLink = el(`<button class="rules-link">📖 წესები</button>`);
      rulesLink.addEventListener('click', () => {
        this.data.previousPhase = this.data.phase;
        this.data.phase = 'rules';
        App.render();
      });
      bar.appendChild(rulesLink);
      wrap.appendChild(bar);
      return wrap;
    },

    /* ----------------------- RULEBOOK ----------------------- */
    renderRules(){
      const wrap = el(`<div></div>`);
      const back = el(`<button class="back-link">← უკან</button>`);
      back.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      wrap.appendChild(back);

      const panel = el(`<div class="panel rulebook"><h2>ჯოკერის წესები</h2></div>`);
      panel.appendChild(el(`
        <p>ჯოკერი ნამდვილი კარტების თამაშია — ზუსტად 4 მოთამაშისთვის, 36-ბარათიანი
        დასტით (შავი ორივე ექვსიანის ნაცვლად — ჯოკერი). ყოველ ხელში მოთამაშეები
        წინასწარ ამბობენ, ზუსტად რამდენი ხელის აღებას აპირებენ, შემდეგ თამაშობენ
        რეალურ ბარათებზე. <strong>ეს აპლიკაცია ბარათებს არ ასიმულირებს</strong> —
        კოზირი, ჯოკერის თამაში და ბრძოლა თავად ხდება მაგიდასთან; აპი მხოლოდ
        დარიგებას, დავას (bid-ს) და ანგარიშს აწარმოებს.</p>
      `));

      panel.appendChild(el(`<h3>დარიგება</h3>`));
      panel.appendChild(el(`
        <ul>
          <li><strong>სტანდარტული</strong> რეჟიმი: 1,2,3,4,5,6,7,8 ბარათი (8 ხელი) →
          9,9,9,9 (4 ხელი) → 8,7,6,5,4,3,2,1 (8 ხელი) → 9,9,9,9 (4 ხელი).
          სულ 24 ხელი.</li>
          <li><strong>ცხრიანები</strong> რეჟიმი: მხოლოდ ის 8 ხელი, სადაც დილერი
          ყველა 9 ბარათს არიგებს (36 ბარათი ÷ 4 მოთამაშე = ზუსტად 9-9). გაცილებით
          მოკლე თამაშია.</li>
          <li>დილერი იცვლება მარცხნივ ყოველი ხელის შემდეგ.</li>
        </ul>
      `));

      panel.appendChild(el(`<h3>დავა (ბიდი)</h3>`));
      panel.appendChild(el(`
        <ul>
          <li>დილერის მარცხნივ მჯდომი იწყებს — თითოეული ამბობს, ზუსტად რამდენი
          ხელის აღებას აპირებს ("პასი" = 0).</li>
          <li>ბოლოს დავას ამბობს დილერი. <strong>დილერს არ შეუძლია ისეთი რიცხვის თქმა,
          რომელიც ჯამურ დავას ბარათების რაოდენობის ტოლს გახდის</strong> — ეს
          უზრუნველყოფს, რომ ყოველთვის ერთ-ერთი მოთამაშე მაინც ვერ ასრულებს დავას.
          მაგალითად, თუ ხელში 2 ბარათია და უკვე ნათქვამია 0 და 1 (ჯამი 1), დილერს
          1-ის თქმა ეკრძალება — მას მხოლოდ 0 ან 2 შეუძლია.</li>
        </ul>
      `));

      panel.appendChild(el(`<h3>ქულები</h3>`));
      panel.appendChild(el(`
        <ul>
          <li>ვინც ზუსტად თავისი დავის ტოლი ხელი აიღო — იღებს 50 ქულას თითო ხელზე
          <strong>პლუს 50 ბონუსი</strong>.</li>
          <li>ვინც დაავადა ყველა ხელის აღება ამ დარიგებაში და შეასრულა — იღებს
          100 ქულას თითო ხელზე (ჩვეულებრივი 50+50-ის ნაცვლად).</li>
          <li>ვინც არ ასრულებს დავას (მეტი ან ნაკლები ხელი აიღო) — იღებს მხოლოდ
          10 ქულას აღებულ თითო ხელზე.</li>
        </ul>
      `));
      panel.appendChild(el(`
        <p style="font-size:0.9rem; color:var(--ink-soft);">მაგალითად: პასი და 0 ხელის აღება — 50 ქულა.
        დავა 3-ზე და ზუსტად 3 ხელის აღება 4-ბარათიან ხელში — 200 ქულა (3×50+50).
        დავა 4-ზე (ანუ ყველა) და ყველას აღება — 400 ქულა (4×100). დავა 3-ზე, მაგრამ 4 ხელის აღება — 40 ქულა (4×10).</p>
      `));

      panel.appendChild(el(`<h3>გამარჯვება</h3>`));
      panel.appendChild(el(`<p>ბოლო ხელის შემდეგ, ყველაზე მაღალი ჯამური ქულის მქონე მოთამაშე იმარჯვებს.</p>`));

      const backBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">დაბრუნება</button>`);
      backBtn.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      panel.appendChild(backBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- SETUP ----------------------- */
    renderSetup(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>ჯოკერი — მოთამაშეები</h2></div>`);
      panel.appendChild(el(`<p style="color:var(--ink-soft); font-size:0.88rem; margin-top:-8px;">ჯოკერი მხოლოდ ზუსტად 4 მოთამაშისთვისაა.</p>`));

      const modeField = el(`<div class="field-row"><label>რეჟიმი</label><div class="chip-group mode-opts"></div></div>`);
      const modeGroup = modeField.querySelector('.mode-opts');
      [['standard','სტანდარტული (24 ხელი)'], ['nines','ცხრიანები (8 ხელი)']].forEach(([m,label]) => {
        const chip = el(`<button type="button" class="chip ${d.mode===m?'active':''}">${label}</button>`);
        chip.addEventListener('click', () => {
          d.mode = m;
          modeGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
        });
        modeGroup.appendChild(chip);
      });
      panel.appendChild(modeField);

      const playerField = el(`
        <div class="field-row">
          <label>მოთამაშეები (ზუსტად 4)</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი..." maxlength="20">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const nameInput = playerField.querySelector('input');
      const addBtn = playerField.querySelector('.btn');
      const startBtn = el(`<button class="btn" style="width:100%; margin-top:6px;">დაწყება</button>`);
      const warnMsg = el(`<p style="color:var(--rust); font-size:0.85rem; margin-top:8px; display:none;"></p>`);

      const updateValidity = () => {
        const n = d.players.length;
        const valid = n === this.PLAYER_COUNT;
        startBtn.disabled = !valid;
        addBtn.disabled = n >= this.PLAYER_COUNT;
        if (n < this.PLAYER_COUNT){ warnMsg.style.display='block'; warnMsg.textContent = `საჭიროა ზუსტად 4 მოთამაშე (ამჟამად: ${n}).`; }
        else warnMsg.style.display='none';
      };
      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm" aria-label="წაშლა">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); updateValidity(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val || d.players.length >= this.PLAYER_COUNT) return;
        d.players.push(val);
        nameInput.value = '';
        renderPlayers(); updateValidity();
        nameInput.focus();
      };
      addBtn.addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPlayer(); } });
      panel.appendChild(playerField);
      panel.appendChild(warnMsg);
      panel.appendChild(startBtn);

      startBtn.addEventListener('click', () => {
        if (startBtn.disabled) return;
        this.startGame();
      });

      renderPlayers();
      updateValidity();
      wrap.appendChild(panel);
      return wrap;
    },

    startGame(){
      const d = this.data;
      d.players = d.players.map(name => ({ name, total: 0 }));
      d.schedule = buildJokerSchedule(d.mode);
      d.handIndex = 0;
      d.dealerIndex = 0;
      this.startBidding();
    },

    startBidding(){
      const d = this.data;
      const n = this.PLAYER_COUNT;
      d.biddingOrder = [1,2,3,0].map(off => (d.dealerIndex + off) % n);
      d.biddingStep = 0;
      d.bids = new Array(n).fill(null);
      d.phase = 'bid';
      App.render();
    },

    /* ----------------------- BIDDING ----------------------- */
    renderBid(){
      const d = this.data;
      const wrap = this.topBar(true);
      const cardsThisHand = d.schedule[d.handIndex];
      const panel = el(`
        <div class="panel">
          <h2>ხელი ${d.handIndex + 1} / ${d.schedule.length} — ${cardsThisHand} ბარათი</h2>
        </div>
      `);
      panel.appendChild(el(`<div class="dealer-badge">დილერი: <strong>&nbsp;${escapeHtml(d.players[d.dealerIndex].name)}</strong></div>`));

      if (d.biddingStep > 0){
        const recap = el(`<div class="chip-group" style="margin-bottom:16px;"></div>`);
        for (let i=0;i<d.biddingStep;i++){
          const pIdx = d.biddingOrder[i];
          recap.appendChild(el(`<span class="chip active" style="cursor:default;">${escapeHtml(d.players[pIdx].name)}: ${d.bids[pIdx]}</span>`));
        }
        panel.appendChild(recap);
      }

      const currentIdx = d.biddingOrder[d.biddingStep];
      const isLastBidder = d.biddingStep === this.PLAYER_COUNT - 1;
      panel.appendChild(el(`<div class="turn-banner">${escapeHtml(d.players[currentIdx].name)} — რამდენი ხელის აღებას აპირებთ?</div>`));

      let forbidden = null;
      if (isLastBidder){
        const sumSoFar = d.biddingOrder.slice(0, this.PLAYER_COUNT - 1).reduce((s, idx) => s + d.bids[idx], 0);
        const candidate = cardsThisHand - sumSoFar;
        if (candidate >= 0 && candidate <= cardsThisHand) forbidden = candidate;
      }
      if (forbidden !== null){
        panel.appendChild(el(`
          <p style="text-align:center; color:var(--rust); font-size:0.9rem; margin:4px 0 12px;">
          დილერს, როგორც ბოლო მთქმელს, არ შეუძლია აირჩიოს <strong>${forbidden}</strong> (${forbidden} გარდა) — ჯამი ვერ იქნება ბარათების რაოდენობის ტოლი.</p>
        `));
      }

      const optRow = el(`<div class="chip-group" style="justify-content:center;"></div>`);
      for (let n=0;n<=cardsThisHand;n++){
        const disabled = (forbidden !== null && n === forbidden);
        const chip = el(`<button type="button" class="chip" ${disabled?'disabled':''}>${n===0?'პასი (0)':n}</button>`);
        if (!disabled){
          chip.addEventListener('click', () => {
            d.bids[currentIdx] = n;
            d.biddingStep += 1;
            if (d.biddingStep >= this.PLAYER_COUNT){
              d.phase = 'tricks';
            }
            App.render();
          });
        }
        optRow.appendChild(chip);
      }
      panel.appendChild(optRow);

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- ACTUAL TRICKS ENTRY ----------------------- */
    renderTricks(){
      const d = this.data;
      const wrap = this.topBar(true);
      const cardsThisHand = d.schedule[d.handIndex];
      const panel = el(`<div class="panel"><h2>ხელი ${d.handIndex + 1} — ითამაშეთ, შემდეგ შეიყვანეთ შედეგი</h2></div>`);
      panel.appendChild(el(`<p style="text-align:center; color:var(--ink-soft); font-size:0.88rem; margin-top:-8px;">სულ ${cardsThisHand} ხელი ითამაშება ამ დარიგებაში.</p>`));

      const inputs = [];
      d.players.forEach((p, i) => {
        const row = el(`
          <div class="score-row">
            <span class="name">${escapeHtml(p.name)} <span style="color:var(--ink-soft); font-weight:400;">(დავა: ${d.bids[i]})</span></span>
            <input type="number" min="0" max="${cardsThisHand}" value="0">
          </div>
        `);
        inputs.push(row.querySelector('input'));
        panel.appendChild(row);
      });

      const sumNote = el(`<p style="text-align:center; font-family:var(--font-mono); font-size:0.9rem; color:var(--ink-soft); margin:6px 0 0;"></p>`);
      panel.appendChild(sumNote);
      const errNote = el(`<p style="text-align:center; color:var(--rust); font-size:0.85rem; display:none;">აღებული ხელების ჯამი უნდა უდრიდეს ${cardsThisHand}-ს.</p>`);
      panel.appendChild(errNote);

      const updateSum = () => {
        const sum = inputs.reduce((s, inp) => s + (parseInt(inp.value,10) || 0), 0);
        sumNote.textContent = `ჯამი: ${sum} / ${cardsThisHand}`;
        errNote.style.display = (sum === cardsThisHand) ? 'none' : 'block';
      };
      inputs.forEach(inp => inp.addEventListener('input', updateSum));
      updateSum();

      const submitBtn = el(`<button class="btn" style="width:100%; margin-top:12px;">ქულების დათვლა</button>`);
      submitBtn.addEventListener('click', () => {
        const actuals = inputs.map(inp => parseInt(inp.value,10) || 0);
        const sum = actuals.reduce((s,v)=>s+v,0);
        if (sum !== cardsThisHand) return; // guard, button also visually flagged via errNote
        const results = d.players.map((p, i) => {
          const points = jokerHandScore(d.bids[i], actuals[i], cardsThisHand);
          p.total += points;
          return { name: p.name, bid: d.bids[i], actual: actuals[i], points };
        });
        d.lastHandResult = { cardsThisHand, results };
        d.phase = 'result';
        App.render();
      });
      panel.appendChild(submitBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- HAND RESULT ----------------------- */
    renderResult(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>ხელი ${d.handIndex + 1} — შედეგი</h2></div>`);

      const table = el(`<table class="review-table"><thead><tr><th>მოთამაშე</th><th>დავა</th><th>აიღო</th><th>ქულა</th></tr></thead><tbody></tbody></table>`);
      const tbody = table.querySelector('tbody');
      d.lastHandResult.results.forEach(r => {
        tbody.appendChild(el(`
          <tr><td>${escapeHtml(r.name)}</td><td>${r.bid}</td><td>${r.actual}</td><td><span class="badge ${r.bid===r.actual?'unique':'invalid'}">+${r.points}</span></td></tr>
        `));
      });
      panel.appendChild(table);

      panel.appendChild(el(`<h4 style="font-family:var(--font-mono); font-size:0.75rem; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.05em; margin:18px 0 8px;">საერთო ანგარიში</h4>`));
      const sorted = d.players.slice().sort((a,b)=>b.total-a.total);
      const ul = el(`<ul class="standings-list"></ul>`);
      sorted.forEach(p => {
        ul.appendChild(el(`<li class="${p===sorted[0]?'leader':''}"><span>${escapeHtml(p.name)}</span><span class="score">${p.total}</span></li>`));
      });
      panel.appendChild(ul);

      const isLastHand = d.handIndex >= d.schedule.length - 1;
      const nextBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">${isLastHand ? 'საბოლოო შედეგები' : 'შემდეგი ხელი'}</button>`);
      nextBtn.addEventListener('click', () => {
        if (isLastHand){
          d.phase = 'end';
          App.render();
          return;
        }
        d.handIndex += 1;
        d.dealerIndex = (d.dealerIndex + 1) % this.PLAYER_COUNT;
        this.startBidding();
      });
      panel.appendChild(nextBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- FINAL ----------------------- */
    renderEnd(){
      const d = this.data;
      const wrap = this.topBar(true);
      const sorted = d.players.slice().sort((a,b)=>b.total-a.total);
      const winner = sorted[0];
      const panel = el(`
        <div class="panel">
          <div class="winner-banner">
            <div class="crown">🏆</div>
            <h3>${winner ? escapeHtml(winner.name) : '—'}</h3>
            <div style="color:var(--ink-soft)">${winner ? winner.total : 0} ქულით</div>
          </div>
        </div>
      `);
      const ul = el(`<ul class="standings-list"></ul>`);
      sorted.forEach(p => {
        ul.appendChild(el(`<li class="${p===winner?'leader':''}"><span>${escapeHtml(p.name)}</span><span class="score">${p.total}</span></li>`));
      });
      panel.appendChild(ul);

      const actions = el(`<div class="action-row">
        <button class="btn">იგივე მოთამაშეებით თავიდან</button>
        <button class="btn ghost">მთავარ გვერდზე</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        const names = d.players.map(p => p.name);
        const mode = d.mode;
        this.init();
        this.data.players = names;
        this.data.mode = mode;
        this.startGame();
      });
      actions.children[1].addEventListener('click', () => App.goHome());
      panel.appendChild(actions);
      wrap.appendChild(panel);
      return wrap;
    }
  };

  /* ========================================================================
     GAME 10: ბელოტი (BELOTE) — 4 players, 2 partnerships, played with a
     real 32-card deck at a table (bidding, trump, trick-taking, belote/
     rebelote bonuses). Like ჯოკერი, this is a scorekeeping companion only
     — no card simulation. Track each team's running total hand by hand
     until one team reaches the target score.
  ======================================================================== */
  const Belote = {
    data: null,

    init(){
      this.data = {
        phase: 'setup',       // rules | setup | play | end
        previousPhase: 'setup',
        teamNames: ['გუნდი 1', 'გუნდი 2'],
        totals: [0, 0],
        target: 501,
        handNumber: 0,
        winnerIndex: null
      };
    },

    render(){
      const d = this.data;
      if (d.phase === 'rules') return this.renderRules();
      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'end') return this.renderEnd();
      return this.renderPlay();
    },

    topBar(showBack){
      const wrap = el(`<div></div>`);
      const bar = el(`<div class="top-bar"></div>`);
      if (showBack){
        const back = el(`<button class="back-link">← მთავარ გვერდზე</button>`);
        back.addEventListener('click', () => App.goHome());
        bar.appendChild(back);
      } else {
        bar.appendChild(el(`<span></span>`));
      }
      const rulesLink = el(`<button class="rules-link">📖 წესები</button>`);
      rulesLink.addEventListener('click', () => {
        this.data.previousPhase = this.data.phase;
        this.data.phase = 'rules';
        App.render();
      });
      bar.appendChild(rulesLink);
      wrap.appendChild(bar);
      return wrap;
    },

    renderRules(){
      const wrap = el(`<div></div>`);
      const back = el(`<button class="back-link">← უკან</button>`);
      back.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      wrap.appendChild(back);

      const panel = el(`<div class="panel rulebook"><h2>ბელოტის წესები</h2></div>`);
      panel.appendChild(el(`<p>ბელოტი ნამდვილი კარტების თამაშია — 4 მოთამაშე, 2 წყვილად, 32-ბარათიანი დასტით (7-დან ტუზამდე), სამაგიდოდ. მოთამაშეები დებენ კოზირზე და თამაშობენ ხელებს ("ლეს"). <strong>ეს აპლიკაცია ბარათებს არ ასიმულირებს</strong> — ის მხოლოდ გუნდების ანგარიშს აწარმოებს.</p>`));
      panel.appendChild(el(`<h3>როგორ გამოვიყენოთ</h3>`));
      panel.appendChild(el(`
        <ul>
          <li>ყოველი ხელის დასრულების შემდეგ შეიყვანეთ თითოეული გუნდის ამ ხელში მიღებული ქულა.</li>
          <li>აპი აჯამებს ორივე გუნდის ქულებს და აჩვენებთ განახლებულ ანგარიშს.</li>
          <li>როცა ერთი გუნდი მიაღწევს სამიზნე ქულას (501 ან 1001), თამაში მთავრდება ავტომატურად.</li>
        </ul>
      `));
      panel.appendChild(el(`<h3>გამარჯვება</h3>`));
      panel.appendChild(el(`<p>პირველი გუნდი, რომელიც სამიზნე ქულას მიაღწევს, იმარჯვებს.</p>`));

      const backBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">დაბრუნება</button>`);
      backBtn.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      panel.appendChild(backBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    renderSetup(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>ბელოტი — გუნდები</h2></div>`);

      [0,1].forEach(i => {
        const row = el(`
          <div class="field-row">
            <label>${i===0?'პირველი':'მეორე'} გუნდის სახელი</label>
            <input type="text" value="${escapeHtml(d.teamNames[i])}" maxlength="20">
          </div>
        `);
        row.querySelector('input').addEventListener('input', e => { d.teamNames[i] = e.target.value || (i===0?'გუნდი 1':'გუნდი 2'); });
        panel.appendChild(row);
      });

      const targetField = el(`<div class="field-row"><label>სამიზნე ქულა</label><div class="chip-group target-opts"></div></div>`);
      const targetGroup = targetField.querySelector('.target-opts');
      [501,1001].forEach(val => {
        const chip = el(`<button type="button" class="chip ${d.target===val?'active':''}">${val}</button>`);
        chip.addEventListener('click', () => {
          d.target = val;
          targetGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
        });
        targetGroup.appendChild(chip);
      });
      panel.appendChild(targetField);

      const startBtn = el(`<button class="btn" style="width:100%; margin-top:6px;">დაწყება</button>`);
      startBtn.addEventListener('click', () => {
        d.totals = [0,0];
        d.handNumber = 0;
        d.winnerIndex = null;
        d.phase = 'play';
        App.render();
      });
      panel.appendChild(startBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    renderPlay(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>ბელოტი — ხელი ${d.handNumber + 1}</h2></div>`);
      panel.appendChild(el(`<p style="text-align:center; color:var(--ink-soft); font-size:0.88rem; margin-top:-8px;">სამიზნე: ${d.target} ქულა</p>`));

      const ul = el(`<ul class="standings-list"></ul>`);
      [0,1].forEach(i => {
        const isLeader = d.totals[i] > d.totals[1-i];
        ul.appendChild(el(`
          <li class="${isLeader ? 'leader':''}">
            <span>${escapeHtml(d.teamNames[i])}</span>
            <span class="score">${d.totals[i]}</span>
          </li>
        `));
      });
      panel.appendChild(ul);

      panel.appendChild(el(`<h4 style="font-family:var(--font-mono); font-size:0.75rem; text-transform:uppercase; color:var(--ink-soft); letter-spacing:0.05em; margin:18px 0 8px;">ამ ხელის ქულები</h4>`));
      const inputs = [];
      [0,1].forEach(i => {
        const row = el(`
          <div class="score-row">
            <span class="name">${escapeHtml(d.teamNames[i])}</span>
            <input type="number" min="0" value="0">
          </div>
        `);
        inputs.push(row.querySelector('input'));
        panel.appendChild(row);
      });

      const submitBtn = el(`<button class="btn" style="width:100%; margin-top:6px;">ხელის დამატება</button>`);
      submitBtn.addEventListener('click', () => {
        [0,1].forEach(i => {
          const val = parseInt(inputs[i].value, 10);
          d.totals[i] += isNaN(val) ? 0 : val;
        });
        d.handNumber += 1;
        if (d.totals[0] >= d.target || d.totals[1] >= d.target){
          d.winnerIndex = d.totals[0] > d.totals[1] ? 0 : (d.totals[1] > d.totals[0] ? 1 : null);
          d.phase = 'end';
        }
        App.render();
      });
      panel.appendChild(submitBtn);

      const endBtn = el(`<button class="btn ghost" style="width:100%; margin-top:8px;">თამაშის დასრულება</button>`);
      endBtn.addEventListener('click', () => {
        d.winnerIndex = d.totals[0] > d.totals[1] ? 0 : (d.totals[1] > d.totals[0] ? 1 : null);
        d.phase = 'end';
        App.render();
      });
      panel.appendChild(endBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    renderEnd(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`
        <div class="panel">
          <div class="winner-banner">
            <div class="crown">🏆</div>
            <h3>${d.winnerIndex !== null ? escapeHtml(d.teamNames[d.winnerIndex]) : 'ფრე'}</h3>
          </div>
        </div>
      `);
      const ul = el(`<ul class="standings-list"></ul>`);
      [0,1].forEach(i => {
        ul.appendChild(el(`
          <li class="${d.winnerIndex===i?'leader':''}">
            <span>${escapeHtml(d.teamNames[i])}</span>
            <span class="score">${d.totals[i]}</span>
          </li>
        `));
      });
      panel.appendChild(ul);
      const actions = el(`<div class="action-row">
        <button class="btn">იგივე გუნდებით თავიდან</button>
        <button class="btn ghost">მთავარ გვერდზე</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        const names = d.teamNames.slice();
        const target = d.target;
        this.init();
        this.data.teamNames = names;
        this.data.target = target;
        this.data.phase = 'play';
        App.render();
      });
      actions.children[1].addEventListener('click', () => App.goHome());
      panel.appendChild(actions);
      wrap.appendChild(panel);
      return wrap;
    }
  };

  /* ----------------------- BOOT ----------------------- */
  document.addEventListener('DOMContentLoaded', () => { App.loadTheme(); App.loadCustomImages(); App.render(); });
})();
</script>
</body>
</html>
