<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>გამო</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===================== DESIGN TOKENS ===================== */
  :root{
    --paper: #EEF1F8;        /* cool, clean page background */
    --paper-card: #FFFFFF;   /* white cards */
    --paper-line: #DDE3F0;   /* soft cool border/rule lines */
    --ink: #1B2436;          /* main text, deep navy charcoal */
    --ink-soft: #5B6780;     /* secondary text, cool slate */
    --wine: #4F46E5;         /* primary accent - indigo (backgrounds/buttons) */
    --wine-dark: #4338CA;    /* hover/active */
    --accent: #4F46E5;       /* indigo used AS TEXT on the page background — brightens in dark mode so it stays legible */
    --brass: #E11D48;        /* rose/pomegranate accent - borders, pins, highlights */
    --brass-light: #FB7185;
    --brass-text: #BE123C;   /* darker rose for small text on light chips */
    --sage: #059669;         /* success / unique answers */
    --rust: #DC2626;         /* warnings / wrong guesses */
    --cream: #F4F5FA;        /* khinkali dough */
    --surface: #ffffff;      /* raised surface: inputs, chips, tiles */

    --font-display: 'Noto Serif Georgian', serif;
    --font-body: 'Noto Sans Georgian', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;

    --radius: 14px;
    --shadow-card: 0 6px 16px rgba(27,36,54,0.09);
    --shadow-card-hover: 0 14px 28px rgba(27,36,54,0.16);
  }

  /* Dark mode — toggled via [data-theme="dark"] on <html>. Because every
     component below is built entirely from these custom properties (no
     hardcoded colors), overriding the tokens here re-themes the whole app. */
  html[data-theme="dark"]{
    --paper: #10131C;
    --paper-card: #181C29;
    --paper-line: #2A3040;
    --ink: #E7EAF2;
    --ink-soft: #939CB4;
    --wine: #6366F1;
    --wine-dark: #818CF8;
    --accent: #A5B4FC;
    --brass: #FB7185;
    --brass-light: #FDA4AF;
    --sage: #34D399;
    --rust: #F87171;
    --cream: #1E2333;
    --surface: #202638;
    --brass-text: #FDA4AF;
    --shadow-card: 0 6px 16px rgba(0,0,0,0.45);
    --shadow-card-hover: 0 12px 26px rgba(0,0,0,0.55);
  }
  html[data-theme="dark"] body{
    background:
      radial-gradient(circle at 20% 10%, rgba(99,102,241,0.10), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(225,29,72,0.08), transparent 45%),
      var(--paper);
  }
  html[data-theme="dark"] .btn.secondary:hover{ background: rgba(165,180,252,0.14); }
  html[data-theme="dark"] .badge.unique{ background: rgba(52,211,153,0.2); }
  html[data-theme="dark"] .badge.dup{ background: rgba(251,113,133,0.2); }
  html[data-theme="dark"] .badge.invalid{ background: rgba(248,113,113,0.2); }
  html[data-theme="dark"] .stepper button:hover{ background: rgba(251,113,133,0.14); }
  html[data-theme="dark"] .bs-cell.clickable:hover{ background: rgba(129,140,248,0.14); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(circle at 15% 0%, rgba(79,70,229,0.06), transparent 42%),
      radial-gradient(circle at 85% 85%, rgba(225,29,72,0.05), transparent 45%),
      var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
  }

  #app{ max-width: 880px; margin: 0 auto; padding: 28px 18px 60px; min-height: 100vh; }

  header.app-header{ text-align:center; margin-bottom: 34px; position:relative; }
  header.app-header h1{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.1rem, 6vw, 2.9rem);
    color: var(--accent);
    margin: 0;
    letter-spacing: 0.5px;
  }
  .header-tagline{
    font-family: var(--font-body); font-size: 0.95rem; color: var(--ink-soft);
    margin: 8px 0 0;
  }
  .header-ornament{ display:block; margin: 12px auto 0; color: var(--brass); width: 180px; height: 14px; }

  .theme-toggle{
    position: fixed; top: 16px; right: 16px; z-index: 20;
    width: 40px; height: 40px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--surface); border: 1.5px solid var(--paper-line);
    color: var(--ink-soft); box-shadow: var(--shadow-card);
    transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .theme-toggle svg{ width: 19px; height: 19px; }
  .theme-toggle:hover{ border-color: var(--brass); color: var(--accent); transform: translateY(-1px); }
  .theme-toggle:active{ transform: translateY(0); }

  .sound-toggle{
    position: fixed; top: 16px; right: 64px; z-index: 20;
    width: 40px; height: 40px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--surface); border: 1.5px solid var(--paper-line);
    color: var(--ink-soft); box-shadow: var(--shadow-card);
    transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .sound-toggle svg{ width: 19px; height: 19px; }
  .sound-toggle:hover{ border-color: var(--brass); color: var(--accent); transform: translateY(-1px); }
  .sound-toggle:active{ transform: translateY(0); }

  .pause-toggle{
    position: fixed; top: 16px; left: 16px; z-index: 20;
    width: 40px; height: 40px; border-radius: 50%;
    display:none; align-items:center; justify-content:center;
    background: var(--surface); border: 1.5px solid var(--paper-line);
    color: var(--ink-soft); box-shadow: var(--shadow-card);
    transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .pause-toggle svg{ width: 19px; height: 19px; }
  .pause-toggle:hover{ border-color: var(--brass); color: var(--accent); transform: translateY(-1px); }
  .pause-toggle:active{ transform: translateY(0); }

  .sound-banner{
    position: fixed; left: 50%; bottom: 18px; z-index: 25;
    transform: translate(-50%, 120%);
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    max-width: calc(100% - 32px);
    background: var(--paper-card); border: 1.5px solid var(--brass);
    border-radius: 999px; padding: 10px 10px 10px 18px;
    box-shadow: var(--shadow-card-hover);
    transition: transform 0.25s cubic-bezier(.22,1,.36,1);
  }
  .sound-banner.open{ transform: translate(-50%, 0); }
  .sound-banner-text{ font-size: 0.92rem; color: var(--ink); }
  .sound-banner-actions{ display:flex; align-items:center; gap:8px; margin-left:auto; }
  .sound-banner .btn{ padding: 8px 16px; font-size: 0.88rem; }
  .sound-banner-close{
    width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--paper-line);
    background: var(--surface); color: var(--ink-soft); display:flex; align-items:center; justify-content:center;
    font-size: 0.9rem; flex-shrink: 0;
  }
  .sound-banner-close:hover{ border-color: var(--brass); color: var(--ink); }
  @media (max-width: 520px){
    .sound-banner{ flex-direction: column; align-items: stretch; border-radius: 18px; padding: 14px; }
    .sound-banner-actions{ margin-left: 0; justify-content: space-between; }
  }

  .pause-overlay{
    position: fixed; inset: 0; z-index: 30;
    background: rgba(20,16,12,0.55);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .pause-overlay.open{ opacity: 1; pointer-events: auto; }
  .pause-modal{
    background: var(--paper-card); border: 1px solid var(--paper-line);
    border-radius: 14px; box-shadow: var(--shadow-card-hover);
    padding: 26px 24px; width: 100%; max-width: 320px;
    display:flex; flex-direction:column; gap:10px;
    transform: translateY(8px); transition: transform 0.15s ease;
  }
  .pause-overlay.open .pause-modal{ transform: translateY(0); }
  .pause-modal h3{
    font-family: var(--font-display); color: var(--accent); text-align:center;
    margin: 0 0 6px; font-size: 1.2rem;
  }

  button{ font-family: inherit; cursor: pointer; }
  a{ color: var(--accent); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background: var(--wine); color: #F6EEDD; border: none;
    padding: 11px 20px; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn:hover{ background: var(--wine-dark); }
  .btn:active{ transform: translateY(1px); }
  .btn:focus-visible{ outline: 2px solid var(--brass); outline-offset: 2px; }
  .btn.secondary{
    background: transparent; color: var(--accent); border: 1.5px solid var(--accent);
  }
  .btn.secondary:hover{ background: rgba(79,70,229,0.08); }
  .btn.ghost{
    background: transparent; color: var(--ink-soft); border: 1.5px solid var(--paper-line);
  }
  .btn.ghost:hover{ border-color: var(--brass); color: var(--ink); }
  .btn:disabled{ opacity: 0.45; cursor: not-allowed; }

  /* ===================== HOME / GAME CARDS ===================== */
  .game-section{ margin-bottom: 34px; }
  .game-section:last-child{ margin-bottom: 0; }
  .section-heading{
    display:flex; align-items:center; gap:14px;
    font-family: var(--font-display); font-weight:600; font-size: 1.05rem;
    color: var(--ink-soft); margin: 0 0 16px; letter-spacing: 0.02em;
  }
  .section-heading::before, .section-heading::after{
    content:''; flex:1; height:1px; background: var(--paper-line);
  }
  .board{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 22px 18px;
    padding-top: 6px;
  }

  .game-card{
    position: relative;
    background: var(--paper-card);
    border: 1px solid var(--paper-line);
    border-radius: 15px;
    box-shadow: var(--shadow-card);
    padding: 0;
    text-align:center;
    transition: transform 0.22s cubic-bezier(.22,1,.36,1), box-shadow 0.22s ease, border-color 0.22s ease;
  }
  .game-card.playable{ cursor:pointer; }
  .game-card.playable:hover, .game-card.playable:focus-visible{
    transform: translateY(-4px);
    box-shadow: var(--shadow-card-hover);
    border-color: var(--brass);
    outline: none;
  }
  .game-card.playable:active{ transform: translateY(-1px); }
  .game-card.soon{ opacity: 0.55; }

  .game-card .pin{
    position:absolute; top: -7px; left: 50%; transform: translateX(-50%);
    width: 14px; height: 14px; border-radius: 50%; z-index: 3;
    background: radial-gradient(circle at 30% 30%, var(--brass-light), var(--brass) 70%);
    box-shadow: 0 2px 3px rgba(0,0,0,0.3);
    transition: transform 0.22s cubic-bezier(.22,1,.36,1);
  }
  .game-card.playable:hover .pin{ transform: translateX(-50%) rotate(-14deg) scale(1.05); }
  /* Clips the image + body together so the hover zoom on the image can
     never visually spill past the card's rounded corners into the row
     below — the image itself just scales inside this fixed, clipped box. */
  .game-card-clip{
    border-radius: 14px; overflow: hidden;
  }
  .game-card-image{
    position: relative;
    width: 100%; height: 108px; display:flex; align-items:center; justify-content:center;
    background-size: cover; background-position: center;
    transition: transform 0.3s ease;
  }
  .game-card.playable:hover .game-card-image{ transform: scale(1.03); }
  .game-icon{
    width: 42px; height: 42px; display:flex; align-items:center; justify-content:center;
    font-size: 2.35rem; line-height: 1;
    filter: drop-shadow(0 3px 5px rgba(0,0,0,0.25));
    position: relative; z-index: 1;
  }
  .game-card-image .upload-badge, .game-card-image .remove-badge{
    position:absolute; z-index: 2; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,255,255,0.88); border: 1px solid rgba(0,0,0,0.08);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.18); color: var(--ink-soft);
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .game-card-image .upload-badge{ right: 6px; bottom: 6px; }
  .game-card-image .remove-badge{ left: 6px; bottom: 6px; color: var(--rust); }
  .game-card-image .upload-badge:hover, .game-card-image .remove-badge:hover{
    background: var(--surface); transform: scale(1.08);
  }
  .game-card-image .upload-badge svg, .game-card-image .remove-badge svg{ width: 14px; height: 14px; }
  .game-card-body{ padding: 16px 16px 18px; }
  .game-card h3{
    font-family: var(--font-display); font-size: 1.15rem; margin: 0 0 6px; color: var(--ink);
  }
  .game-card .meta{
    font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .game-card .ribbon{
    position:absolute; top: 8px; right: -6px; z-index: 2;
    background: var(--rust); color:#fff; font-size: 0.68rem; font-weight:600;
    padding: 3px 10px; border-radius: 3px; font-family: var(--font-mono);
    letter-spacing: 0.04em;
  }

  /* ===================== PANELS / GENERIC ===================== */
  .panel{
    background: var(--paper-card); border: 1px solid var(--paper-line);
    border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-card);
  }
  .panel + .panel{ margin-top: 18px; }
  .panel h2{
    font-family: var(--font-display); color: var(--accent); margin-top:0;
    font-size: 1.4rem; border-bottom: 1px dashed var(--paper-line); padding-bottom: 10px;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:6px; margin-bottom: 16px;
    color: var(--ink-soft); font-size: 0.9rem; background:none; border:none; padding:0;
  }
  .back-link:hover{ color: var(--accent); }

  .field-row{ margin-bottom: 16px; }
  .field-row label{
    display:block; font-weight:600; font-size:0.88rem; margin-bottom:6px; color: var(--ink-soft);
  }
  .field-row input[type=text], .field-row input[type=number]{
    width:100%; padding:10px 12px; border:1.5px solid var(--paper-line); border-radius:7px;
    font-family: var(--font-body); font-size: 0.98rem; background:var(--surface); color: var(--ink);
  }
  .field-row input:focus-visible{ outline: 2px solid var(--brass); border-color: var(--brass); }

  /* Collapsible field ("accordion") used for categories/timer/rounds/mode
     pickers so setup screens don't show every option at once. */
  details.accordion{
    border: 1.5px solid var(--paper-line); border-radius: 10px;
    background: var(--surface); overflow: hidden;
  }
  details.accordion > summary{
    list-style: none; cursor: pointer; user-select: none;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; font-weight: 600; font-size: 0.88rem; color: var(--ink-soft);
    transition: color 0.12s ease;
  }
  details.accordion > summary::-webkit-details-marker{ display: none; }
  details.accordion > summary:hover{ color: var(--ink); }
  details.accordion > summary:focus-visible{ outline: 2px solid var(--brass); outline-offset: -2px; }
  .accordion-right{ display:flex; align-items:center; gap:8px; }
  .accordion-value{
    font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; color: var(--accent);
  }
  .accordion .chevron{
    display:inline-block; font-size: 1rem; line-height:1; color: var(--ink-soft);
    transition: transform 0.18s ease;
  }
  details.accordion[open] > summary .chevron{ transform: rotate(180deg); }
  .accordion-body{
    padding: 2px 14px 14px; border-top: 1px dashed var(--paper-line); margin-top: 2px;
  }
  .accordion-body .chip-group{ padding-top: 12px; }
  .accordion-body .inline-add{ margin-top: 10px; }

  .chip-group{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--paper-line);
    background:var(--surface); font-size:0.85rem; color: var(--ink-soft); font-weight:500;
  }
  .chip.active{ background: var(--wine); color:#fff; border-color: var(--wine); }
  .chip:focus-visible{ outline: 2px solid var(--brass); }

  .player-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .player-list li{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--paper-line); border-radius:7px; padding:8px 12px;
  }
  .player-list .rm{ background:none; border:none; color: var(--rust); font-size:1.1rem; line-height:1; }

  .inline-add{ display:flex; gap:8px; margin-top:10px; }
  .inline-add input{ flex:1; }

  .timer-badge{
    font-family: var(--font-mono); font-size: 1.6rem; font-weight:600; color: var(--accent);
    background: var(--surface); border: 2px solid var(--brass); border-radius: 8px;
    padding: 6px 16px; display:inline-block; min-width: 84px; text-align:center;
  }
  .timer-badge.low{ color: var(--rust); border-color: var(--rust); }

  .turn-banner{
    font-family: var(--font-display); font-size: 1.1rem; color: var(--accent);
    margin-bottom: 4px;
  }
  .letter-hero{
    font-family: var(--font-display); font-size: 3.2rem; font-weight:700; color: var(--accent);
    background: var(--surface); border: 2px solid var(--brass); border-radius: 12px;
    width: 84px; height: 84px; display:flex; align-items:center; justify-content:center;
    margin: 6px 0 18px;
  }

  .category-input-row{ margin-bottom: 12px; }
  .category-input-row label{
    font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase;
    color: var(--ink-soft); letter-spacing:0.05em; margin-bottom:4px; display:block;
  }

  table.review-table{ width:100%; border-collapse: collapse; font-size: 0.92rem; }
  table.review-table th{
    text-align:left; font-family: var(--font-mono); font-size:0.72rem; text-transform:uppercase;
    color: var(--ink-soft); padding: 6px 8px; border-bottom: 2px solid var(--paper-line);
  }
  table.review-table td{ padding: 8px; border-bottom: 1px solid var(--paper-line); vertical-align:middle; }
  .badge{
    display:inline-flex; align-items:center; gap:4px; font-size:0.78rem; font-weight:600;
    padding: 3px 10px; border-radius:20px; border:none; font-family: var(--font-mono);
  }
  .badge.unique{ background: rgba(5,150,105,0.15); color: var(--sage); }
  .badge.dup{ background: rgba(225,29,72,0.12); color: var(--brass-text); }
  .badge.invalid{ background: rgba(220,38,38,0.12); color: var(--rust); }

  .score-pick-row{ display:flex; gap:6px; justify-content:flex-end; }
  .score-pick-row .badge{ cursor:pointer; opacity:0.4; transition: opacity 0.12s ease, box-shadow 0.12s ease; }
  .score-pick-row .badge:hover{ opacity:0.75; }
  .score-pick-row .badge.selected{ opacity:1; font-weight:700; box-shadow: 0 0 0 2px var(--brass) inset; }
  .score-pick-row .badge:focus-visible{ outline: 2px solid var(--brass); outline-offset: 1px; }

  .scoreboard{ list-style:none; margin:0; padding:0; }
  .scoreboard li{
    display:flex; justify-content:space-between; align-items:center;
    padding: 10px 4px; border-bottom: 1px solid var(--paper-line); font-size: 0.98rem;
  }
  .scoreboard li:last-child{ border-bottom:none; }
  .scoreboard li.leader{ font-weight:700; color: var(--accent); }
  .scoreboard .score{ font-family: var(--font-mono); font-weight:600; }

  .final-winner{
    text-align:center; padding: 20px 0;
  }
  .final-winner .crown{ font-size: 2.4rem; }
  .final-winner h3{ font-family: var(--font-display); color: var(--accent); font-size:1.6rem; margin: 4px 0; }

  .action-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 18px; }

  /* ===================== HANGMAN ===================== */
  .plate-wrap{ display:flex; flex-direction:column; align-items:center; margin-bottom: 10px; }
  .plate{
    width: 220px; height: 220px; border-radius:50%;
    background: radial-gradient(circle at 50% 45%, #fff 55%, var(--paper-line) 100%);
    border: 4px solid var(--brass);
    display:flex; align-items:center; justify-content:center; position:relative;
    margin-bottom: 8px;
  }
  .khinkali-grid{
    display:grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 160px;
  }
  .khinkali{ width: 34px; height: 34px; display:flex; align-items:center; justify-content:center; font-size: 1.7rem; line-height:1; transition: opacity 0.3s ease, transform 0.3s ease; }
  .khinkali.eaten{ opacity: 0; transform: scale(0.3) rotate(20deg); }
  .lives-caption{ font-family: var(--font-mono); font-size: 0.85rem; color: var(--ink-soft); }

  .word-display{
    display:flex; flex-wrap:wrap; justify-content:center; gap: 8px; margin: 18px 0 22px;
  }
  .letter-tile{
    width: 38px; height: 46px; border-bottom: 3px solid var(--brass);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-size: 1.4rem; font-weight:700; color: var(--ink);
  }

  .keyboard{
    display:grid; grid-template-columns: repeat(8, 1fr); gap: 7px; max-width: 480px; margin: 0 auto;
  }
  .key{
    aspect-ratio: 1; border-radius: 6px; border: 1.5px solid var(--paper-line);
    background: var(--surface); font-family: var(--font-body); font-size: 1.05rem; font-weight:600;
    color: var(--ink); display:flex; align-items:center; justify-content:center;
    transition: background 0.15s, color 0.15s, border-color 0.15s;

  /* ----------------------- SHARED: ACCORDION FIELD -----------------------
     Wraps a settings field (categories, timer, rounds, mode, etc.) in a
     native <details> so it starts collapsed and expands on click, instead
     of showing every chip option at once. Player-name entry fields are
     left as plain field-rows (always visible) since typing names isn't a
     "pick one of a few options" choice.
     Returns { wrap, body, setSummary } — call setSummary(text) whenever the
     selection changes so the collapsed header always shows the current pick.
  ------------------------------------------------------------------- */
  function makeAccordion(labelText, initialSummary, startOpen){
    const wrap = el(`
      <details class="field-row accordion" ${startOpen ? 'open' : ''}>
        <summary>
          <span class="accordion-label">${labelText}</span>
          <span class="accordion-right">
            <span class="accordion-value">${initialSummary || ''}</span>
            <span class="chevron">⌄</span>
          </span>
        </summary>
        <div class="accordion-body"></div>
      </details>
    `);
    const valueEl = wrap.querySelector('.accordion-value');
    const body = wrap.querySelector('.accordion-body');
    return {
      wrap, body,
      setSummary(text){ valueEl.textContent = text || ''; }
    };
  }

  /* ----------------------- SHARED: TIMER MODULE -----------------------
     createTimer(seconds, { onTick, onComplete }) -> { start, pause, reset, isRunning }
  ------------------------------------------------------------------- */
  function createTimer(seconds, callbacks){
    let remaining = seconds;
    let handle = null;
    const cb = callbacks || {};
    function tick(){
      remaining -= 1;
      if (cb.onTick) cb.onTick(remaining);
      if (remaining > 0 && remaining <= 5) Sound.tick();
      if (remaining <= 0){
        stop();
        Sound.whoosh();
        if (cb.onComplete) cb.onComplete();
      }
    }
    function start(){
      if (handle) return;
      handle = setInterval(tick, 1000);
    }
    function stop(){
      if (handle){ clearInterval(handle); handle = null; }
    }
    function reset(newSeconds){
      stop();
      remaining = (typeof newSeconds === 'number') ? newSeconds : seconds;
      if (cb.onTick) cb.onTick(remaining);
    }
    return {
      start, pause: stop, reset,
      isRunning: () => handle !== null,
      getRemaining: () => remaining
    };
  }

  /* ----------------------- SHARED: SCOREBOARD RENDERER ----------------------- */
  function renderScoreboardList(players){
    // players: [{name, score}]
    const sorted = players.slice().sort((a,b)=>b.score-a.score);
    const top = sorted.length ? sorted[0].score : 0;
    return `<ul class="scoreboard">${sorted.map(p => `
      <li class="${p.score===top && top>0 ? 'leader':''}">
        <span>${escapeHtml(p.name)}</span>
        <span class="score">${p.score}</span>
      </li>`).join('')}</ul>`;
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
  function roundLabel(n){ return n === Infinity ? '∞' : n; }

  /* ========================================================================
     SOUND ENGINE — cozy lo-fi background loop + click/game SFX.
     Everything here is synthesized live with the Web Audio API (oscillators,
     filters, noise buffers) rather than loaded from audio files, so there's
     nothing to download and nothing licensed to worry about. A single
     master gain node controls both music and SFX, so one mute switch
     silences everything instantly and smoothly (short gain ramp, no clicks).
  ======================================================================== */
  const Sound = (function(){
    let ctx = null, master = null, musicGain = null, sfxGain = null;
    let musicStarted = false, muted = false;
    let chordIndex = 0, nextChordTime = 0, chordSchedulerHandle = null;

    // A mellow, jazzy ii-V-I-ish loop (Am7 - Dm7 - G7 - Cmaj7) — classic
    // cozy lo-fi chord-progression flavor.
    const CHORDS = [
      [220.00, 261.63, 329.63, 392.00],
      [146.83, 174.61, 220.00, 261.63],
      [196.00, 246.94, 293.66, 349.23],
      [130.81, 164.81, 196.00, 246.94]
    ];
    const BASS = [110.00, 73.42, 98.00, 65.41];
    const CHORD_DUR = 4.4;

    function ensureCtx(){
      if (ctx) return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx){ console.warn('[Sound] Web Audio API not available in this browser.'); return; }
        ctx = new Ctx();
        master = ctx.createGain();
        master.gain.value = muted ? 0 : 0.9;
        master.connect(ctx.destination);
        musicGain = ctx.createGain();
        musicGain.gain.value = 0.55;
        musicGain.connect(master);
        sfxGain = ctx.createGain();
        sfxGain.gain.value = 0.9;
        sfxGain.connect(master);
      } catch(e){ console.error('[Sound] Failed to create AudioContext:', e); }
    }

    function playChord(startTime){
      if (!ctx) return;
      const notes = CHORDS[chordIndex % CHORDS.length];
      const bass = BASS[chordIndex % BASS.length];
      chordIndex++;

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 900;
      filter.Q.value = 0.4;
      filter.connect(musicGain);

      const chordGain = ctx.createGain();
      chordGain.gain.setValueAtTime(0, startTime);
      chordGain.gain.linearRampToValueAtTime(0.16, startTime + 1.5);
      chordGain.gain.linearRampToValueAtTime(0.16, startTime + CHORD_DUR - 1.6);
      chordGain.gain.linearRampToValueAtTime(0, startTime + CHORD_DUR + 0.5);
      chordGain.connect(filter);

      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        osc.type = i % 2 === 0 ? 'sine' : 'triangle';
        osc.frequency.value = freq;
        osc.detune.value = (Math.random() - 0.5) * 7;
        osc.connect(chordGain);
        osc.start(startTime);
        osc.stop(startTime + CHORD_DUR + 0.6);
      });

      const bassOsc = ctx.createOscillator();
      bassOsc.type = 'sine';
      bassOsc.frequency.value = bass;
      const bassGain = ctx.createGain();
      bassGain.gain.setValueAtTime(0, startTime);
      bassGain.gain.linearRampToValueAtTime(0.15, startTime + 0.9);
      bassGain.gain.linearRampToValueAtTime(0.15, startTime + CHORD_DUR - 1.3);
      bassGain.gain.linearRampToValueAtTime(0, startTime + CHORD_DUR + 0.4);
      bassOsc.connect(bassGain);
      bassGain.connect(musicGain);
      bassOsc.start(startTime);
      bassOsc.stop(startTime + CHORD_DUR + 0.5);
    }

    function chordScheduler(){
      if (!ctx) return;
      while (nextChordTime < ctx.currentTime + CHORD_DUR * 2){
        playChord(nextChordTime);
        nextChordTime += CHORD_DUR;
      }
    }

    function startVinylNoise(){
      const bufferSize = 2 * ctx.sampleRate;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * 0.5; }
      const noiseSource = ctx.createBufferSource();
      noiseSource.buffer = buffer;
      noiseSource.loop = true;
      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.value = 2800;
      noiseFilter.Q.value = 0.5;
      const noiseGain = ctx.createGain();
      noiseGain.gain.value = 0.02;
      noiseSource.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(musicGain);
      noiseSource.start();
    }

    function startMusic(){
      ensureCtx();
      if (!ctx || musicStarted) return;
      musicStarted = true;
      nextChordTime = ctx.currentTime + 0.15;
      chordScheduler();
      chordSchedulerHandle = setInterval(chordScheduler, 1000);
      startVinylNoise();
    }

    // ---- short synthesized SFX ----
    function blip({freq=440, dur=0.09, type='sine', vol=0.16, glideTo=null}={}){
      ensureCtx();
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g);
      g.connect(sfxGain);
      osc.start(t);
      osc.stop(t + dur + 0.03);
    }

    const click   = () => blip({freq:700, dur:0.05, type:'sine', vol:0.11});
    const select  = () => blip({freq:520, dur:0.07, type:'triangle', vol:0.13, glideTo:680});
    const toggle  = () => blip({freq:420, dur:0.09, type:'triangle', vol:0.14, glideTo:300});
    const pop     = () => blip({freq:900, dur:0.05, type:'sine', vol:0.1});
    const tick    = () => blip({freq:880, dur:0.035, type:'square', vol:0.06});
    const whoosh  = () => blip({freq:320, dur:0.2, type:'sine', vol:0.09, glideTo:600});
    const fail    = () => blip({freq:220, dur:0.22, type:'sawtooth', vol:0.12, glideTo:110});
    const success = () => { blip({freq:523.25, dur:0.12, type:'sine', vol:0.15}); setTimeout(()=>blip({freq:659.25, dur:0.15, type:'sine', vol:0.15}), 90); };
    const win     = () => { [523.25,659.25,783.99,1046.5].forEach((f,i)=>setTimeout(()=>blip({freq:f,dur:0.18,type:'sine',vol:0.15}), i*110)); };
    const lose    = () => { [392,349.23,293.66].forEach((f,i)=>setTimeout(()=>blip({freq:f,dur:0.22,type:'sawtooth',vol:0.1}), i*130)); };

    function setMuted(val){
      muted = val;
      ensureCtx();
      if (master && ctx){
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
        master.gain.linearRampToValueAtTime(muted ? 0 : 0.9, ctx.currentTime + 0.18);
      }
      try { localStorage.setItem('georgianGames_soundMuted', muted ? '1' : '0'); } catch(e){ /* storage unavailable */ }
    }
    function isMuted(){ return muted; }
    function loadMutedPref(){
      try { muted = localStorage.getItem('georgianGames_soundMuted') === '1'; } catch(e){ muted = false; }
    }
    // Browsers block audio until a real user gesture — call this from the
    // first click/keydown anywhere in the app to unlock and start the loop.
    function unlock(){
      ensureCtx();
      if (!ctx){ console.warn('[Sound] No AudioContext — cannot unlock.'); return; }
      if (ctx.state === 'suspended'){
        ctx.resume().then(() => {
          console.log('[Sound] AudioContext resumed, state:', ctx.state);
          if (!muted) startMusic();
        }).catch(err => console.error('[Sound] resume() failed:', err));
      } else if (!muted){
        startMusic();
      }
    }
    function debugState(){
      return { hasCtx: !!ctx, ctxState: ctx ? ctx.state : 'none', muted, musicStarted };
    }

    loadMutedPref();

    return { click, select, toggle, pop, tick, whoosh, fail, success, win, lose, setMuted, isMuted, unlock, debugState };
  })();

  /* ========================================================================
     APP STATE + ROUTER
  ======================================================================== */
  const App = {
    state: { view: 'home' },
    customImages: {},   // { gameId: dataURL } — user-uploaded card images
    pendingUploadId: null,

    // Custom card images are saved to localStorage so they survive closing
    // the browser tab, reloading the page, or the app file being updated
    // and reopened. If storage is unavailable (private browsing, quota
    // exceeded, etc.) this fails silently and falls back to in-memory only
    // for the current session.
    STORAGE_KEY: 'georgianGames_customImages',
    loadCustomImages(){
      try {
        const raw = localStorage.getItem(this.STORAGE_KEY);
        if (raw) this.customImages = JSON.parse(raw);
      } catch(e){ /* storage unavailable or corrupted — start empty */ }
    },
    saveCustomImages(){
      try {
        localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.customImages));
      } catch(e){
        // Most likely quota exceeded (large photos) or storage disabled.
        console.warn('ვერ მოხერხდა სურათის შენახვა მოწყობილობის მეხსიერებაში:', e);
      }
    },

    goHome(){
      this.state = { view: 'home' };
      this.render();
    },

    /* ----------------------- SAVE / RESUME ----------------------- */
    getModule(id){
      switch(id){
        case 'categories': return Categories;
        case 'hangman': return Hangman;
        case 'mafia': return Mafia;
        case 'imposter': return Imposter;
        case 'battleship': return Battleship;
        case 'associations': return Associations;
        case 'sitkvobana': return Sitkvobana;
        case 'joker': return Joker;
        case 'belote': return Belote;
        default: return null;
      }
    },
    saveKey(id){ return 'georgianGames_save_' + id; },

    // JSON can't represent Infinity (infinite-round mode) or Set objects
    // (Battleship's shot tracking), so both get a sentinel encoding here
    // and are decoded again in loadSavedGameData.
    saveReplacer(key, value){
      if (value === Infinity) return '__Infinity__';
      if (value instanceof Set) return { __isSet: true, values: Array.from(value) };
      return value;
    },
    saveReviver(key, value){
      if (value === '__Infinity__') return Infinity;
      if (value && typeof value === 'object' && value.__isSet) return new Set(value.values);
      return value;
    },

    // A game is only "in progress" once it's past the setup screen (and past
    // viewing the rulebook from setup, which doesn't count as having started).
    isGameStarted(mod){
      const d = mod.data;
      if (!d) return false;
      if (d.phase === 'setup') return false;
      if (d.phase === 'rules' && d.previousPhase === 'setup') return false;
      return true;
    },

    saveCurrentGame(){
      const id = this.state.view;
      if (id === 'home' || this.state.showChooser) return;
      const mod = this.getModule(id);
      if (!mod || !mod.data) return;
      if (!this.isGameStarted(mod)){
        // Quitting from setup leaves nothing worth resuming — don't create
        // (or leave behind) a save, so reopening this game starts fresh.
        this.clearSavedGame(id);
        return;
      }
      // Stop any running countdown so it doesn't keep ticking in the background.
      if (mod.data.timer && typeof mod.data.timer.pause === 'function') mod.data.timer.pause();
      try {
        localStorage.setItem(this.saveKey(id), JSON.stringify(mod.data, this.saveReplacer));
      } catch(e){ /* storage unavailable or full — quitting still works, just without saving */ }
    },
    hasSavedGame(id){
      try { return !!localStorage.getItem(this.saveKey(id)); } catch(e){ return false; }
    },
    loadSavedGameData(id){
      try {
        const raw = localStorage.getItem(this.saveKey(id));
        if (!raw) return null;
        return JSON.parse(raw, this.saveReviver);
      } catch(e){ return null; }
    },
    clearSavedGame(id){
      try { localStorage.removeItem(this.saveKey(id)); } catch(e){ /* ignore */ }
    },

    // Any pass-and-play "reveal your hand/role" gate must re-lock on resume
    // so nobody's secret info is shown the instant the app reopens.
    lockSecrets(data){
      if ('revealShown' in data) data.revealShown = false;
      if ('gateRevealedFor' in data) data.gateRevealedFor = null;
      if ('placementGateRevealedFor' in data) data.placementGateRevealedFor = null;
      return data;
    },

    quitToMenu(){
      this.saveCurrentGame();
      this.closePauseMenu();
      this.state = { view: 'home' };
      this.render();
    },

    resumeSavedGame(){
      const id = this.state.view;
      const mod = this.getModule(id);
      const saved = this.loadSavedGameData(id);
      if (mod && saved){
        mod.data = this.lockSecrets(saved);
      } else if (mod){
        mod.init();
      }
      this.state.showChooser = false;
      this.render();
    },

    startFreshGame(){
      const id = this.state.view;
      const mod = this.getModule(id);
      this.clearSavedGame(id);
      if (mod) mod.init();
      this.state.showChooser = false;
      this.render();
    },

    renderResumeChooser(){
      const id = this.state.view;
      const info = GAMES.find(g => g.id === id);
      const panel = el(`
        <div class="panel">
          <h2>${info ? escapeHtml(info.title) : ''}</h2>
          <p style="color:var(--ink-soft); margin-top:-8px;">შენახული თამაში მოიძებნა — გსურთ გაგრძელება, თუ ახალი თამაშის დაწყება?</p>
        </div>
      `);
      const actions = el(`<div class="action-row" style="flex-direction:column; align-items:stretch;">
        <button class="btn">წინა თამაშის გაგრძელება</button>
        <button class="btn ghost" style="margin-top:8px;">ახალი თამაშის დაწყება</button>
      </div>`);
      actions.children[0].addEventListener('click', () => this.resumeSavedGame());
      actions.children[1].addEventListener('click', () => this.startFreshGame());
      panel.appendChild(actions);

      const back = el(`<button class="back-link">← მთავარ გვერდზე</button>`);
      back.addEventListener('click', () => this.goHome());
      const wrap = el(`<div></div>`);
      wrap.appendChild(back);
      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- SOUND ENABLE BANNER -----------------------
       A single, unambiguous "enable sound" gesture. Relying only on
       incidental clicks elsewhere is fragile — this gives one obvious,
       dedicated affordance so there's never any doubt about whether sound
       was actually turned on. Shown once per browser unless dismissed. */
    ensureSoundBanner(){
      if (this.soundBanner) return;
      let dismissed = false;
      try { dismissed = localStorage.getItem('georgianGames_soundBannerDismissed') === '1'; } catch(e){ /* ignore */ }
      if (dismissed) return;

      const banner = document.createElement('div');
      banner.className = 'sound-banner';
      banner.innerHTML = `
        <span class="sound-banner-text">🎵 გსურთ ფონური მუსიკისა და ხმოვანი ეფექტების ჩართვა?</span>
        <div class="sound-banner-actions">
          <button type="button" class="btn" data-act="enable">ხმის ჩართვა</button>
          <button type="button" class="sound-banner-close" data-act="dismiss" aria-label="დახურვა">✕</button>
        </div>
      `;
      document.body.appendChild(banner);
      banner.querySelector('[data-act="enable"]').addEventListener('click', () => {
        Sound.setMuted(false);
        Sound.unlock();
        Sound.toggle();
        this.refreshSoundToggle();
        this.hideSoundBanner(true);
      });
      banner.querySelector('[data-act="dismiss"]').addEventListener('click', () => this.hideSoundBanner(true));
      this.soundBanner = banner;
      requestAnimationFrame(() => banner.classList.add('open'));
    },
    hideSoundBanner(remember){
      if (this.soundBanner) this.soundBanner.classList.remove('open');
      if (remember){ try { localStorage.setItem('georgianGames_soundBannerDismissed', '1'); } catch(e){ /* ignore */ } }
    },

    /* ----------------------- PAUSE / OPTIONS MENU ----------------------- */
    ensurePauseUI(){
      if (this.pauseBtn) return;
      this.pauseBtn = document.createElement('button');
      this.pauseBtn.type = 'button';
      this.pauseBtn.className = 'pause-toggle';
      this.pauseBtn.title = 'თამაშის ვარიანტები';
      this.pauseBtn.setAttribute('aria-label', 'თამაშის ვარიანტები');
      this.pauseBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>`;
      this.pauseBtn.addEventListener('click', () => this.openPauseMenu());
      document.body.appendChild(this.pauseBtn);

      this.pauseOverlay = document.createElement('div');
      this.pauseOverlay.className = 'pause-overlay';
      this.pauseOverlay.innerHTML = `
        <div class="pause-modal">
          <h3>თამაშის ვარიანტები</h3>
          <button type="button" class="btn" data-act="resume">გაგრძელება</button>
          <button type="button" class="btn ghost" data-act="quit">მთავარ მენიუში გასვლა</button>
        </div>
      `;
      this.pauseOverlay.addEventListener('click', (e) => { if (e.target === this.pauseOverlay) this.closePauseMenu(); });
      this.pauseOverlay.querySelector('[data-act="resume"]').addEventListener('click', () => this.closePauseMenu());
      this.pauseOverlay.querySelector('[data-act="quit"]').addEventListener('click', () => this.quitToMenu());
      document.body.appendChild(this.pauseOverlay);
    },
    openPauseMenu(){ this.pauseOverlay.classList.add('open'); },
    closePauseMenu(){ if (this.pauseOverlay) this.pauseOverlay.classList.remove('open'); },

    render(){
      this.ensurePauseUI();
      this.ensureSoundBanner();
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(this.buildHeader());

      const inGame = this.state.view !== 'home';
      this.pauseBtn.style.display = inGame && !this.state.showChooser ? 'flex' : 'none';
      if (!inGame || this.state.showChooser) this.closePauseMenu();

      let content;
      if (this.state.showChooser){
        content = this.renderResumeChooser();
      } else {
        switch(this.state.view){
          case 'categories': content = Categories.render(); break;
          case 'hangman': content = Hangman.render(); break;
          case 'mafia': content = Mafia.render(); break;
          case 'imposter': content = Imposter.render(); break;
          case 'battleship': content = Battleship.render(); break;
          case 'associations': content = Associations.render(); break;
          case 'sitkvobana': content = Sitkvobana.render(); break;
          case 'joker': content = Joker.render(); break;
          case 'belote': content = Belote.render(); break;
          default: content = this.buildHome();
        }
      }
      app.appendChild(content);
    },

    buildHeader(){
      const header = el(`
        <header class="app-header">
          <h1>გამო</h1>
          <p class="header-tagline">ქართული სამაგიდო და წვეულების თამაშების კრებული</p>
          <svg class="header-ornament" viewBox="0 0 180 14" xmlns="http://www.w3.org/2000/svg" fill="none">
            <line x1="0" y1="7" x2="72" y2="7" stroke="currentColor" stroke-width="1.2"/>
            <path d="M90 1l5 6-5 6-5-6z" fill="currentColor"/>
            <line x1="108" y1="7" x2="180" y2="7" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </header>
      `);

      if (!this.themeToggleBtn){
        this.themeToggleBtn = document.createElement('button');
        this.themeToggleBtn.type = 'button';
        this.themeToggleBtn.className = 'theme-toggle';
        this.themeToggleBtn.addEventListener('click', () => this.toggleTheme());
        document.body.appendChild(this.themeToggleBtn);
      }
      const SUN_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>`;
      const MOON_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>`;
      const isDark = this.currentTheme === 'dark';
      this.themeToggleBtn.innerHTML = isDark ? SUN_SVG : MOON_SVG;
      this.themeToggleBtn.title = isDark ? 'ღია რეჟიმი' : 'მუქი რეჟიმი';
      this.themeToggleBtn.setAttribute('aria-label', isDark ? 'ღია რეჟიმზე გადართვა' : 'მუქ რეჟიმზე გადართვა');

      if (!this.soundToggleBtn){
        this.soundToggleBtn = document.createElement('button');
        this.soundToggleBtn.type = 'button';
        this.soundToggleBtn.className = 'sound-toggle';
        this.soundToggleBtn.addEventListener('click', () => {
          Sound.unlock();
          Sound.toggle();
          Sound.setMuted(!Sound.isMuted());
          this.refreshSoundToggle();
        });
        document.body.appendChild(this.soundToggleBtn);
      }
      this.refreshSoundToggle();

      return header;
    },

    SOUND_ON_SVG: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.2L12 18V6L7.2 9.5z"/><path d="M16 9.2a4 4 0 0 1 0 5.6M18.6 6.8a7.8 7.8 0 0 1 0 10.4"/></svg>`,
    SOUND_OFF_SVG: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.2L12 18V6L7.2 9.5z"/><path d="M16.5 9.5l4.5 5M21 9.5l-4.5 5"/></svg>`,
    refreshSoundToggle(){
      if (!this.soundToggleBtn) return;
      const muted = Sound.isMuted();
      this.soundToggleBtn.innerHTML = muted ? this.SOUND_OFF_SVG : this.SOUND_ON_SVG;
      this.soundToggleBtn.title = muted ? 'ხმის ჩართვა' : 'ხმის დადუმება';
      this.soundToggleBtn.setAttribute('aria-label', muted ? 'ხმის ჩართვა' : 'ხმის დადუმება');
    },

    /* Theme persists across sessions via localStorage; falls back to the
       browser's prefers-color-scheme when nothing has been chosen yet. */
    loadTheme(){
      let theme = null;
      try { theme = localStorage.getItem('georgianGames_theme'); } catch(e){ /* storage unavailable */ }
      if (theme !== 'dark' && theme !== 'light'){
        theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      this.currentTheme = theme;
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    },
    toggleTheme(){
      this.currentTheme = (this.currentTheme === 'dark') ? 'light' : 'dark';
      if (this.currentTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.removeAttribute('data-theme');
      try { localStorage.setItem('georgianGames_theme', this.currentTheme); } catch(e){ /* storage unavailable */ }
      this.render();
    },

    buildHome(){
      if (!this.fileInput){
        this.fileInput = document.createElement('input');
        this.fileInput.type = 'file';
        this.fileInput.accept = 'image/*';
        this.fileInput.style.display = 'none';
        this.fileInput.addEventListener('change', () => {
          const file = this.fileInput.files && this.fileInput.files[0];
          const gameId = this.pendingUploadId;
          this.fileInput.value = ''; // allow re-selecting the same file later
          if (!file || !gameId) return;
          const reader = new FileReader();
          reader.onload = () => {
            this.customImages[gameId] = reader.result;
            this.pendingUploadId = null;
            this.saveCustomImages();
            this.render();
          };
          reader.readAsDataURL(file);
        });
        document.body.appendChild(this.fileInput);
      }

      const wrap = el(`<div></div>`);
      const CAMERA_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.5"/></svg>`;
      const X_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;

      CATEGORY_ORDER.forEach(catKey => {
        const gamesInCat = GAMES.filter(g => g.category === catKey);
        if (!gamesInCat.length) return;

        const section = el(`
          <section class="game-section">
            <h2 class="section-heading"><span>${CATEGORY_LABELS[catKey]}</span></h2>
            <div class="board"></div>
          </section>
        `);
        const board = section.querySelector('.board');

        gamesInCat.forEach((g) => {
          const customSrc = this.customImages[g.id];
          const visual = GAME_VISUALS[g.id] || { gradient:'linear-gradient(135deg,#6366F1,#4338CA)', icon:'' };
          const bgStyle = customSrc
            ? `background-image:url('${customSrc}')`
            : `background:radial-gradient(circle at 22% 20%, rgba(255,255,255,0.35), transparent 45%), ${visual.gradient}`;
          const card = el(`
            <div class="game-card ${g.playable ? 'playable' : 'soon'}" tabindex="${g.playable ? '0' : '-1'}">
              <span class="pin"></span>
              ${!g.playable ? '<span class="ribbon">მალე</span>' : ''}
              <div class="game-card-clip">
                <div class="game-card-image" style="${bgStyle}">
                  ${!customSrc ? `<div class="game-icon">${visual.icon}</div>` : ''}
                  <button type="button" class="upload-badge" title="შენი სურათის ატვირთვა">${CAMERA_SVG}</button>
                  ${customSrc ? `<button type="button" class="remove-badge" title="სურათის მოცილება">${X_SVG}</button>` : ''}
                </div>
                <div class="game-card-body">
                  <h3>${g.title}</h3>
                  <div class="meta">${g.meta}</div>
                </div>
              </div>
            </div>
          `);

          // Upload / remove badges must not trigger the card's own open-game click.
          const uploadBtn = card.querySelector('.upload-badge');
          uploadBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.pendingUploadId = g.id;
            this.fileInput.click();
          });
          const removeBtn = card.querySelector('.remove-badge');
          if (removeBtn){
            removeBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              delete this.customImages[g.id];
              this.saveCustomImages();
              this.render();
            });
          }

          if (g.playable){
            card.addEventListener('click', () => this.openGame(g.id));
            card.addEventListener('keydown', (e) => { if (e.key==='Enter' || e.key===' ') { e.preventDefault(); this.openGame(g.id); } });
          }
          board.appendChild(card);
        });

        wrap.appendChild(section);
      });

      return wrap;
    },

    openGame(id){
      if (this.hasSavedGame(id)){
        const saved = this.loadSavedGameData(id);
        const isFinished = saved && (saved.phase === 'end' || saved.phase === 'final');
        if (isFinished){
          this.clearSavedGame(id);
        } else {
          this.state = { view: id, showChooser: true };
          this.render();
          return;
        }
      }
      if (id === 'categories'){ Categories.init(); this.state.view = 'categories'; }
      else if (id === 'hangman'){ Hangman.init(); this.state.view = 'hangman'; }
      else if (id === 'mafia'){ Mafia.init(); this.state.view = 'mafia'; }
      else if (id === 'imposter'){ Imposter.init(); this.state.view = 'imposter'; }
      else if (id === 'battleship'){ Battleship.init(); this.state.view = 'battleship'; }
      else if (id === 'associations'){ Associations.init(); this.state.view = 'associations'; }
      else if (id === 'sitkvobana'){ Sitkvobana.init(); this.state.view = 'sitkvobana'; }
      else if (id === 'joker'){ Joker.init(); this.state.view = 'joker'; }
      else if (id === 'belote'){ Belote.init(); this.state.view = 'belote'; }
      this.state.showChooser = false;
      this.render();
    }
  };
  window.App = App;

  /* ========================================================================
     GAME 1: ქალაქობანა (CATEGORIES)
  ======================================================================== */
  const Categories = {
    data: null,

    init(){
      this.data = {
        phase: 'setup',           // setup | play | review | final
        mode: 'paper',            // digital mode is disabled for now — see renderSetup
        players: [],
        selectedCategoryIds: DEFAULT_CATEGORY_IDS.slice(),
        customCategories: [],
        timerSeconds: 45,
        totalRounds: 3,
        currentRound: 0,
        usedLetters: [],
        currentLetter: null,
        currentPlayerIndex: 0,
        roundAnswers: {},          // { playerName: { catId: answer } }
        totals: {},                // { playerName: score }
        timer: null
      };
    },

    activeCategories(){
      const fromPool = CATEGORY_POOL.filter(c => this.data.selectedCategoryIds.includes(c.id));
      const custom = this.data.customCategories.map(label => ({ id: 'custom_'+label, label }));
      return fromPool.concat(custom);
    },

    render(){
      const d = this.data;
      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'play') return d.mode === 'paper' ? this.renderPaperPlay() : this.renderDigitalPlay();
      if (d.phase === 'review') return d.mode === 'paper' ? this.renderPaperReview() : this.renderReview();
      return this.renderFinal();
    },

    renderSetup(){
      const d = this.data;
      const wrap = el(`<div></div>`);
      wrap.appendChild(el(`<button class="back-link">← მთავარ გვერდზე</button>`));
      wrap.querySelector('.back-link').addEventListener('click', () => App.quitToMenu());

      const panel = el(`<div class="panel"><h2>ქალაქობანა: მოთამაშეები</h2></div>`);

      // Digital (typed-answer) mode is disabled for now — only paper mode is offered.
      panel.appendChild(el(`
        <p style="color:var(--ink-soft); font-size:0.88rem; margin: -8px 0 4px;">
          თამაშობთ ქაღალდზე კალმით — აპი გამოგიტანთ ასოსა და დროს, ქულებს კი ბოლოს თავად შეიყვანთ.
        </p>
      `));

      // Players
      const playerField = el(`
        <div class="field-row">

      App.render();

    computeRoundScores(){
      const d = this.data;
      const cats = this.activeCategories();
      const letter = d.currentLetter;
      const result = {}; // { catId: { playerName: {answer, status, points} } }
      cats.forEach(c => {
        const answersByPlayer = {};
        d.players.forEach(p => {
          const raw = (d.roundAnswers[p] && d.roundAnswers[p][c.id]) || '';
          answersByPlayer[p] = raw.trim();
        });
        const normalized = {};
        d.players.forEach(p => { normalized[p] = answersByPlayer[p].toLowerCase(); });
        const counts = {};
        d.players.forEach(p => {
          const v = normalized[p];
          if (!v) return;
          counts[v] = (counts[v] || 0) + 1;
        });
        result[c.id] = {};
        d.players.forEach(p => {
          const answer = answersByPlayer[p];
          const startsRight = answer && answer[0] && answer[0].toLowerCase() === letter.toLowerCase();
          let status, points;
          if (!answer){ status = 'invalid'; points = 0; }
          else if (!startsRight){ status = 'invalid'; points = 0; }
          else if (counts[normalized[p]] > 1){ status = 'dup'; points = 5; }
          else { status = 'unique'; points = 10; }
          result[c.id][p] = { answer, status, points };
        });
      });
      return result;
    },

    renderReview(){
      const d = this.data;
      if (!d.roundResult) d.roundResult = this.computeRoundScores();
      const cats = this.activeCategories();
      const wrap = el(`<div></div>`);
      const panel = el(`
        <div class="panel">
          <h2>რაუნდი ${d.currentRound}: შედეგები (ასო: ${d.currentLetter})</h2>
          <p style="color:var(--ink-soft); font-size:0.85rem; margin-top:-8px;">დააჭირე ბეიჯს სტატუსის ხელით შესაცვლელად.</p>
        </div>
      `);
      const table = el(`<table class="review-table"><thead><tr><th>კატეგორია</th><th>მოთამაშე</th><th>პასუხი</th><th>სტატუსი</th></tr></thead><tbody></tbody></table>`);
      const tbody = table.querySelector('tbody');
      const statusLabel = { unique: 'უნიკალური · 10', dup: 'დუბლი · 5', invalid: 'ცარიელი/არასწორი · 0' };
      const nextStatus = { unique: 'dup', dup: 'invalid', invalid: 'unique' };
      const pointsFor = { unique: 10, dup: 5, invalid: 0 };

      cats.forEach(c => {
        d.players.forEach((p, idx) => {
          const cell = d.roundResult[c.id][p];
          const row = el(`
            <tr>
              <td>${idx===0 ? escapeHtml(c.label) : ''}</td>
              <td>${escapeHtml(p)}</td>
              <td>${cell.answer ? escapeHtml(cell.answer) : '<em style="color:var(--ink-soft)">—</em>'}</td>
              <td><button class="badge ${cell.status}">${statusLabel[cell.status]}</button></td>
            </tr>
          `);
          const badgeBtn = row.querySelector('.badge');
          badgeBtn.addEventListener('click', () => {
            const ns = nextStatus[cell.status];
            cell.status = ns; cell.points = pointsFor[ns];
            badgeBtn.className = 'badge ' + ns;
            badgeBtn.textContent = statusLabel[ns];
          });
          tbody.appendChild(row);
        });
      });
      panel.appendChild(table);

      const applyScores = () => {
        d.players.forEach(p => {
          let sum = 0;
          cats.forEach(c => { sum += d.roundResult[c.id][p].points; });
          d.totals[p] += sum;
        });
        d.roundResult = null;
      };

      const confirmBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">
        ${d.currentRound < d.totalRounds ? 'შემდეგი რაუნდი' : 'საბოლოო შედეგები'}
      </button>`);
      confirmBtn.addEventListener('click', () => {
        applyScores();
        if (d.currentRound < d.totalRounds) this.startRound();
        else { d.phase = 'final'; Sound.win(); App.render(); }
      });
      panel.appendChild(confirmBtn);

      if (d.totalRounds === Infinity){
        const endBtn = el(`<button class="btn ghost" style="width:100%; margin-top:8px;">თამაშის დასრულება</button>`);
        endBtn.addEventListener('click', () => {
          applyScores();
          d.phase = 'final';
          Sound.win();
          App.render();
        });
        panel.appendChild(endBtn);
      }

      wrap.appendChild(panel);
      return wrap;
    },

    computePaperRoundScores(){
      // Paper mode has no typed answers to compare — every cell starts
      // unscored (no default/assumed value) so the group has to explicitly
      // decide each one: 0 (no answer or wrong), +5 (correct but matched by
      // another player), +10 (correct and original).
      const d = this.data;
      const cats = this.activeCategories();
      const result = {};
      cats.forEach(c => {
        result[c.id] = {};
        d.players.forEach(p => {
          result[c.id][p] = { status: null, points: 0 };
        });
      });
      return result;
    },

    renderPaperReview(){
      const d = this.data;
      if (!d.roundResult) d.roundResult = this.computePaperRoundScores();
      const cats = this.activeCategories();
      const wrap = el(`<div></div>`);
      const panel = el(`
        <div class="panel">
          <h2>რაუნდი ${d.currentRound}: ქულების შეყვანა (ასო: ${d.currentLetter})</h2>
          <p style="color:var(--ink-soft); font-size:0.85rem; margin-top:-8px;">წაიკითხეთ პასუხები ქაღალდიდან და თითოეულს მიუთითეთ ქულა.</p>
        </div>
      `);
      const table = el(`<table class="review-table"><thead><tr><th>კატეგორია</th><th>მოთამაშე</th><th>ქულა</th></tr></thead><tbody></tbody></table>`);
      const tbody = table.querySelector('tbody');
      const OPTIONS = [
        { status:'invalid', points:0, label:'0' },
        { status:'dup', points:5, label:'+5' },
        { status:'unique', points:10, label:'+10' }
      ];

      const confirmBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">
        ${d.currentRound < d.totalRounds ? 'შემდეგი რაუნდი' : 'საბოლოო შედეგები'}
      </button>`);
      let endBtn = null;

      const updateConfirmState = () => {
        const allScored = cats.every(c => d.players.every(p => d.roundResult[c.id][p].status !== null));
        confirmBtn.disabled = !allScored;
        if (endBtn) endBtn.disabled = !allScored;
      };

      cats.forEach(c => {
        d.players.forEach((p, idx) => {
          const cell = d.roundResult[c.id][p];
          const row = el(`
            <tr>
              <td>${idx===0 ? escapeHtml(c.label) : ''}</td>
              <td>${escapeHtml(p)}</td>
              <td></td>
            </tr>
          `);
          const pickCell = row.children[2];
          const pickRow = el(`<div class="score-pick-row"></div>`);
          OPTIONS.forEach(opt => {
            const btn = el(`<button type="button" class="badge ${opt.status} ${cell.status===opt.status?'selected':''}">${opt.label}</button>`);
            btn.addEventListener('click', () => {
              cell.status = opt.status;
              cell.points = opt.points;
              pickRow.querySelectorAll('button').forEach(b => b.classList.remove('selected'));
              btn.classList.add('selected');
              updateConfirmState();
            });
            pickRow.appendChild(btn);
          });
          pickCell.appendChild(pickRow);
          tbody.appendChild(row);
        });
      });
      panel.appendChild(table);
      panel.appendChild(el(`<p style="font-size:0.8rem; color:var(--ink-soft); margin:6px 0 0;">0 — პასუხი არ არის ან არასწორია · +5 — სწორია, მაგრამ სხვამაც დაწერა იგივე · +10 — სწორი და ორიგინალური</p>`));

      const applyScores = () => {
        d.players.forEach(p => {
          let sum = 0;
          cats.forEach(c => { sum += d.roundResult[c.id][p].points; });
          d.totals[p] += sum;
        });
        d.roundResult = null;
      };

      confirmBtn.addEventListener('click', () => {
        applyScores();
        if (d.currentRound < d.totalRounds) this.startRound();
        else { d.phase = 'final'; Sound.win(); App.render(); }
      });
      panel.appendChild(confirmBtn);

      if (d.totalRounds === Infinity){
        endBtn = el(`<button class="btn ghost" style="width:100%; margin-top:8px;">თამაშის დასრულება</button>`);
        endBtn.addEventListener('click', () => {
          applyScores();
          d.phase = 'final';
          Sound.win();
          App.render();
        });
        panel.appendChild(endBtn);
      }
      updateConfirmState();

      wrap.appendChild(panel);
      return wrap;
    },

    renderFinal(){

  const Hangman = {
    data: null,
    MAX_WRONG: 8,

    init(){
      this.data = {
        phase: 'setup',      // setup | play | end | final
        bank: 'city',
        word: null,
        guessed: [],         // letters guessed
        wrong: 0,
        players: [],
        turnIndex: 0,
        result: null,        // 'win' | 'lose' (this word)
        roundsWon: 0,        // team-wide across the session
        roundsLost: 0
      };
    },

    render(){
      const d = this.data;
      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'end') return this.renderEnd();

      return this.renderPlay();
    },

    renderSetup(){
      const d = this.data;
      const wrap = el(`<div></div>`);
      wrap.appendChild(el(`<button class="back-link">← მთავარ გვერდზე</button>`));

      const bankAcc = makeAccordion('სიტყვების კატეგორია', WORD_BANK_LABELS[d.bank]);
      bankAcc.body.appendChild(el(`<div class="chip-group"></div>`));

      Object.keys(WORD_BANK_LABELS).forEach(key => {

        chip.addEventListener('click', () => {
          d.bank = key;
          bankGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
          bankAcc.setSummary(WORD_BANK_LABELS[key]);
        });
        bankGroup.appendChild(chip);
      });
      panel.appendChild(bankAcc.wrap);

      // players (turn order only — no individual scoring, this is a team effort)
      const playerField = el(`
        <div class="field-row">
          <label>მოთამაშეები (არასავალდებულო — ვისი რიგიცაა გამოცნობა)</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი...">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const nameInput = playerField.querySelector('input');
      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val) return;
        d.players.push(val);
        nameInput.value = ''; renderPlayers(); nameInput.focus();
      };
      playerField.querySelector('.btn').addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); addPlayer(); } });
      renderPlayers();
      panel.appendChild(playerField);

      const startBtn = el(`<button class="btn" style="width:100%; margin-top:8px;">დაწყება</button>`);
      startBtn.addEventListener('click', () => {
        d.word = pickRandom(WORD_BANKS[d.bank]);
        d.guessed = [];
        d.wrong = 0;
        d.turnIndex = 0;
        d.result = null;
        d.roundsWon = 0;
        d.roundsLost = 0;
        d.phase = 'play';
        App.render();
      });
      panel.appendChild(startBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    renderPlay(){
      const d = this.data;
      const wrap = el(`<div></div>`);
      const panel = el(`<div class="panel"></div>`);

      if (d.players.length){
        panel.appendChild(el(`<div class="turn-banner">იცნობს: <strong>${escapeHtml(d.players[d.turnIndex % d.players.length])}</strong></div>`));
      } else {
        panel.appendChild(el(`<div class="turn-banner">გამოიცანი სიტყვა</div>`));
      }

      // Plate of khinkali (lives)
      const plateWrap = el(`<div class="plate-wrap"></div>`);
      const plate = el(`<div class="plate"></div>`);
      const grid = el(`<div class="khinkali-grid"></div>`);
      for (let i=0;i<this.MAX_WRONG;i++){
        const k = el(`<div class="khinkali ${i < d.wrong ? 'eaten' : ''}">${KHINKALI_SVG}</div>`);
        grid.appendChild(k);
      }
      plate.appendChild(grid);
      plateWrap.appendChild(plate);
      plateWrap.appendChild(el(`<div class="lives-caption">დარჩენილი ხინკალი: ${this.MAX_WRONG - d.wrong} / ${this.MAX_WRONG}</div>`));
      panel.appendChild(plateWrap);

      // Word display
      const wordEl = el(`<div class="word-display"></div>`);
      d.word.split('').forEach(letter => {
        const shown = d.guessed.includes(letter) ? letter : '';
        wordEl.appendChild(el(`<div class="letter-tile">${shown}</div>`));
      });
      panel.appendChild(wordEl);

      // Keyboard
      const kb = el(`<div class="keyboard"></div>`);
      GEO_ALPHABET.forEach(letter => {
        const already = d.guessed.includes(letter);
        const inWord = d.word.includes(letter);
        const key = el(`<button class="key ${already ? (inWord?'correct':'wrong') : ''}" ${already || d.result ? 'disabled':''}>${letter}</button>`);
        key.addEventListener('click', () => this.guess(letter));
        kb.appendChild(key);
      });
      panel.appendChild(kb);

      wrap.appendChild(panel);

      // check end conditions after render (in case guess triggered from a previous render state)
      return wrap;
    },

    guess(letter){
      const d = this.data;
      if (d.guessed.includes(letter) || d.result) return;
      d.guessed.push(letter);
      const correct = d.word.includes(letter);
      if (!correct){
        d.wrong += 1;
      }
      const solved = d.word.split('').every(l => d.guessed.includes(l));
      if (solved){
        d.result = 'win';
        d.roundsWon += 1;
        d.phase = 'end';
        Sound.win();
      } else if (d.wrong >= this.MAX_WRONG){
        d.result = 'lose';
        d.roundsLost += 1;
        d.phase = 'end';
        Sound.lose();
      } else if (!correct && d.players.length){
        d.turnIndex += 1; // pass to next player on a wrong guess
        Sound.fail();
      } else if (!correct){
        Sound.fail();
      } else {
        Sound.success();
      }
      App.render();
    },

    renderEnd(){
      const d = this.data;
      const wrap = el(`<div></div>`);
      const panel = el(`<div class="panel"><h2>${d.result === 'win' ? 'გამარჯვება!' : 'თამაში დასრულდა'}</h2></div>`);
      panel.appendChild(el(`<div class="status-msg ${d.result}">${d.result === 'win' ? '🎉 სიტყვა გამოიცნეს!' : '🍽️ ხინკალი დაილია...'}</div>`));
      panel.appendChild(el(`<div style="text-align:center; font-family:var(--font-display); font-size:1.4rem; color:var(--accent); margin-bottom:14px;">${d.word}</div>`));
      panel.appendChild(el(`
        <p style="text-align:center; color:var(--ink-soft); font-size:0.92rem; margin-bottom:16px;">
          გუნდის ანგარიში — მოგებული: <strong style="color:var(--sage);">${d.roundsWon}</strong> ·
          წაგებული: <strong style="color:var(--rust);">${d.roundsLost}</strong>
        </p>
      `));
      const actions = el(`<div class="action-row">
        <button class="btn">კიდევ ერთი სიტყვა</button>
        <button class="btn secondary">თამაშის დასრულება</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        d.word = pickRandom(WORD_BANKS[d.bank]);
        d.guessed = []; d.wrong = 0; d.result = null; d.phase = 'play';
        App.render();
      });
      actions.children[1].addEventListener('click', () => { d.phase = 'final'; App.render(); });
      panel.appendChild(actions);
      const homeBtn = el(`<button class="btn ghost" style="width:100%; margin-top:8px;">მთავარ გვერდზე</button>`);
      homeBtn.addEventListener('click', () => { App.clearSavedGame(App.state.view); App.goHome(); });
      panel.appendChild(homeBtn);
      wrap.appendChild(panel);
      return wrap;
    },

    renderFinal(){
      const d = this.data;
      const wrap = el(`<div></div>`);
      const teamWon = d.roundsWon > d.roundsLost;
      const panel = el(`
        <div class="panel">
          <div class="winner-banner">
            <div class="crown">${teamWon ? '🏆' : '😔'}</div>
            <h3>${teamWon ? 'ყველა მოთამაშე იმარჯვებს!' : 'ყველა მოთამაშე აგებს.'}</h3>
            <div style="color:var(--ink-soft); margin-top:6px;">
              მოგებული სიტყვები: ${d.roundsWon} · წაგებული: ${d.roundsLost}
            </div>
          </div>
        </div>
      `);
      const actions = el(`<div class="action-row">
        <button class="btn">თავიდან თამაში</button>
        <button class="btn ghost">მთავარ გვერდზე</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        const players = d.players.slice();
        const bank = d.bank;
        this.init();
        this.data.players = players;
        this.data.bank = bank;
        this.data.word = pickRandom(WORD_BANKS[bank]);
        this.data.phase = 'play';
        App.render();
      });
      actions.children[1].addEventListener('click', () => { App.clearSavedGame(App.state.view); App.goHome(); });
      panel.appendChild(actions);
      wrap.appendChild(panel);
      return wrap;
    }
  };

  /* ========================================================================
     GAME 3: მაფია (MAFIA) — role dealer + night/day narrator assistant.
     The actual talking, accusing, and voting happens out loud around the
     table; this module just deals secret roles and reads out the night/day
     script so one phone can run the whole thing.
  ======================================================================== */
  const Mafia = {
    data: null,

    init(){
      this.data = {
        phase: 'setup',       // rules | setup | reveal | night/day (rendered via renderGame) | end
        previousPhase: 'setup',
        players: [],          // strings while in setup; [{name, role, alive}] once roles are dealt
        mafiaCount: 1,
        doctorEnabled: false,
        detectiveEnabled: false,
        revealIndex: 0,
        revealShown: false,
        nightNumber: 0,
        dayNumber: 0,
        phaseLabel: 'night',
        scriptSteps: [],
        scriptIndex: 0,
        nightKillTarget: null,
        nightSaveTarget: null,
        eliminatedThisNight: null,
        pendingNightIntro: null,
        winner: null
      };
    },

    render(){
      const d = this.data;
      if (d.phase === 'rules') return this.renderRules();
      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'reveal') return this.renderReveal();
      if (d.phase === 'end') return this.renderEnd();
      return this.renderGame();
    },

    /* shared top bar: back-to-home + always-available rulebook link */
    topBar(showBack){
      const wrap = el(`<div></div>`);
      const bar = el(`<div class="top-bar"></div>`);

        bar.appendChild(back);

        bar.appendChild(el(`<span></span>`));

      const rulesLink = el(`<button class="rules-link">📖 წესები</button>`);

        this.data.previousPhase = this.data.phase;

      wrap.appendChild(bar);
      return wrap;
    },

    suggestedRoles(n){
      const mafia = Math.max(1, Math.floor(n / 4));
      return { mafia, doctor: n >= 5, detective: n >= 6 };
    },

        <strong>მშვიდობიანები</strong>, რომლებიც დღისით მსჯელობითა და კენჭისყრით
        ცდილობენ მაფიის გამოვლენას. ეს აპლიკაცია ასრულებს "წამყვანის" როლს: არიგებს

          <li><strong>ღამე:</strong> ყველა თვალდახუჭული ზის. აპი რიგრიგობით ამცნობს, ვინ "გაიღვიძოს": მაფია ჩუმად ირჩევს მსხვერპლს, ექიმი (თუ თამაშშია) ირჩევს ვის იხსნის, დეტექტივი (თუ თამაშშია) ჩუმად ამოწმებს ერთ მოთამაშეს.</li>

          <li>ციკლი (ღამე, დღე, ღამე, დღე) მეორდება გამარჯვების პირობის დადგომამდე.</li>
        </ol>
      `));

      panel.appendChild(el(`<h3>გამარჯვების პირობა</h3>`));
      panel.appendChild(el(`
        <ul>
          <li><strong>მშვიდობიანები იმარჯვებენ</strong>, თუ ყველა მაფია გამოვლენილია და გარიცხულია.</li>
          <li><strong>მაფია იმარჯვებს</strong>, თუ ცოცხალი მაფიის რაოდენობა უტოლდება ან აღემატება დანარჩენ ცოცხალ მოთამაშეებს.</li>
        </ul>

      panel.appendChild(el(`

          <li>ღამის ფაზაში ტელეფონი ერთი სანდო ადამიანის ხელში იყოს და არავინ ლაპარაკობდეს.</li>
          <li>მაფია და ექიმი მხოლოდ თითის გაწვდენით/მითითებით "ირჩევენ", ხმის ამოღების გარეშე.</li>
          <li>5 მოთამაშემდე შეგიძლიათ ითამაშოთ მხოლოდ მაფიითა და მშვიდობიანებით, ექიმისა და დეტექტივის გარეშე.</li>
          <li>რაც მეტი მოთამაშეა, მით მეტი მაფია სჭირდება თამაშს სამართლიანობისთვის. სცადეთ "ავტომატური განაწილება" ღილაკი.</li>

    /* ----------------------- SETUP ----------------------- */
    renderSetup(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>მაფია: მოთამაშეები</h2></div>`);

      const playerField = el(`
        <div class="field-row">
          <label>დაამატე მოთამაშეები (მინიმუმ 5)</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი..." maxlength="20">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const nameInput = playerField.querySelector('input');
      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm" aria-label="წაშლა">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); updateSummary(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val) return;
        d.players.push(val);
        nameInput.value = '';
        renderPlayers(); updateSummary();
        nameInput.focus();
      };
      playerField.querySelector('.btn').addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPlayer(); } });
      panel.appendChild(playerField);

      const roleAcc = makeAccordion('როლების განაწილება', '');
      const rolesRow = el(`<div style="display:flex; flex-wrap:wrap; gap:14px; align-items:center;"></div>`);

      const mafiaStepper = el(`
        <div class="stepper">
          <button type="button" data-act="dec">−</button>
          <span class="val">${d.mafiaCount}</span>
          <button type="button" data-act="inc">+</button>
          <span style="color:var(--ink-soft); font-size:0.85rem; margin-left:2px;">მაფია</span>
        </div>
      `);
      rolesRow.appendChild(mafiaStepper);

      const doctorChip = el(`<button type="button" class="chip ${d.doctorEnabled?'active':''}">ექიმი</button>`);
      doctorChip.addEventListener('click', () => {
        d.doctorEnabled = !d.doctorEnabled;
        doctorChip.classList.toggle('active', d.doctorEnabled);
        updateSummary();
      });
      rolesRow.appendChild(doctorChip);

      const detectiveChip = el(`<button type="button" class="chip ${d.detectiveEnabled?'active':''}">დეტექტივი</button>`);
      detectiveChip.addEventListener('click', () => {
        d.detectiveEnabled = !d.detectiveEnabled;
        detectiveChip.classList.toggle('active', d.detectiveEnabled);
        updateSummary();
      });
      rolesRow.appendChild(detectiveChip);

      const autoBtn = el(`<button type="button" class="btn ghost">ავტომატური განაწილება</button>`);
      autoBtn.addEventListener('click', () => {
        const s = this.suggestedRoles(d.players.length);
        d.mafiaCount = s.mafia; d.doctorEnabled = s.doctor; d.detectiveEnabled = s.detective;
        mafiaStepper.querySelector('.val').textContent = d.mafiaCount;
        doctorChip.classList.toggle('active', d.doctorEnabled);
        detectiveChip.classList.toggle('active', d.detectiveEnabled);
        updateSummary();
      });
      rolesRow.appendChild(autoBtn);

      roleAcc.body.appendChild(rolesRow);
