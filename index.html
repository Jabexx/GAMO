          <li>თუ დაცვა შესრულდა, თავდამსხმელს შეუძლია დაამატოს კიდევ ერთი ბარათი, რომლის ღირებულებაც უკვე მაგიდაზეა (მაგ. თუ მაგიდაზეა 8, შეიძლება დაემატოს ნებისმიერი მასტის 8) — მაქსიმუმ 6 წყვილამდე.</li>
          <li>თუ დამცველს არ სურს ან არ შეუძლია ბარათის დაფარვა, იღებს მაგიდაზე არსებულ ყველა ბარათს ხელში.</li>
        </ul>
      `));

      panel.appendChild(el(`<h3>ბარათების შევსება</h3>`));
      panel.appendChild(el(`
        <p>რაუნდის დასრულების შემდეგ (დაფარვა ან აღება) ყველა ავსებს ხელს 6 ბარათამდე გავარდნის გროვიდან, რიგრიგობით — თავდამსხმელი პირველი, დამცველი ბოლო.</p>
      `));

      panel.appendChild(el(`<h3>რიგის გადაცემა</h3>`));
      panel.appendChild(el(`
        <ul>
          <li>თუ დამცველმა დაფარა — ის ხდება შემდეგი რაუნდის თავდამსხმელი.</li>
          <li>თუ დამცველმა აიღო ბარათები — რიგი მას გამოტოვებს და შემდეგი თავდამსხმელი მისი შემდეგი მოთამაშეა.</li>
        </ul>
      `));

      panel.appendChild(el(`<h3>დასასრული</h3>`));
      panel.appendChild(el(`<p>როცა გავარდნის გროვა ილევა, მოთამაშე, ვინც ხელს დაცლის, თამაშიდან გამოდის უსაფრთხოდ. ბოლოს დარჩენილი — ერთადერთი ბარათებით ხელში — არის დურაკი.</p>`));

      panel.appendChild(el(`<h3>ამ აპის გამარტივებები</h3>`));
      panel.appendChild(el(`
        <ul>
          <li>მხოლოდ მთავარ თავდამსხმელს შეუძლია ბარათის დამატება — გვერდითი მოთამაშეების "მიგდება" ამ ვერსიაში არ არის.</li>
          <li>ბარათები თამაშდება ერთ-ერთზე, თანმიმდევრულად, რამდენიმეს ერთდროულად დაყრის ნაცვლად.</li>
          <li>თითოეული მოთამაშის ხელი დამალულია — ტელეფონის გადაცემისას დააჭირეთ "ბარათების ნახვა", რომ ნახოთ თქვენი ხელი.</li>
        </ul>
      `));

      const backBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">დაბრუნება</button>`);
      backBtn.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      panel.appendChild(backBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- SETUP ----------------------- */
    renderSetup(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>დურაკი — მოთამაშეები</h2></div>`);

      const playerField = el(`
        <div class="field-row">
          <label>დაამატე მოთამაშეები (2-დან 5-მდე)</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი..." maxlength="20">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const nameInput = playerField.querySelector('input');
      const startBtn = el(`<button class="btn" style="width:100%; margin-top:10px;">ბარათების დარიგება</button>`);
      const warnMsg = el(`<p style="color:var(--rust); font-size:0.85rem; margin-top:8px;"></p>`);

      const updateValidity = () => {
        const n = d.players.length;
        const valid = n >= 2 && n <= 5;
        startBtn.disabled = !valid;
        if (n < 2){ warnMsg.style.display='block'; warnMsg.textContent = 'მინიმუმ 2 მოთამაშეა საჭირო.'; }
        else if (n > 5){ warnMsg.style.display='block'; warnMsg.textContent = 'მაქსიმუმ 5 მოთამაშეა დაშვებული (36-ბარათიან ნახირში კოზირისთვის ადგილი უნდა დარჩეს).'; }
        else warnMsg.style.display='none';
      };
      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm" aria-label="წაშლა">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); updateValidity(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val || d.players.length >= 5) return;
        d.players.push(val);
        nameInput.value = '';
        renderPlayers(); updateValidity();
        nameInput.focus();
      };
      playerField.querySelector('.btn').addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPlayer(); } });
      panel.appendChild(playerField);
      panel.appendChild(warnMsg);
      panel.appendChild(startBtn);

      startBtn.addEventListener('click', () => {
        if (startBtn.disabled) return;
        this.dealAndStart();
      });

      renderPlayers();
      updateValidity();

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- DEAL / START ----------------------- */
    buildDeck(){
      let deck = [];
      SUITS.forEach(s => RANKS.forEach(r => deck.push({ rank:r, suit:s })));
      return shuffle(deck);
    },

    dealAndStart(){
      const d = this.data;
      d.players = d.players.map(p => (typeof p === 'string' ? { name: p, hand: [], out: false } : p));
      const deck = this.buildDeck();
      d.players.forEach(p => { p.hand = deck.splice(0,6); p.out = false; });
      const trumpCard = deck.shift();
      d.trumpCard = trumpCard;
      d.trumpSuit = trumpCard.suit;
      deck.push(trumpCard); // drawn last
      d.deck = deck;
      d.discardCount = 0;
      d.finishOrder = [];
      d.loser = null;

      let lowest = Infinity, starter = 0;
      d.players.forEach((p, i) => {
        p.hand.forEach(c => { if (c.suit === d.trumpSuit && c.rank < lowest){ lowest = c.rank; starter = i; } });
      });
      d.attackerIndex = starter;
      d.defenderIndex = (starter + 1) % d.players.length;
      d.activeIndex = d.attackerIndex;
      d.activeRole = 'attack';
      d.table = [];
      d.gateRevealedFor = null;
      d.turnMessage = `პირველი თავდამსხმელია ${d.players[starter].name} (ყველაზე დაბალი კოზირი).`;
      d.phase = 'game';
      App.render();
    },

    cardBeats(defendCard, attackCard){
      const d = this.data;
      if (defendCard.suit === attackCard.suit) return defendCard.rank > attackCard.rank;
      if (defendCard.suit === d.trumpSuit && attackCard.suit !== d.trumpSuit) return true;
      return false;
    },

    ranksInPlay(){
      const set = new Set();
      this.data.table.forEach(t => { set.add(t.attack.rank); if (t.defend) set.add(t.defend.rank); });
      return set;
    },

    /* ----------------------- ACTIONS ----------------------- */
    playAttackCard(card){
      const d = this.data;
      const p = d.players[d.attackerIndex];
      p.hand = p.hand.filter(c => cardKey(c) !== cardKey(card));
      d.table.push({ attack: card, defend: null });
      d.turnMessage = '';
      d.activeIndex = d.defenderIndex;
      d.activeRole = 'defend';
      App.render();
    },

    playDefendCard(card){
      const d = this.data;
      const p = d.players[d.defenderIndex];
      p.hand = p.hand.filter(c => cardKey(c) !== cardKey(card));
      const pair = d.table.find(t => t.defend === null);
      pair.defend = card;
      d.turnMessage = '';
      d.activeIndex = d.attackerIndex;
      d.activeRole = 'attack-continue';
      App.render();
    },

    takeCards(){
      const d = this.data;
      const p = d.players[d.defenderIndex];
      const taken = [];
      d.table.forEach(t => { taken.push(t.attack); if (t.defend) taken.push(t.defend); });
      p.hand = p.hand.concat(taken);
      d.table = [];
      d.turnMessage = `${p.name}-მ აიღო ბარათები.`;
      this.endRound(false);
    },

    endAttack(){
      const d = this.data;
      d.discardCount += d.table.length * 2;
      d.turnMessage = 'ბარათები გადაიგდო — რაუნდი დასრულდა.';
      d.table = [];
      this.endRound(true);
    },

    endRound(defended){
      const d = this.data;
      const n = d.players.length;
      const order = [];
      for (let i=0;i<n;i++){
        const idx = (d.attackerIndex + i) % n;
        if (idx !== d.defenderIndex) order.push(idx);
      }
      order.push(d.defenderIndex);
      order.forEach(idx => {
        const p = d.players[idx];
        while (p.hand.length < 6 && d.deck.length > 0) p.hand.push(d.deck.shift());
      });

      d.players.forEach(p => {
        if (!p.out && p.hand.length === 0 && d.deck.length === 0){
          p.out = true;
          d.finishOrder.push(p.name);
        }
      });

      const aliveIdx = d.players.map((p,i)=>i).filter(i => !d.players[i].out);
      if (aliveIdx.length <= 1){
        d.loser = aliveIdx.length === 1 ? d.players[aliveIdx[0]].name : null;
        d.phase = 'end';
        App.render();
        return;
      }

      let nextAttacker = defended ? d.defenderIndex : (d.defenderIndex + 1) % n;
      let guard = 0;
      while (d.players[nextAttacker].out && guard < n * 2){ nextAttacker = (nextAttacker + 1) % n; guard++; }
      let nextDefender = (nextAttacker + 1) % n;
      guard = 0;
      while (d.players[nextDefender].out && guard < n * 2){ nextDefender = (nextDefender + 1) % n; guard++; }

      d.attackerIndex = nextAttacker;
      d.defenderIndex = nextDefender;
      d.activeIndex = nextAttacker;
      d.activeRole = 'attack';
      d.gateRevealedFor = null;
      App.render();
    },

    /* ----------------------- RENDER: GAME ----------------------- */
    renderCard(card, opts){
      opts = opts || {};
      const isRed = RED_SUITS.includes(card.suit);
      const cls = `card ${isRed ? 'red':'black'} ${opts.mini ? 'mini':''}`;
      const inner = `<span>${rankLabel(card.rank)}</span><span class="suit">${card.suit}</span>`;
      if (opts.button){
        const b = el(`<button type="button" class="${cls}" ${opts.disabled ? 'disabled':''}>${inner}</button>`);
        return b;
      }
      return el(`<div class="${cls}">${inner}</div>`);
    },

    renderPublicBoard(){
      const d = this.data;
      const box = el(`<div class="public-board"></div>`);
      const top = el(`<div class="public-board-top"></div>`);
      top.appendChild(el(`
        <span class="trump-badge">კოზირი: <span class="${RED_SUITS.includes(d.trumpSuit)?'red':'black'}" style="font-weight:700;">${rankLabel(d.trumpCard.rank)}${d.trumpCard.suit}</span></span>
      `));
      top.appendChild(el(`<span class="deck-badge">გასაწირავი: ${d.deck.length}</span>`));
      top.appendChild(el(`<span class="deck-badge">გადაგდებული: ${d.discardCount}</span>`));
      box.appendChild(top);

      const tableRow = el(`<div class="table-row"></div>`);
      if (!d.table.length){
        tableRow.appendChild(el(`<div class="table-empty-hint">მაგიდა ცარიელია</div>`));
      } else {
        d.table.forEach(t => {
          const pair = el(`<div class="table-pair"></div>`);
          pair.appendChild(this.renderCard(t.attack));
          if (t.defend){
            const dc = this.renderCard(t.defend);
            dc.classList.add('defend-card');
            pair.appendChild(dc);
          }
          tableRow.appendChild(pair);
        });
      }
      box.appendChild(tableRow);

      const roster = el(`<div class="durak-roster"></div>`);
      d.players.forEach((p, i) => {
        let cls = 'p-chip';
        if (p.out) cls += ' out';
        else if (i === d.attackerIndex) cls += ' attacker';
        else if (i === d.defenderIndex) cls += ' defender';
        const tag = p.out ? '✓' : (i === d.attackerIndex ? 'შეტევა' : (i === d.defenderIndex ? 'დაცვა' : ''));
        roster.appendChild(el(`<span class="${cls}">${escapeHtml(p.name)} · ${p.hand.length}${tag ? ' · '+tag : ''}</span>`));
      });
      box.appendChild(roster);

      if (d.turnMessage) box.appendChild(el(`<div class="turn-note">${escapeHtml(d.turnMessage)}</div>`));
      return box;
    },

    renderHandoffGate(){
      const d = this.data;
      const player = d.players[d.activeIndex];
      const passCard = el(`<div class="pass-card"><div class="to-player">გადაეცი ტელეფონი: <strong>${escapeHtml(player.name)}</strong></div></div>`);
      const card = el(`<div class="flip-card">დააჭირე, რომ ნახო შენი ბარათები 🂠</div>`);
      card.addEventListener('click', () => { d.gateRevealedFor = d.activeIndex; App.render(); });
      passCard.appendChild(card);
      return passCard;
    },

    renderActivePanel(){
      const d = this.data;
      const box = el(`<div></div>`);
      const player = d.players[d.activeIndex];

      if (d.activeRole === 'attack'){
        box.appendChild(el(`<p style="text-align:center; color:var(--ink-soft); margin:0 0 4px;">${d.table.length===0 ? 'აირჩიე ბარათი შესატევად:' : 'აირჩიე დამატებითი ბარათი:'}</p>`));
        const ranksInPlay = this.ranksInPlay();
        const handRow = el(`<div class="hand-row"></div>`);
        const canAddMore = d.table.length < 6 && d.players[d.defenderIndex].hand.length > (d.table.filter(t=>!t.defend).length);
        player.hand.forEach(c => {
          const allowed = d.table.length === 0 || (canAddMore && ranksInPlay.has(c.rank));
          const btn = this.renderCard(c, { button:true, disabled: !allowed });
          if (allowed) btn.addEventListener('click', () => this.playAttackCard(c));
          handRow.appendChild(btn);
        });
        box.appendChild(handRow);
      } else if (d.activeRole === 'attack-continue'){
        box.appendChild(el(`<p style="text-align:center; color:var(--ink-soft); margin:0 0 4px;">დაცვა შესრულდა — გსურთ დამატება?</p>`));
        const ranksInPlay = this.ranksInPlay();
        const canAddMore = d.table.length < 6 && d.players[d.defenderIndex].hand.length > 0;
        const handRow = el(`<div class="hand-row"></div>`);
        player.hand.forEach(c => {
          const allowed = canAddMore && ranksInPlay.has(c.rank);
          const btn = this.renderCard(c, { button:true, disabled: !allowed });
          if (allowed) btn.addEventListener('click', () => this.playAttackCard(c));
          handRow.appendChild(btn);
        });
        box.appendChild(handRow);
        const endBtn = el(`<button class="btn" style="width:100%; margin-top:10px;">დასრულება (გადაგდება)</button>`);
        endBtn.addEventListener('click', () => this.endAttack());
        box.appendChild(endBtn);
      } else if (d.activeRole === 'defend'){
        const pending = d.table.find(t => t.defend === null);
        box.appendChild(el(`<div class="attack-target-row"><span class="label">დასაფარი ბარათი:</span></div>`));
        const targetRow = box.querySelector('.attack-target-row');
        targetRow.appendChild(this.renderCard(pending.attack));
        const handRow = el(`<div class="hand-row"></div>`);
        player.hand.forEach(c => {
          const allowed = this.cardBeats(c, pending.attack);
          const btn = this.renderCard(c, { button:true, disabled: !allowed });
          if (allowed) btn.addEventListener('click', () => this.playDefendCard(c));
          handRow.appendChild(btn);
        });
        box.appendChild(handRow);
        const takeBtn = el(`<button class="btn secondary" style="width:100%; margin-top:10px;">ბარათების აღება</button>`);
        takeBtn.addEventListener('click', () => this.takeCards());
        box.appendChild(takeBtn);
      }
      return box;
    },

    renderGame(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"></div>`);
      panel.appendChild(this.renderPublicBoard());
      if (d.gateRevealedFor !== d.activeIndex){
        panel.appendChild(this.renderHandoffGate());
      } else {
        panel.appendChild(this.renderActivePanel());
      }
      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- END SCREEN ----------------------- */
    renderEnd(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"></div>`);
      panel.appendChild(el(`
        <div class="winner-banner">
          <div class="crown">🃏</div>
          <h3>${d.loser ? escapeHtml(d.loser) + ' — დურაკი!' : 'თამაში დასრულდა'}</h3>
        </div>
      `));
      if (d.finishOrder.length){
        const ol = el(`<ol style="max-width:320px; margin:0 auto 14px; color:var(--ink-soft); font-size:0.92rem;"></ol>`);
        d.finishOrder.forEach(name => ol.appendChild(el(`<li>${escapeHtml(name)} — გაქცეულია</li>`)));
        panel.appendChild(ol);
      }
      const actions = el(`<div class="action-row">
        <button class="btn">იგივე მოთამაშეებით თავიდან</button>
        <button class="btn ghost">მთავარ გვერდზე</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        const names = d.players.map(p => p.name);
        this.init();
        this.data.players = names.slice();
        this.dealAndStart();
      });
      actions.children[1].addEventListener('click', () => App.goHome());
      panel.appendChild(actions);
      wrap.appendChild(panel);
      return wrap;
    }
  };

  /* ========================================================================
     GAME 5: იმპოსტორი (IMPOSTER) — 3+ players. Each round, almost everyone
     gets the same question; one secret imposter gets a similar-but-different
     one. Everyone answers out loud, the group discusses, then votes.
  ======================================================================== */
  const Imposter = {
    data: null,

    init(){
      this.data = {
        phase: 'setup',        // rules | setup | reveal | discuss | result | final
        previousPhase: 'setup',
        players: [],

    render(){

      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'reveal') return this.renderReveal();

    /* ----------------------- RULEBOOK ----------------------- */
    renderRules(){

          <li>ყველა, რიგრიგობით, ხმამაღლა პასუხობს საკუთარ კითხვას — ისე, თითქოს ყველას ერთი და იგივე ჰქონდეს.</li>
          <li>პასუხების მოსმენის შემდეგ ჯგუფი განიხილავს და ცდილობს გამოცნოს, ვის ეპასუხა "სხვანაირად".</li>
          <li>დააჭირეთ "გამოვლენას" — აპი გიჩვენებთ, ვინ იყო იმპოსტორი და ორივე კითხვას.</li>
        </ol>
      `));

      panel.appendChild(el(`<h3>ქულები</h3>`));
      panel.appendChild(el(`
        <ul>
          <li>თუ ჯგუფმა სწორად გამოიცნო იმპოსტორი — ყველა დანარჩენს ერგება 1 ქულა.</li>
          <li>თუ ვერ გამოიცნეს — იმპოსტორს ერგება 2 ქულა.</li>
        </ul>
      `));

      panel.appendChild(el(`<h3>რჩევები</h3>`));
      panel.appendChild(el(`
        <ul>
          <li>ნუ უპასუხებთ ზედმეტად ბუნდოვნად — თუ ეჭვს გაჩენთ, ადვილად გამოგამჟღავნებენ.</li>
          <li>იმპოსტორო, ყურადღებით უსმინე დანარჩენებს და სცადე მოირგო მათი პასუხების ტონი.</li>
          <li>3 მოთამაშეც საკმარისია, თუმცა 5+ მოთამაშით დისკუსია ბევრად საინტერესო ხდება.</li>

      panel.appendChild(backBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- SETUP ----------------------- */
    renderSetup(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>იმპოსტორი — მოთამაშეები</h2></div>`);

      const playerField = el(`
        <div class="field-row">
          <label>დაამატე მოთამაშეები (მინიმუმ 3)</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი..." maxlength="20">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const nameInput = playerField.querySelector('input');
      const startBtn = el(`<button class="btn" style="width:100%; margin-top:6px;">დაწყება</button>`);
      const warnMsg = el(`<p style="color:var(--rust); font-size:0.85rem; margin-top:8px;"></p>`);

      const updateValidity = () => {
        const n = d.players.length;
        const valid = n >= 3;
        startBtn.disabled = !valid;
        warnMsg.style.display = valid ? 'none' : 'block';
        if (!valid) warnMsg.textContent = 'მინიმუმ 3 მოთამაშეა საჭირო.';
      };
      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm" aria-label="წაშლა">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); updateValidity(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val) return;
        d.players.push(val);
        nameInput.value = '';
        renderPlayers(); updateValidity();
        nameInput.focus();
      };
      playerField.querySelector('.btn').addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPlayer(); } });
      panel.appendChild(playerField);

      const roundsField = el(`<div class="field-row"><label>რაუნდების რაოდენობა</label><div class="chip-group"></div></div>`);
      const roundsGroup = roundsField.querySelector('.chip-group');
      [3,5,7].forEach(r => {
        const chip = el(`<button type="button" class="chip ${d.totalRounds===r?'active':''}">${r}</button>`);
        chip.addEventListener('click', () => {
          d.totalRounds = r;
          roundsGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
        });
        roundsGroup.appendChild(chip);
      });
      panel.appendChild(roundsField);

      panel.appendChild(warnMsg);
      panel.appendChild(startBtn);

      startBtn.addEventListener('click', () => {
        if (startBtn.disabled) return;
        d.players.forEach(p => d.totals[p] = 0);
        this.startRound();
      });

      renderPlayers();
      updateValidity();

      wrap.appendChild(panel);
      return wrap;
    },

    pickQuestionPair(){
      const d = this.data;
      const available = QUESTION_PAIRS.map((q,i)=>i).filter(i => !d.usedQuestionIndices.includes(i));
      const pool = available.length ? available : QUESTION_PAIRS.map((q,i)=>i);
      if (!available.length) d.usedQuestionIndices = [];
      const idx = pickRandom(pool);
      d.usedQuestionIndices.push(idx);
      return QUESTION_PAIRS[idx];
    },

    startRound(){
      const d = this.data;
      d.currentRound += 1;
      d.currentPair = this.pickQuestionPair();
      d.imposterIndex = Math.floor(Math.random() * d.players.length);
      d.revealIndex = 0;
      d.revealShown = false;
      d.phase = 'reveal';
      App.render();
    },

    /* ----------------------- REVEAL (pass-and-play) ----------------------- */
    renderReveal(){
      const d = this.data;
      const wrap = this.topBar(false);
      const isImposter = d.revealIndex === d.imposterIndex;
      const question = isImposter ? d.currentPair.imposter : d.currentPair.original;
      const name = d.players[d.revealIndex];

      const panel = el(`<div class="panel"><h2>რაუნდი ${d.currentRound} / ${d.totalRounds} — კითხვის გაცნობა (${d.revealIndex+1} / ${d.players.length})</h2></div>`);
      const passCard = el(`<div class="pass-card"><div class="to-player">გადაეცი ტელეფონი: <strong>${escapeHtml(name)}</strong></div></div>`);
      const card = el(`
        <div class="flip-card ${d.revealShown ? 'revealed':''}">
          ${d.revealShown
            ? `<div class="role-name" style="font-size:1.1rem;">შენი კითხვაა:</div><div class="role-desc" style="font-size:1.05rem;">${escapeHtml(question)}</div>`
            : 'დააჭირე, რომ ნახო შენი კითხვა 🤫<br><span style="font-size:0.8rem; opacity:0.85;">(დარწმუნდი, სხვები არ უყურებენ)</span>'}
        </div>
      `);
      card.addEventListener('click', () => { if (!d.revealShown){ d.revealShown = true; App.render(); } });
      passCard.appendChild(card);

      const nextBtn = el(`
        <button class="btn" style="width:100%; margin-top:18px;" ${d.revealShown ? '' : 'disabled'}>
          ${d.revealIndex < d.players.length - 1 ? 'შემდეგი მოთამაშე' : 'ყველამ ნახა — დისკუსია'}
        </button>
      `);
      nextBtn.addEventListener('click', () => {
        if (!d.revealShown) return;
        if (d.revealIndex < d.players.length - 1){
          d.revealIndex += 1;
          d.revealShown = false;
          App.render();
        } else {
          d.phase = 'discuss';
          App.render();
        }
      });
      passCard.appendChild(nextBtn);
      panel.appendChild(passCard);
      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- DISCUSSION ----------------------- */
    renderDiscuss(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>რაუნდი ${d.currentRound} — დისკუსია</h2></div>`);
      panel.appendChild(el(`
        <div class="narration-box">ყველამ, რიგრიგობით, ხმამაღლა უპასუხეთ საკუთარ კითხვას.<br>შემდეგ განიხილეთ და გამოიცანით, ვინ იყო იმპოსტორი.</div>
      `));
      const revealBtn = el(`<button class="btn" style="width:100%;">გამოვლენა</button>`);
      revealBtn.addEventListener('click', () => { d.phase = 'result'; App.render(); });
      panel.appendChild(revealBtn);
      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- RESULT / SCORING ----------------------- */
    renderResult(){
      const d = this.data;
      const wrap = this.topBar(true);
      const imposterName = d.players[d.imposterIndex];
      const panel = el(`<div class="panel"><h2>რაუნდი ${d.currentRound} — შედეგი</h2></div>`);

      panel.appendChild(el(`
        <div class="winner-banner" style="padding:6px 0 14px;">
          <div class="crown">🎭</div>
          <h3>იმპოსტორი იყო: ${escapeHtml(imposterName)}</h3>
        </div>
      `));

      const qBox = el(`<div style="background:var(--surface); border:1.5px solid var(--paper-line); border-radius:10px; padding:14px 16px; margin-bottom:16px;"></div>`);
      qBox.appendChild(el(`<p style="margin:0 0 8px;"><strong>ორიგინალი კითხვა:</strong> ${escapeHtml(d.currentPair.original)}</p>`));
      qBox.appendChild(el(`<p style="margin:0;"><strong>იმპოსტორის კითხვა:</strong> ${escapeHtml(d.currentPair.imposter)}</p>`));
      panel.appendChild(qBox);

      panel.appendChild(el(`<p style="text-align:center; color:var(--ink-soft); font-size:0.92rem;">ჯგუფმა სწორად გამოიცნო იმპოსტორი?</p>`));
      const btnRow = el(`<div class="action-row" style="justify-content:center;"></div>`);
      const yesBtn = el(`<button class="btn">კი, გამოიცნეს</button>`);
      const noBtn = el(`<button class="btn secondary">არა, ვერ გამოიცნეს</button>`);
      const applyAndContinue = (guessedCorrectly) => {
        d.players.forEach((p, i) => {
          if (guessedCorrectly){ if (i !== d.imposterIndex) d.totals[p] += 1; }
          else { if (i === d.imposterIndex) d.totals[p] += 2; }
        });
        if (d.currentRound < d.totalRounds) this.startRound();
        else { d.phase = 'final'; App.render(); }
      };
      yesBtn.addEventListener('click', () => applyAndContinue(true));
      noBtn.addEventListener('click', () => applyAndContinue(false));
      btnRow.appendChild(yesBtn);
      btnRow.appendChild(noBtn);
      panel.appendChild(btnRow);

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- FINAL ----------------------- */
    renderFinal(){
      const d = this.data;
      const players = d.players.map(p => ({ name:p, score: d.totals[p] || 0 }));
      const sorted = players.slice().sort((a,b)=>b.score-a.score);
      const winner = sorted[0];
      const wrap = this.topBar(true);
      const panel = el(`
        <div class="panel">
          <h2>თამაში დასრულდა</h2>
          <div class="final-winner">
            <div class="crown">🏆</div>
            <h3>${winner ? escapeHtml(winner.name) : '—'}</h3>
            <div style="color:var(--ink-soft)">გაიმარჯვა ${winner ? winner.score : 0} ქულით</div>
          </div>
        </div>
      `);
      panel.appendChild(el(`<div>${renderScoreboardList(players)}</div>`));
      const actions = el(`<div class="action-row">
        <button class="btn">თავიდან იგივე მოთამაშეებით</button>
        <button class="btn ghost">მთავარ გვერდზე</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        const names = d.players.slice();
        const rounds = d.totalRounds;
        this.init();
        this.data.players = names;
        this.data.totalRounds = rounds;
        names.forEach(p => this.data.totals[p] = 0);
        this.startRound();
      });
      actions.children[1].addEventListener('click', () => App.goHome());
      panel.appendChild(actions);
      wrap.appendChild(panel);
      return wrap;
    }
  };

  const Battleship = {
