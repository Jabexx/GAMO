<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>გამო</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@500;600;700&family=Noto+Sans+Georgian:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===================== DESIGN TOKENS ===================== */
  :root{
    --paper: #EAE0CB;        /* aged parchment table surface */
    --paper-card: #F3ECDD;   /* lighter card paper */
    --paper-line: #D8C9A8;   /* faint rule lines on paper */
    --ink: #2B2420;          /* main text, warm charcoal */
    --ink-soft: #55493D;     /* secondary text */
    --wine: #6E2A2A;         /* primary accent - marani wine red (backgrounds/buttons) */
    --wine-dark: #501E1E;    /* hover/active */
    --accent: #6E2A2A;       /* wine used AS TEXT on the page background — swaps to a brighter red in dark mode so it stays legible */
    --brass: #A9803F;        /* brass accent - borders, pins */
    --brass-light: #C9A46B;
    --brass-text: #7A5A22;   /* darker brass for small text on light chips */
    --sage: #5E6E4F;         /* success / unique answers */
    --rust: #A34A28;         /* warnings / wrong guesses */
    --cream: #EFE3C4;        /* khinkali dough */
    --surface: #ffffff;      /* raised surface: inputs, chips, tiles */

    --font-display: 'Noto Serif Georgian', serif;
    --font-body: 'Noto Sans Georgian', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;

    --radius: 10px;
    --shadow-card: 0 6px 14px rgba(43,36,32,0.18);
    --shadow-card-hover: 0 12px 22px rgba(43,36,32,0.26);
  }

  /* Dark mode — toggled via [data-theme="dark"] on <html>. Because every
     component below is built entirely from these custom properties (no
     hardcoded colors), overriding the tokens here re-themes the whole app. */
  html[data-theme="dark"]{
    --paper: #1C1712;
    --paper-card: #29221B;
    --paper-line: #443724;
    --ink: #ECE1CC;
    --ink-soft: #B4A489;
    --wine: #6E2A2A;
    --wine-dark: #501E1E;
    --accent: #E08872;
    --brass: #CBA46C;
    --brass-light: #E4C793;
    --sage: #8FAA7C;
    --rust: #D6805F;
    --cream: #EFE3C4;
    --surface: #322922;
    --brass-text: #E4C793;
    --shadow-card: 0 6px 16px rgba(0,0,0,0.45);
    --shadow-card-hover: 0 12px 26px rgba(0,0,0,0.55);
  }
  html[data-theme="dark"] body{
    background:
      repeating-linear-gradient(135deg, rgba(236,225,204,0.012) 0px, rgba(236,225,204,0.012) 1px, transparent 1px, transparent 7px),
      radial-gradient(circle at 20% 10%, rgba(203,164,108,0.06), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(224,136,114,0.05), transparent 45%),
      var(--paper);
  }
  html[data-theme="dark"] .btn.secondary:hover{ background: rgba(224,136,114,0.12); }
  html[data-theme="dark"] .badge.unique{ background: rgba(143,170,124,0.22); }
  html[data-theme="dark"] .badge.dup{ background: rgba(203,164,108,0.22); }
  html[data-theme="dark"] .badge.invalid{ background: rgba(214,128,95,0.2); }
  html[data-theme="dark"] .stepper button:hover{ background: rgba(203,164,108,0.16); }
  html[data-theme="dark"] .bs-cell.clickable:hover{ background: rgba(203,164,108,0.12); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      repeating-linear-gradient(135deg, rgba(43,36,32,0.015) 0px, rgba(43,36,32,0.015) 1px, transparent 1px, transparent 7px),
      radial-gradient(circle at 20% 10%, rgba(169,128,63,0.07), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(110,42,42,0.06), transparent 45%),
      var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
  }

  #app{ max-width: 880px; margin: 0 auto; padding: 28px 18px 60px; min-height: 100vh; }

  header.app-header{ text-align:center; margin-bottom: 34px; position:relative; }
  header.app-header h1{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.1rem, 6vw, 2.9rem);
    color: var(--accent);
    margin: 0;
    letter-spacing: 0.5px;
  }
  .header-ornament{ display:block; margin: 12px auto 0; color: var(--brass); width: 180px; height: 14px; }

  .theme-toggle{
    position: fixed; top: 16px; right: 16px; z-index: 20;
    width: 40px; height: 40px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--surface); border: 1.5px solid var(--paper-line);
    color: var(--ink-soft); box-shadow: var(--shadow-card);
    transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .theme-toggle svg{ width: 19px; height: 19px; }
  .theme-toggle:hover{ border-color: var(--brass); color: var(--accent); transform: translateY(-1px); }
  .theme-toggle:active{ transform: translateY(0); }

  button{ font-family: inherit; cursor: pointer; }
  a{ color: var(--accent); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background: var(--wine); color: #F6EEDD; border: none;
    padding: 11px 20px; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .btn:hover{ background: var(--wine-dark); }
  .btn:active{ transform: translateY(1px); }
  .btn:focus-visible{ outline: 2px solid var(--brass); outline-offset: 2px; }
  .btn.secondary{
    background: transparent; color: var(--accent); border: 1.5px solid var(--accent);
  }
  .btn.secondary:hover{ background: rgba(110,42,42,0.08); }
  .btn.ghost{
    background: transparent; color: var(--ink-soft); border: 1.5px solid var(--paper-line);
  }
  .btn.ghost:hover{ border-color: var(--brass); color: var(--ink); }
  .btn:disabled{ opacity: 0.45; cursor: not-allowed; }

  /* ===================== HOME / GAME CARDS ===================== */
  .game-section{ margin-bottom: 34px; }
  .game-section:last-child{ margin-bottom: 0; }
  .section-heading{
    display:flex; align-items:center; gap:14px;
    font-family: var(--font-display); font-weight:600; font-size: 1.05rem;
    color: var(--ink-soft); margin: 0 0 16px; letter-spacing: 0.02em;
  }
  .section-heading::before, .section-heading::after{
    content:''; flex:1; height:1px; background: var(--paper-line);
  }
  .board{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 22px 18px;
    padding-top: 6px;
  }

  .game-card{
    position: relative;
    background: var(--paper-card);
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    box-shadow: var(--shadow-card);
    padding: 0;
    text-align:center;
    transform: rotate(var(--tilt, -1deg));
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .game-card:nth-child(odd){ --tilt: 1deg; }
  .game-card:nth-child(3n){ --tilt: -1.4deg; }
  .game-card.playable{ cursor:pointer; }
  .game-card.playable:hover, .game-card.playable:focus-visible{
    transform: rotate(0deg) translateY(-4px);
    box-shadow: var(--shadow-card-hover);
    outline: none;
  }
  .game-card.soon{ opacity: 0.55; }

  .game-card .pin{
    position:absolute; top: -7px; left: 50%; transform: translateX(-50%);
    width: 14px; height: 14px; border-radius: 50%; z-index: 3;
    background: radial-gradient(circle at 30% 30%, var(--brass-light), var(--brass) 70%);
    box-shadow: 0 2px 3px rgba(0,0,0,0.3);
  }
  .game-card-image{
    position: relative;
    width: 100%; height: 96px; display:flex; align-items:center; justify-content:center;
    border-radius: 9px 9px 0 0; overflow: hidden;
    background-size: cover; background-position: center;
  }
  .game-card-image .upload-badge, .game-card-image .remove-badge{
    position:absolute; z-index: 2; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,255,255,0.88); border: 1px solid rgba(0,0,0,0.08);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.18); color: var(--ink-soft);
    transition: transform 0.12s ease, background 0.12s ease;
  }
  .game-card-image .upload-badge{ right: 6px; bottom: 6px; }
  .game-card-image .remove-badge{ left: 6px; bottom: 6px; color: var(--rust); }
  .game-card-image .upload-badge:hover, .game-card-image .remove-badge:hover{
    background: var(--surface); transform: scale(1.08);
  }
  .game-card-image .upload-badge svg, .game-card-image .remove-badge svg{ width: 14px; height: 14px; }
  .game-card-body{ padding: 16px 16px 18px; }
  .game-card h3{
    font-family: var(--font-display); font-size: 1.15rem; margin: 0 0 6px; color: var(--ink);
  }
  .game-card .meta{
    font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .game-card .ribbon{
    position:absolute; top: 8px; right: -6px; z-index: 2;
    background: var(--rust); color:#fff; font-size: 0.68rem; font-weight:600;
    padding: 3px 10px; border-radius: 3px; font-family: var(--font-mono);
    letter-spacing: 0.04em;
  }

  /* ===================== PANELS / GENERIC ===================== */
  .panel{
    background: var(--paper-card); border: 1px solid var(--paper-line);
    border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-card);
  }
  .panel + .panel{ margin-top: 18px; }
  .panel h2{
    font-family: var(--font-display); color: var(--accent); margin-top:0;
    font-size: 1.4rem; border-bottom: 1px dashed var(--paper-line); padding-bottom: 10px;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:6px; margin-bottom: 16px;
    color: var(--ink-soft); font-size: 0.9rem; background:none; border:none; padding:0;
  }
  .back-link:hover{ color: var(--accent); }

  .field-row{ margin-bottom: 16px; }
  .field-row label{
    display:block; font-weight:600; font-size:0.88rem; margin-bottom:6px; color: var(--ink-soft);
  }
  .field-row input[type=text], .field-row input[type=number]{
    width:100%; padding:10px 12px; border:1.5px solid var(--paper-line); border-radius:7px;
    font-family: var(--font-body); font-size: 0.98rem; background:var(--surface); color: var(--ink);
  }
  .field-row input:focus-visible{ outline: 2px solid var(--brass); border-color: var(--brass); }

  .chip-group{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--paper-line);
    background:var(--surface); font-size:0.85rem; color: var(--ink-soft); font-weight:500;
  }
  .chip.active{ background: var(--wine); color:#fff; border-color: var(--wine); }
  .chip:focus-visible{ outline: 2px solid var(--brass); }

  .player-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .player-list li{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--paper-line); border-radius:7px; padding:8px 12px;
  }
  .player-list .rm{ background:none; border:none; color: var(--rust); font-size:1.1rem; line-height:1; }

  .inline-add{ display:flex; gap:8px; margin-top:10px; }
  .inline-add input{ flex:1; }

  .timer-badge{
    font-family: var(--font-mono); font-size: 1.6rem; font-weight:600; color: var(--accent);
    background: var(--surface); border: 2px solid var(--brass); border-radius: 8px;
    padding: 6px 16px; display:inline-block; min-width: 84px; text-align:center;
  }
  .timer-badge.low{ color: var(--rust); border-color: var(--rust); }

  .turn-banner{
    font-family: var(--font-display); font-size: 1.1rem; color: var(--accent);
    margin-bottom: 4px;
  }
  .letter-hero{
    font-family: var(--font-display); font-size: 3.2rem; font-weight:700; color: var(--accent);
    background: var(--surface); border: 2px solid var(--brass); border-radius: 12px;
    width: 84px; height: 84px; display:flex; align-items:center; justify-content:center;
    margin: 6px 0 18px;
  }

  .category-input-row{ margin-bottom: 12px; }
  .category-input-row label{
    font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase;
    color: var(--ink-soft); letter-spacing:0.05em; margin-bottom:4px; display:block;
  }

  table.review-table{ width:100%; border-collapse: collapse; font-size: 0.92rem; }
  table.review-table th{
    text-align:left; font-family: var(--font-mono); font-size:0.72rem; text-transform:uppercase;
    color: var(--ink-soft); padding: 6px 8px; border-bottom: 2px solid var(--paper-line);
  }
  table.review-table td{ padding: 8px; border-bottom: 1px solid var(--paper-line); vertical-align:middle; }
  .badge{
    display:inline-flex; align-items:center; gap:4px; font-size:0.78rem; font-weight:600;
    padding: 3px 10px; border-radius:20px; border:none; font-family: var(--font-mono);
  }
  .badge.unique{ background: rgba(94,110,79,0.18); color: var(--sage); }
  .badge.dup{ background: rgba(169,128,63,0.2); color: var(--brass-text); }
  .badge.invalid{ background: rgba(163,74,40,0.15); color: var(--rust); }

  .scoreboard{ list-style:none; margin:0; padding:0; }
  .scoreboard li{
    display:flex; justify-content:space-between; align-items:center;
    padding: 10px 4px; border-bottom: 1px solid var(--paper-line); font-size: 0.98rem;
  }
  .scoreboard li:last-child{ border-bottom:none; }
  .scoreboard li.leader{ font-weight:700; color: var(--accent); }
  .scoreboard .score{ font-family: var(--font-mono); font-weight:600; }

  .final-winner{
    text-align:center; padding: 20px 0;
  }
  .final-winner .crown{ font-size: 2.4rem; }
  .final-winner h3{ font-family: var(--font-display); color: var(--accent); font-size:1.6rem; margin: 4px 0; }

  .action-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top: 18px; }

  /* ===================== HANGMAN ===================== */
  .plate-wrap{ display:flex; flex-direction:column; align-items:center; margin-bottom: 10px; }
  .plate{
    width: 220px; height: 220px; border-radius:50%;
    background: radial-gradient(circle at 50% 45%, #fff 55%, var(--paper-line) 100%);
    border: 4px solid var(--brass);
    display:flex; align-items:center; justify-content:center; position:relative;
    margin-bottom: 8px;
  }
  .khinkali-grid{
    display:grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 160px;
  }
  .khinkali{ width: 34px; height: 34px; transition: opacity 0.3s ease, transform 0.3s ease; }
  .khinkali.eaten{ opacity: 0; transform: scale(0.3) rotate(20deg); }
  .lives-caption{ font-family: var(--font-mono); font-size: 0.85rem; color: var(--ink-soft); }

  .word-display{
    display:flex; flex-wrap:wrap; justify-content:center; gap: 8px; margin: 18px 0 22px;
  }
  .letter-tile{
    width: 38px; height: 46px; border-bottom: 3px solid var(--brass);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-size: 1.4rem; font-weight:700; color: var(--ink);
  }

  .keyboard{
    display:grid; grid-template-columns: repeat(8, 1fr); gap: 7px; max-width: 480px; margin: 0 auto;
  }
  .key{
    aspect-ratio: 1; border-radius: 6px; border: 1.5px solid var(--paper-line);
    background: var(--surface); font-family: var(--font-body); font-size: 1.05rem; font-weight:600;
    color: var(--ink); display:flex; align-items:center; justify-content:center;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .key:hover:not(:disabled){ border-color: var(--brass); }
  .key:focus-visible{ outline: 2px solid var(--brass); }
  .key.correct{ background: var(--sage); color:#fff; border-color: var(--sage); }
  .key.wrong{ background: var(--rust); color:#fff; border-color: var(--rust); }
  .key:disabled{ cursor: default; }

  .status-msg{ text-align:center; font-family: var(--font-display); font-size:1.3rem; margin: 14px 0; }
  .status-msg.win{ color: var(--sage); }
  .status-msg.lose{ color: var(--rust); }

  @media (max-width: 480px){
    .keyboard{ grid-template-columns: repeat(6, 1fr); }
    .plate{ width: 190px; height: 190px; }
  }

  /* ===================== MAFIA ===================== */
  .top-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .rules-link{
    background:none; border:none; color: var(--accent); font-size:0.88rem; font-weight:600;
    display:inline-flex; align-items:center; gap:5px; padding:0;
  }
  .rules-link:hover{ text-decoration: underline; }

  .stepper{ display:inline-flex; align-items:center; gap:12px; background:var(--surface); border:1.5px solid var(--paper-line); border-radius:8px; padding:6px 10px; }
  .stepper button{
    width:30px; height:30px; border-radius:50%; border:1.5px solid var(--brass); background:var(--surface);
    color: var(--accent); font-size:1.1rem; font-weight:700; line-height:1;
  }
  .stepper button:hover{ background: rgba(169,128,63,0.12); }
  .stepper button:disabled{ opacity:0.35; cursor:not-allowed; }
  .stepper .val{ font-family: var(--font-mono); font-size:1.15rem; font-weight:700; min-width: 20px; text-align:center; }

  .role-summary{ display:flex; flex-wrap:wrap; gap:10px; margin: 4px 0 18px; }
  .role-tag{
    font-family: var(--font-mono); font-size:0.78rem; padding:5px 12px; border-radius:20px;
    background:var(--surface); border:1.5px solid var(--paper-line); color: var(--ink-soft);
  }
  .role-tag.warn{ border-color: var(--rust); color: var(--rust); }

  .pass-card{ text-align:center; padding: 10px 0 4px; }
  .pass-card .to-player{ font-family: var(--font-display); font-size:1.3rem; color: var(--accent); margin-bottom:16px; }
  .flip-card{
    width: 100%; max-width: 280px; margin: 0 auto; min-height: 190px; border-radius: 14px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background: var(--wine); color:#F6EEDD; box-shadow: var(--shadow-card);
    font-family: var(--font-display); font-size:1.15rem; padding: 20px; text-align:center;
    border: 2px solid var(--brass);
  }
  .flip-card.revealed{ cursor:default; flex-direction:column; gap:8px; }
  .flip-card .role-name{ font-size:1.7rem; font-weight:700; }
  .flip-card .role-desc{ font-size:0.92rem; font-weight:400; color:#F6EEDD; opacity:0.92; }
  .flip-card.role-mafia{ background: var(--wine); border-color:#3a1414; }
  .flip-card.role-doctor{ background: var(--sage); border-color:#3d4a33; }
  .flip-card.role-detective{ background: var(--brass); border-color:#7a5a22; color:#2B2420; }
  .flip-card.role-detective .role-desc{ color:#3a2c12; }
  .flip-card.role-citizen{ background: var(--ink-soft); border-color:#241d16; }

  .narration-box{
    background:var(--surface); border:1.5px dashed var(--paper-line); border-radius:10px;
    padding: 22px; text-align:center; font-family: var(--font-display); font-size:1.15rem;
    color: var(--ink); margin-bottom: 18px; min-height: 84px; display:flex; align-items:center; justify-content:center;
  }
  .phase-banner{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family: var(--font-mono); text-transform:uppercase; letter-spacing:0.06em;
    font-size:0.8rem; color: var(--ink-soft); margin-bottom: 10px;
  }
  .phase-banner .dot{ width:8px; height:8px; border-radius:50%; background: var(--brass); }
  .phase-banner.night .dot{ background: var(--wine); }

  .pick-list{ display:flex; flex-direction:column; gap:8px; margin: 14px 0; }
  .pick-option{
    display:flex; justify-content:space-between; align-items:center; width:100%;
    background:var(--surface); border:1.5px solid var(--paper-line); border-radius:8px; padding:10px 14px;
    font-size:0.98rem; color: var(--ink); text-align:left;
  }
  .pick-option:hover{ border-color: var(--brass); }
  .pick-option.none-option{ color: var(--ink-soft); font-style: italic; }

  .roster{ margin-top: 20px; }
  .roster h4{ font-family: var(--font-mono); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color: var(--ink-soft); margin: 0 0 8px; }
  .roster-list{ list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:8px; }
  .roster-list li{
    font-size:0.85rem; padding: 5px 12px; border-radius:20px; background:var(--surface);
    border:1.5px solid var(--paper-line); color: var(--ink);
  }
  .roster-list li.eliminated{ background: var(--paper); color: var(--ink-soft); text-decoration: line-through; border-style:dashed; }
  .roster-list li .r-tag{ font-family: var(--font-mono); font-size:0.7rem; margin-left:5px; opacity:0.75; }

  .winner-banner{ text-align:center; padding: 8px 0 4px; }
  .winner-banner .crown{ font-size:2.2rem; }
  .winner-banner h3{ font-family: var(--font-display); font-size:1.6rem; margin:4px 0; color: var(--accent); }

  .rulebook h3{ font-family: var(--font-display); color: var(--accent); font-size:1.1rem; margin: 20px 0 8px; }
  .rulebook h3:first-child{ margin-top: 4px; }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }

  /* ----------------------- SHARED: TIMER MODULE -----------------------
     createTimer(seconds, { onTick, onComplete }) -> { start, pause, reset, isRunning }
  ------------------------------------------------------------------- */
  function createTimer(seconds, callbacks){
    let remaining = seconds;
    let handle = null;
    const cb = callbacks || {};
    function tick(){
      remaining -= 1;
      if (cb.onTick) cb.onTick(remaining);
      if (remaining <= 0){
        stop();
        if (cb.onComplete) cb.onComplete();
      }
    }
    function start(){
      if (handle) return;
      handle = setInterval(tick, 1000);
    }
    function stop(){
      if (handle){ clearInterval(handle); handle = null; }
    }
    function reset(newSeconds){
      stop();
      remaining = (typeof newSeconds === 'number') ? newSeconds : seconds;
      if (cb.onTick) cb.onTick(remaining);
    }
    return {
      start, pause: stop, reset,
      isRunning: () => handle !== null,
      getRemaining: () => remaining
    };
  }

        <span class="score">${p.score}</span>
      </li>`).join('')}</ul>`;
  }

      this.state = { view: 'home' };
      this.render();
    },

    render(){
      const app = document.getElementById('app');
      app.innerHTML = '';
      app.appendChild(this.buildHeader());
      let content;
      switch(this.state.view){
        case 'categories': content = Categories.render(); break;
        case 'hangman': content = Hangman.render(); break;
        case 'mafia': content = Mafia.render(); break;
        case 'durak': content = Durak.render(); break;
        case 'imposter': content = Imposter.render(); break;
        case 'battleship': content = Battleship.render(); break;
        case 'associations': content = Associations.render(); break;
        case 'sitkvobana': content = Sitkvobana.render(); break;
        case 'joker': content = Joker.render(); break;
        case 'belote': content = Belote.render(); break;
        default: content = this.buildHome();
      }
      app.appendChild(content);
    },

    buildHeader(){
      const header = el(`
        <header class="app-header">
          <h1>გამო</h1>
          <svg class="header-ornament" viewBox="0 0 180 14" xmlns="http://www.w3.org/2000/svg" fill="none">
            <line x1="0" y1="7" x2="72" y2="7" stroke="currentColor" stroke-width="1.2"/>
            <path d="M90 1l5 6-5 6-5-6z" fill="currentColor"/>
            <line x1="108" y1="7" x2="180" y2="7" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </header>
      `);

      if (!this.themeToggleBtn){
        this.themeToggleBtn = document.createElement('button');
        this.themeToggleBtn.type = 'button';
        this.themeToggleBtn.className = 'theme-toggle';
        this.themeToggleBtn.addEventListener('click', () => this.toggleTheme());
        document.body.appendChild(this.themeToggleBtn);
      }
      const SUN_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>`;
      const MOON_SVG = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>`;
      const isDark = this.currentTheme === 'dark';
      this.themeToggleBtn.innerHTML = isDark ? SUN_SVG : MOON_SVG;
      this.themeToggleBtn.title = isDark ? 'ღია რეჟიმი' : 'მუქი რეჟიმი';
      this.themeToggleBtn.setAttribute('aria-label', isDark ? 'ღია რეჟიმზე გადართვა' : 'მუქ რეჟიმზე გადართვა');

      return header;
    },

    /* Theme persists across sessions via localStorage; falls back to the
       browser's prefers-color-scheme when nothing has been chosen yet. */
    loadTheme(){
      let theme = null;
      try { theme = localStorage.getItem('georgianGames_theme'); } catch(e){ /* storage unavailable */ }
      if (theme !== 'dark' && theme !== 'light'){
        theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      this.currentTheme = theme;
      if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    },
    toggleTheme(){
      this.currentTheme = (this.currentTheme === 'dark') ? 'light' : 'dark';
      if (this.currentTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.removeAttribute('data-theme');
      try { localStorage.setItem('georgianGames_theme', this.currentTheme); } catch(e){ /* storage unavailable */ }
      this.render();
    },

    buildHome(){
      if (!this.fileInput){
        this.fileInput = document.createElement('input');
        this.fileInput.type = 'file';
        this.fileInput.accept = 'image/*';
        this.fileInput.style.display = 'none';
        this.fileInput.addEventListener('change', () => {
          const file = this.fileInput.files && this.fileInput.files[0];
          const gameId = this.pendingUploadId;
          this.fileInput.value = ''; // allow re-selecting the same file later
          if (!file || !gameId) return;
          const reader = new FileReader();
          reader.onload = () => {
            this.customImages[gameId] = reader.result;
            this.pendingUploadId = null;
            this.saveCustomImages();
            this.render();
          };
          reader.readAsDataURL(file);
        });
        document.body.appendChild(this.fileInput);
      }

      const wrap = el(`<div></div>`);
      const CAMERA_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.5"/></svg>`;
      const X_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;

      CATEGORY_ORDER.forEach(catKey => {
        const gamesInCat = GAMES.filter(g => g.category === catKey);
        if (!gamesInCat.length) return;

        const section = el(`
          <section class="game-section">
            <h2 class="section-heading"><span>${CATEGORY_LABELS[catKey]}</span></h2>
            <div class="board"></div>
          </section>
        `);
        const board = section.querySelector('.board');

        gamesInCat.forEach((g) => {
          const customSrc = this.customImages[g.id];
          const bgStyle = customSrc
            ? `background-image:url('${customSrc}')`
            : `background-color:${g.color}`;
          const card = el(`
            <div class="game-card ${g.playable ? 'playable' : 'soon'}" tabindex="${g.playable ? '0' : '-1'}">
              <span class="pin"></span>
              ${!g.playable ? '<span class="ribbon">მალე</span>' : ''}
              <div class="game-card-image" style="${bgStyle}">
                <button type="button" class="upload-badge" title="შენი სურათის ატვირთვა">${CAMERA_SVG}</button>
                ${customSrc ? `<button type="button" class="remove-badge" title="სურათის მოცილება">${X_SVG}</button>` : ''}
              </div>
              <div class="game-card-body">
                <h3>${g.title}</h3>
                <div class="meta">${g.meta}</div>
              </div>
            </div>
          `);

          // Upload / remove badges must not trigger the card's own open-game click.
          const uploadBtn = card.querySelector('.upload-badge');
          uploadBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            this.pendingUploadId = g.id;
            this.fileInput.click();
          });
          const removeBtn = card.querySelector('.remove-badge');
          if (removeBtn){
            removeBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              delete this.customImages[g.id];
              this.saveCustomImages();
              this.render();
            });
          }

          if (g.playable){
            card.addEventListener('click', () => this.openGame(g.id));
            card.addEventListener('keydown', (e) => { if (e.key==='Enter' || e.key===' ') { e.preventDefault(); this.openGame(g.id); } });
          }
          board.appendChild(card);
        });

        wrap.appendChild(section);
      });

      return wrap;
    },

    openGame(id){
      if (id === 'categories'){ Categories.init(); this.state.view = 'categories'; }
      else if (id === 'hangman'){ Hangman.init(); this.state.view = 'hangman'; }
      else if (id === 'mafia'){ Mafia.init(); this.state.view = 'mafia'; }
      else if (id === 'durak'){ Durak.init(); this.state.view = 'durak'; }
      else if (id === 'imposter'){ Imposter.init(); this.state.view = 'imposter'; }
      else if (id === 'battleship'){ Battleship.init(); this.state.view = 'battleship'; }
      else if (id === 'associations'){ Associations.init(); this.state.view = 'associations'; }
      else if (id === 'sitkvobana'){ Sitkvobana.init(); this.state.view = 'sitkvobana'; }
      else if (id === 'joker'){ Joker.init(); this.state.view = 'joker'; }
      else if (id === 'belote'){ Belote.init(); this.state.view = 'belote'; }
      this.render();
    }
  };
  window.App = App;

  /* ========================================================================
     GAME 1: ქალაქობანა (CATEGORIES)
  ======================================================================== */
  const Categories = {
    data: null,

    init(){
      this.data = {
        phase: 'setup',           // setup | play | review | final
        mode: 'digital',          // digital (type answers in-app) | paper (play on paper, score manually)
        players: [],
        selectedCategoryIds: DEFAULT_CATEGORY_IDS.slice(),
        customCategories: [],
        timerSeconds: 45,
        totalRounds: 3,
        currentRound: 0,
        usedLetters: [],
        currentLetter: null,
        currentPlayerIndex: 0,
        roundAnswers: {},          // { playerName: { catId: answer } }
        totals: {},                // { playerName: score }
        timer: null
      };
    },

    activeCategories(){
      const fromPool = CATEGORY_POOL.filter(c => this.data.selectedCategoryIds.includes(c.id));
      const custom = this.data.customCategories.map(label => ({ id: 'custom_'+label, label }));
      return fromPool.concat(custom);
    },

    render(){
      const d = this.data;
      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'play') return d.mode === 'paper' ? this.renderPaperPlay() : this.renderDigitalPlay();
      if (d.phase === 'review') return d.mode === 'paper' ? this.renderPaperReview() : this.renderReview();
      return this.renderFinal();
    },

    renderSetup(){
      const d = this.data;
      const wrap = el(`<div></div>`);
      wrap.appendChild(el(`<button class="back-link">← მთავარ გვერდზე</button>`));
      wrap.querySelector('.back-link').addEventListener('click', () => App.goHome());

      const panel = el(`<div class="panel"><h2>ქალაქობანა — მოთამაშეები</h2></div>`);

      // Mode selector: digital (type answers in-app) vs paper (write on paper, score manually)
      const modeField = el(`
        <div class="field-row">
          <label>რეჟიმი</label>
          <div class="chip-group mode-opts"></div>
          <p class="mode-hint" style="color:var(--ink-soft); font-size:0.85rem; margin: 8px 0 0;"></p>
        </div>
      `);
      const modeGroup = modeField.querySelector('.mode-opts');
      const modeHint = modeField.querySelector('.mode-hint');
      const modeHints = {
        digital: 'ყველა თავის ტელეფონზე/მოწყობილობაზე წერს პასუხებს, აპი თავად ადარებს და აწერს ქულებს.',
        paper: 'თამაშობთ ქაღალდზე კალმით — აპი მხოლოდ ასოს და დროს გამოგიტანთ, ქულებს კი ბოლოს ხელით შეიყვანთ.'
      };
      const setMode = (m) => {
        d.mode = m;
        modeGroup.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.mode === m));
        modeHint.textContent = modeHints[m];
      };
      [['digital','ონლაინ (აკრეფა)'], ['paper','ქაღალდზე (ხელით ქულები)']].forEach(([m,label]) => {
        const chip = el(`<button type="button" class="chip" data-mode="${m}">${label}</button>`);
        chip.addEventListener('click', () => setMode(m));
        modeGroup.appendChild(chip);
      });
      setMode(d.mode);
      panel.appendChild(modeField);

      // Players
      const playerField = el(`
        <div class="field-row">
          <label>დაამატე მოთამაშეები</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი..." maxlength="20">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const nameInput = playerField.querySelector('input');
      const addBtn = playerField.querySelector('.btn');

      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm" aria-label="წაშლა">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val) return;
        d.players.push(val);
        nameInput.value = '';
        renderPlayers();
        nameInput.focus();
      };
      addBtn.addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPlayer(); } });
      renderPlayers();
      panel.appendChild(playerField);

      // Categories
      const catField = el(`
        <div class="field-row">
          <label>კატეგორიები</label>
          <div class="chip-group"></div>
          <div class="inline-add">
            <input type="text" placeholder="დაამატე საკუთარი კატეგორია...">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const chipGroup = catField.querySelector('.chip-group');
      const renderChips = () => {
        chipGroup.innerHTML = '';
        CATEGORY_POOL.forEach(c => {
          const active = d.selectedCategoryIds.includes(c.id);
          const chip = el(`<button type="button" class="chip ${active?'active':''}">${c.label}</button>`);
          chip.addEventListener('click', () => {
            if (d.selectedCategoryIds.includes(c.id)) d.selectedCategoryIds = d.selectedCategoryIds.filter(x=>x!==c.id);
            else d.selectedCategoryIds.push(c.id);
            renderChips();
          });
          chipGroup.appendChild(chip);
        });
        d.customCategories.forEach((label, i) => {
          const chip = el(`<button type="button" class="chip active">${escapeHtml(label)} ✕</button>`);
          chip.addEventListener('click', () => { d.customCategories.splice(i,1); renderChips(); });
          chipGroup.appendChild(chip);
        });
      };
      renderChips();
      const customInput = catField.querySelector('input');
      const customAddBtn = catField.querySelector('.btn');
      const addCustom = () => {
        const val = customInput.value.trim();
        if (!val) return;
        d.customCategories.push(val);
        customInput.value = '';
        renderChips();
      };
      customAddBtn.addEventListener('click', addCustom);
      customInput.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); addCustom(); } });
      panel.appendChild(catField);

      // Timer + Rounds
      const optsField = el(`
        <div class="field-row">
          <label>დრო თითო რაუნდზე (წამი)</label>
          <div class="chip-group timer-opts"></div>
        </div>
      `);
      const timerGroup = optsField.querySelector('.timer-opts');
      [30,45,60,90].forEach(sec => {
        const chip = el(`<button type="button" class="chip ${d.timerSeconds===sec?'active':''}">${sec}</button>`);
        chip.addEventListener('click', () => {
          d.timerSeconds = sec;
          timerGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
        });
        timerGroup.appendChild(chip);
      });
      panel.appendChild(optsField);

      const roundsField = el(`
        <div class="field-row">
          <label>რაუნდების რაოდენობა</label>
          <div class="chip-group rounds-opts"></div>
        </div>
      `);
      const roundsGroup = roundsField.querySelector('.rounds-opts');
      [3,5,7].forEach(r => {
        const chip = el(`<button type="button" class="chip ${d.totalRounds===r?'active':''}">${r}</button>`);
        chip.addEventListener('click', () => {
          d.totalRounds = r;
          roundsGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
        });
        roundsGroup.appendChild(chip);
      });
      panel.appendChild(roundsField);

      const startBtn = el(`<button class="btn" style="width:100%; margin-top:8px;">დაწყება</button>`);
      startBtn.addEventListener('click', () => {
        if (d.players.length < 1){ nameInput.focus(); return; }
        if (this.activeCategories().length < 1) return;
        d.players.forEach(p => d.totals[p] = 0);
        this.startRound();
      });
      panel.appendChild(startBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    startRound(){
      const d = this.data;
      d.currentRound += 1;
      d.currentPlayerIndex = 0;
      d.roundAnswers = {};
      const available = GEO_ALPHABET.filter(l => !d.usedLetters.includes(l));
      const pool = available.length ? available : GEO_ALPHABET;
      d.currentLetter = pickRandom(pool);
      d.usedLetters.push(d.currentLetter);
      d.phase = 'play';
      App.render();
    },

    startPlayerTurn(){
      const d = this.data;
      const cats = this.activeCategories();
      d.roundAnswers[d.players[d.currentPlayerIndex]] = {};
      cats.forEach(c => d.roundAnswers[d.players[d.currentPlayerIndex]][c.id] = '');
    },

    renderDigitalPlay(){
      const d = this.data;
      const wrap = el(`<div></div>`);
      const cats = this.activeCategories();
      const playerName = d.players[d.currentPlayerIndex];
      if (!d.roundAnswers[playerName]) this.startPlayerTurn();

      const panel = el(`
        <div class="panel">
          <div class="turn-banner">რაუნდი ${d.currentRound} / ${d.totalRounds} — თამაშობს: <strong>${escapeHtml(playerName)}</strong></div>
          <div class="letter-hero">${d.currentLetter}</div>
        </div>
      `);

      const timerBadge = el(`<div class="timer-badge">${d.timerSeconds}</div>`);
      panel.querySelector('.letter-hero').insertAdjacentElement('afterend', timerBadge);

      const form = el(`<div class="cat-form"></div>`);
      const inputs = {};
      cats.forEach(c => {
        const row = el(`
          <div class="category-input-row">
            <label>${escapeHtml(c.label)}</label>
            <input type="text" data-cat="${c.id}" autocomplete="off">
          </div>
        `);
        const input = row.querySelector('input');
        input.addEventListener('input', () => { d.roundAnswers[playerName][c.id] = input.value; });
        inputs[c.id] = input;
        form.appendChild(row);
      });
      panel.appendChild(form);

      const finishBtn = el(`<button class="btn" style="width:100%; margin-top:6px;">დასრულება</button>`);
      const advance = () => {
        d.timer && d.timer.pause();
        if (d.currentPlayerIndex < d.players.length - 1){
          d.currentPlayerIndex += 1;
          App.render();
        } else {
          d.phase = 'review';
          App.render();
        }
      };
      finishBtn.addEventListener('click', advance);
      panel.appendChild(finishBtn);

      wrap.appendChild(panel);

      // timer setup
      d.timer = createTimer(d.timerSeconds, {
        onTick: (rem) => {
          timerBadge.textContent = rem;
          timerBadge.classList.toggle('low', rem <= 10);
        },
        onComplete: advance
      });
      d.timer.start();

      // focus first input
      setTimeout(() => { const first = Object.values(inputs)[0]; if (first) first.focus(); }, 30);

      return wrap;
    },

    renderPaperPlay(){
      const d = this.data;
      const cats = this.activeCategories();
      const wrap = el(`<div></div>`);
      const panel = el(`
        <div class="panel">
          <div class="turn-banner">რაუნდი ${d.currentRound} / ${d.totalRounds} — თამაშობთ ქაღალდზე</div>
          <div class="letter-hero">${d.currentLetter}</div>
        </div>
      `);

      const timerBadge = el(`<div class="timer-badge">${d.timerSeconds}</div>`);
      panel.querySelector('.letter-hero').insertAdjacentElement('afterend', timerBadge);

      const timerControls = el(`
        <div class="action-row" style="margin-top:10px;">
          <button class="btn secondary" data-act="start">დაწყება</button>
          <button class="btn ghost" data-act="pause">პაუზა</button>
          <button class="btn ghost" data-act="reset">თავიდან</button>
        </div>
      `);
      panel.appendChild(timerControls);

      const catList = el(`<div class="field-row" style="margin-top:16px;"><label>დაწერეთ ქაღალდზე ამ ასოზე:</label><div class="chip-group"></div></div>`);
      const chipGroup = catList.querySelector('.chip-group');
      cats.forEach(c => chipGroup.appendChild(el(`<span class="chip active" style="cursor:default;">${escapeHtml(c.label)}</span>`)));
      panel.appendChild(catList);

      const finishBtn = el(`<button class="btn" style="width:100%; margin-top:18px;">ქულების შეყვანა</button>`);
      finishBtn.addEventListener('click', () => {
        d.timer && d.timer.pause();
        d.phase = 'review';
        App.render();
      });
      panel.appendChild(finishBtn);
      wrap.appendChild(panel);

      d.timer = createTimer(d.timerSeconds, {
        onTick: (rem) => {
          timerBadge.textContent = Math.max(rem, 0);
          timerBadge.classList.toggle('low', rem <= 10);
        },
        onComplete: () => { timerBadge.textContent = '0'; }
      });
      timerControls.querySelector('[data-act="start"]').addEventListener('click', () => d.timer.start());
      timerControls.querySelector('[data-act="pause"]').addEventListener('click', () => d.timer.pause());
      timerControls.querySelector('[data-act="reset"]').addEventListener('click', () => d.timer.reset(d.timerSeconds));

      return wrap;
    },

    computeRoundScores(){
      const d = this.data;
      const cats = this.activeCategories();
      const letter = d.currentLetter;
      const result = {}; // { catId: { playerName: {answer, status, points} } }
      cats.forEach(c => {
        const answersByPlayer = {};
        d.players.forEach(p => {
          const raw = (d.roundAnswers[p] && d.roundAnswers[p][c.id]) || '';
          answersByPlayer[p] = raw.trim();
        });
        const normalized = {};
        d.players.forEach(p => { normalized[p] = answersByPlayer[p].toLowerCase(); });
        const counts = {};
        d.players.forEach(p => {
          const v = normalized[p];
          if (!v) return;
          counts[v] = (counts[v] || 0) + 1;
        });
        result[c.id] = {};
        d.players.forEach(p => {
          const answer = answersByPlayer[p];
          const startsRight = answer && answer[0] && answer[0].toLowerCase() === letter.toLowerCase();
          let status, points;
          if (!answer){ status = 'invalid'; points = 0; }
          else if (!startsRight){ status = 'invalid'; points = 0; }
          else if (counts[normalized[p]] > 1){ status = 'dup'; points = 5; }
          else { status = 'unique'; points = 10; }
          result[c.id][p] = { answer, status, points };
        });
      });
      return result;
    },

    renderReview(){
      const d = this.data;
      if (!d.roundResult) d.roundResult = this.computeRoundScores();
      const cats = this.activeCategories();
      const wrap = el(`<div></div>`);
      const panel = el(`
        <div class="panel">
          <h2>რაუნდი ${d.currentRound} — შედეგები (ასო: ${d.currentLetter})</h2>

    computePaperRoundScores(){

  /* ========================================================================
     GAME 2: ჯალათი (HANGMAN) — reskinned as a plate of khinkali
  ======================================================================== */
  const Hangman = {
    data: null,
    MAX_WRONG: 8,

    init(){
      this.data = {
        phase: 'setup',      // setup | play | end
        bank: 'city',
        word: null,
        guessed: [],         // letters guessed
        wrong: 0,
        players: [],
        scores: {},
        turnIndex: 0,
        result: null         // 'win' | 'lose'
      };
    },

    render(){
      const d = this.data;
      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'end') return this.renderEnd();
      return this.renderPlay();
    },

    renderSetup(){
      const d = this.data;
      const wrap = el(`<div></div>`);
      wrap.appendChild(el(`<button class="back-link">← მთავარ გვერდზე</button>`));
      wrap.querySelector('.back-link').addEventListener('click', () => App.goHome());

      const panel = el(`<div class="panel"><h2>ჯალათი — მზადება</h2></div>`);

      // category
      const bankField = el(`<div class="field-row"><label>სიტყვების კატეგორია</label><div class="chip-group"></div></div>`);
      const bankGroup = bankField.querySelector('.chip-group');
      Object.keys(WORD_BANK_LABELS).forEach(key => {
        const chip = el(`<button type="button" class="chip ${d.bank===key?'active':''}">${WORD_BANK_LABELS[key]}</button>`);
        chip.addEventListener('click', () => {
          d.bank = key;
          bankGroup.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
          chip.classList.add('active');
        });
        bankGroup.appendChild(chip);
      });
      panel.appendChild(bankField);

      // players (guessers, for scoring)
      const playerField = el(`
        <div class="field-row">
          <label>მოსაცნობი მოთამაშეები (არასავალდებულო — ქულებისთვის)</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი...">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const nameInput = playerField.querySelector('input');
      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val) return;
        d.players.push(val); d.scores[val] = 0;
        nameInput.value = ''; renderPlayers(); nameInput.focus();
      };
      playerField.querySelector('.btn').addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); addPlayer(); } });
      renderPlayers();
      panel.appendChild(playerField);

      const startBtn = el(`<button class="btn" style="width:100%; margin-top:8px;">დაწყება</button>`);
      startBtn.addEventListener('click', () => {
        d.word = pickRandom(WORD_BANKS[d.bank]);
        d.guessed = [];
        d.wrong = 0;
        d.turnIndex = 0;
        d.result = null;
        d.phase = 'play';
        App.render();
      });
      panel.appendChild(startBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    renderPlay(){
      const d = this.data;
      const wrap = el(`<div></div>`);
      const panel = el(`<div class="panel"></div>`);

      if (d.players.length){
        panel.appendChild(el(`<div class="turn-banner">იცნობს: <strong>${escapeHtml(d.players[d.turnIndex % d.players.length])}</strong></div>`));
      } else {
        panel.appendChild(el(`<div class="turn-banner">გამოიცანი სიტყვა</div>`));
      }

      // Plate of khinkali (lives)
      const plateWrap = el(`<div class="plate-wrap"></div>`);
      const plate = el(`<div class="plate"></div>`);
      const grid = el(`<div class="khinkali-grid"></div>`);
      for (let i=0;i<this.MAX_WRONG;i++){
        const k = el(`<div class="khinkali ${i < d.wrong ? 'eaten' : ''}">${KHINKALI_SVG}</div>`);
        grid.appendChild(k);
      }
      plate.appendChild(grid);
      plateWrap.appendChild(plate);
      plateWrap.appendChild(el(`<div class="lives-caption">დარჩენილი ხინკალი: ${this.MAX_WRONG - d.wrong} / ${this.MAX_WRONG}</div>`));
      panel.appendChild(plateWrap);

      // Word display
      const wordEl = el(`<div class="word-display"></div>`);
      d.word.split('').forEach(letter => {
        const shown = d.guessed.includes(letter) ? letter : '';
        wordEl.appendChild(el(`<div class="letter-tile">${shown}</div>`));
      });
      panel.appendChild(wordEl);

      // Keyboard
      const kb = el(`<div class="keyboard"></div>`);
      GEO_ALPHABET.forEach(letter => {
        const already = d.guessed.includes(letter);
        const inWord = d.word.includes(letter);
        const key = el(`<button class="key ${already ? (inWord?'correct':'wrong') : ''}" ${already || d.result ? 'disabled':''}>${letter}</button>`);
        key.addEventListener('click', () => this.guess(letter));
        kb.appendChild(key);
      });
      panel.appendChild(kb);

      wrap.appendChild(panel);

      // check end conditions after render (in case guess triggered from a previous render state)
      return wrap;
    },

    guess(letter){
      const d = this.data;
      if (d.guessed.includes(letter) || d.result) return;
      d.guessed.push(letter);
      const correct = d.word.includes(letter);
      if (!correct){
        d.wrong += 1;
      }
      const solved = d.word.split('').every(l => d.guessed.includes(l));
      if (solved){
        d.result = 'win';
        if (d.players.length){
          const p = d.players[d.turnIndex % d.players.length];
          d.scores[p] = (d.scores[p]||0) + 1;
        }
        d.phase = 'end';
      } else if (d.wrong >= this.MAX_WRONG){
        d.result = 'lose';
        d.phase = 'end';
      } else if (!correct && d.players.length){
        d.turnIndex += 1; // pass to next player on a wrong guess
      }
      App.render();
    },

    renderEnd(){
      const d = this.data;
      const wrap = el(`<div></div>`);
      const panel = el(`<div class="panel"><h2>${d.result === 'win' ? 'გამარჯვება!' : 'თამაში დასრულდა'}</h2></div>`);
      panel.appendChild(el(`<div class="status-msg ${d.result}">${d.result === 'win' ? '🎉 სიტყვა გამოიცნეს!' : '🍽️ ხინკალი დაილია...'}</div>`));
      panel.appendChild(el(`<div style="text-align:center; font-family:var(--font-display); font-size:1.4rem; color:var(--accent); margin-bottom:14px;">${d.word}</div>`));
      if (d.players.length){
        panel.appendChild(el(`<div>${renderScoreboardList(d.players.map(p=>({name:p, score:d.scores[p]||0})))}</div>`));
      }
      const actions = el(`<div class="action-row">
        <button class="btn">კიდევ ერთი სიტყვა</button>
        <button class="btn ghost">მთავარ გვერდზე</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        d.word = pickRandom(WORD_BANKS[d.bank]);
        d.guessed = []; d.wrong = 0; d.result = null; d.phase = 'play';
        App.render();
      });
      actions.children[1].addEventListener('click', () => App.goHome());
      panel.appendChild(actions);
      wrap.appendChild(panel);
      return wrap;
    }
  };

          <li>ღამის ფაზაში ტელეფონი ერთი სანდო ადამიანის ხელში იყოს და არავინ ლაპარაკობდეს.</li>

          <li>5 მოთამაშემდე შეგიძლიათ ითამაშოთ ექიმისა და დეტექტივის გარეშეც — მხოლოდ მაფია და მშვიდობიანები.</li>
          <li>რაც მეტი მოთამაშეა, მით მეტი მაფია სჭირდება თამაშს სამართლიანობისთვის — სცადეთ "ავტომატური განაწილება" ღილაკი.</li>
        </ul>
      `));

      const backBtn = el(`<button class="btn" style="width:100%; margin-top:16px;">დაბრუნება</button>`);
      backBtn.addEventListener('click', () => {
        this.data.phase = this.data.previousPhase || 'setup';
        App.render();
      });
      panel.appendChild(backBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- SETUP ----------------------- */
    renderSetup(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"><h2>მაფია — მოთამაშეები</h2></div>`);

      const playerField = el(`
        <div class="field-row">
          <label>დაამატე მოთამაშეები (მინიმუმ 5)</label>
          <ul class="player-list"></ul>
          <div class="inline-add">
            <input type="text" placeholder="სახელი..." maxlength="20">
            <button class="btn secondary">დამატება</button>
          </div>
        </div>
      `);
      const list = playerField.querySelector('.player-list');
      const nameInput = playerField.querySelector('input');
      const renderPlayers = () => {
        list.innerHTML = '';
        d.players.forEach((name, i) => {
          const li = el(`<li><span>${escapeHtml(name)}</span><button class="rm" aria-label="წაშლა">✕</button></li>`);
          li.querySelector('.rm').addEventListener('click', () => { d.players.splice(i,1); renderPlayers(); updateSummary(); });
          list.appendChild(li);
        });
      };
      const addPlayer = () => {
        const val = nameInput.value.trim();
        if (!val) return;
        d.players.push(val);
        nameInput.value = '';
        renderPlayers(); updateSummary();
        nameInput.focus();
      };
      playerField.querySelector('.btn').addEventListener('click', addPlayer);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); addPlayer(); } });
      panel.appendChild(playerField);

      const roleField = el(`<div class="field-row"><label>როლების განაწილება</label></div>`);
      const rolesRow = el(`<div style="display:flex; flex-wrap:wrap; gap:14px; align-items:center;"></div>`);

      const mafiaStepper = el(`
        <div class="stepper">
          <button type="button" data-act="dec">−</button>
          <span class="val">${d.mafiaCount}</span>
          <button type="button" data-act="inc">+</button>
          <span style="color:var(--ink-soft); font-size:0.85rem; margin-left:2px;">მაფია</span>
        </div>
      `);
      rolesRow.appendChild(mafiaStepper);

      const doctorChip = el(`<button type="button" class="chip ${d.doctorEnabled?'active':''}">ექიმი</button>`);
      doctorChip.addEventListener('click', () => {
        d.doctorEnabled = !d.doctorEnabled;
        doctorChip.classList.toggle('active', d.doctorEnabled);
        updateSummary();
      });
      rolesRow.appendChild(doctorChip);

      const detectiveChip = el(`<button type="button" class="chip ${d.detectiveEnabled?'active':''}">დეტექტივი</button>`);
      detectiveChip.addEventListener('click', () => {
        d.detectiveEnabled = !d.detectiveEnabled;
        detectiveChip.classList.toggle('active', d.detectiveEnabled);
        updateSummary();
      });
      rolesRow.appendChild(detectiveChip);

      const autoBtn = el(`<button type="button" class="btn ghost">ავტომატური განაწილება</button>`);
      autoBtn.addEventListener('click', () => {
        const s = this.suggestedRoles(d.players.length);
        d.mafiaCount = s.mafia; d.doctorEnabled = s.doctor; d.detectiveEnabled = s.detective;
        mafiaStepper.querySelector('.val').textContent = d.mafiaCount;
        doctorChip.classList.toggle('active', d.doctorEnabled);
        detectiveChip.classList.toggle('active', d.detectiveEnabled);
        updateSummary();
      });
      rolesRow.appendChild(autoBtn);

      roleField.appendChild(rolesRow);
      panel.appendChild(roleField);

      mafiaStepper.querySelector('[data-act="dec"]').addEventListener('click', () => {
        if (d.mafiaCount > 1){ d.mafiaCount -= 1; mafiaStepper.querySelector('.val').textContent = d.mafiaCount; updateSummary(); }
      });
      mafiaStepper.querySelector('[data-act="inc"]').addEventListener('click', () => {
        const max = Math.max(1, d.players.length - 2);
        if (d.mafiaCount < max){ d.mafiaCount += 1; mafiaStepper.querySelector('.val').textContent = d.mafiaCount; updateSummary(); }
      });

      const summary = el(`<div class="role-summary"></div>`);
      panel.appendChild(summary);
      const warnMsg = el(`<p style="color:var(--rust); font-size:0.85rem; margin-top:-8px;"></p>`);
      panel.appendChild(warnMsg);

      const startBtn = el(`<button class="btn" style="width:100%; margin-top:6px;">როლების დარიგება და დაწყება</button>`);

      const updateSummary = () => {
        const n = d.players.length;
        const citizens = n - d.mafiaCount - (d.doctorEnabled?1:0) - (d.detectiveEnabled?1:0);
        summary.innerHTML = '';
        summary.appendChild(el(`<span class="role-tag">მაფია: ${d.mafiaCount}</span>`));
        if (d.doctorEnabled) summary.appendChild(el(`<span class="role-tag">ექიმი: 1</span>`));
        if (d.detectiveEnabled) summary.appendChild(el(`<span class="role-tag">დეტექტივი: 1</span>`));
        summary.appendChild(el(`<span class="role-tag ${citizens<1 ? 'warn':''}">მოქალაქე: ${citizens}</span>`));

        const valid = n >= 5 && citizens >= 1;
        startBtn.disabled = !valid;
        if (n < 5){ warnMsg.style.display='block'; warnMsg.textContent = 'მინიმუმ 5 მოთამაშეა საჭირო თამაშის დასაწყებად.'; }
        else if (citizens < 1){ warnMsg.style.display='block'; warnMsg.textContent = 'როლების ჯამი აღემატება მოთამაშეთა რაოდენობას — შეამცირეთ მაფია ან გამორთეთ როლი.'; }
        else warnMsg.style.display='none';
      };

      renderPlayers();
      updateSummary();

      startBtn.addEventListener('click', () => {
        if (startBtn.disabled) return;
        this.assignRoles();
        d.revealIndex = 0;
        d.revealShown = false;
        d.phase = 'reveal';
        App.render();
      });
      panel.appendChild(startBtn);

      wrap.appendChild(panel);
      return wrap;
    },

    assignRoles(){
      const d = this.data;
      const names = d.players;
      const doctorN = d.doctorEnabled ? 1 : 0;
      const detectiveN = d.detectiveEnabled ? 1 : 0;
      const citizensN = names.length - d.mafiaCount - doctorN - detectiveN;
      let pool = [];
      for (let i=0;i<d.mafiaCount;i++) pool.push('mafia');
      if (doctorN) pool.push('doctor');
      if (detectiveN) pool.push('detective');
      for (let i=0;i<citizensN;i++) pool.push('citizen');
      pool = shuffle(pool);
      d.players = names.map((name, i) => ({ name, role: pool[i], alive: true }));
    },

    /* ----------------------- ROLE REVEAL (pass-and-play) ----------------------- */
    renderReveal(){
      const d = this.data;
      const wrap = this.topBar(false);
      const player = d.players[d.revealIndex];
      const meta = ROLE_META[player.role];

      const panel = el(`<div class="panel"><h2>როლების გაცნობა (${d.revealIndex + 1} / ${d.players.length})</h2></div>`);
      const passCard = el(`
        <div class="pass-card">
          <div class="to-player">გადაეცი ტელეფონი: <strong>${escapeHtml(player.name)}</strong></div>
        </div>
      `);
      const card = el(`
        <div class="flip-card ${d.revealShown ? 'revealed ' + meta.className : ''}">
          ${d.revealShown
            ? `<div class="role-name">${meta.label}</div><div class="role-desc">${meta.desc}</div>`
            : 'დააჭირე, რომ ნახო შენი როლი 🤫<br><span style="font-size:0.8rem; opacity:0.85;">(დარწმუნდი, სხვები არ უყურებენ)</span>'}
        </div>
      `);
      card.addEventListener('click', () => {
        if (!d.revealShown){ d.revealShown = true; App.render(); }
      });
      passCard.appendChild(card);

      const nextBtn = el(`
        <button class="btn" style="width:100%; margin-top:18px;" ${d.revealShown ? '' : 'disabled'}>
          ${d.revealIndex < d.players.length - 1 ? 'შემდეგი მოთამაშე' : 'თამაშის დაწყება'}
        </button>
      `);
      nextBtn.addEventListener('click', () => {
        if (!d.revealShown) return;
        if (d.revealIndex < d.players.length - 1){
          d.revealIndex += 1;
          d.revealShown = false;
          App.render();
        } else {
          d.phase = 'game';
          d.nightNumber = 1;
          d.dayNumber = 0;
          this.startNight();
        }
      });
      passCard.appendChild(nextBtn);
      panel.appendChild(passCard);
      wrap.appendChild(panel);
      return wrap;
    },

    /* ----------------------- NIGHT / DAY NARRATOR ----------------------- */
    alivePlayers(){ return this.data.players.filter(p => p.alive); },

    startNight(){
      const d = this.data;
      d.nightKillTarget = null;
      d.nightSaveTarget = null;
      d.eliminatedThisNight = null;
      const intro = d.pendingNightIntro ? d.pendingNightIntro + ' ' : '';
      d.pendingNightIntro = null;

      const steps = [{ type:'narration', text: intro + 'ღამე დგება — ყველამ დახუჭეთ თვალები.' }];
      steps.push({ type:'narration', text:'მაფია, გაიღვიძეთ და ჩუმად მიუთითეთ მსხვერპლი.' });
      steps.push({ type:'nightKill' });
      steps.push({ type:'narration', text:'მაფია, დაიძინეთ.' });
      if (d.doctorEnabled){
        steps.push({ type:'narration', text:'ექიმი, გაიღვიძეთ და აირჩიეთ, ვის იხსნით ამ ღამით.' });
        steps.push({ type:'nightSave' });
        steps.push({ type:'narration', text:'ექიმი, დაიძინეთ.' });
      }
      if (d.detectiveEnabled){
        steps.push({ type:'narration', text:'დეტექტივი, გაიღვიძეთ, ჩუმად მიუთითეთ ვისი შემოწმებაც გსურთ, და დაიძინეთ.' });
      }
      steps.push({ type:'narration', text:'ყველა, გაიღვიძეთ!' });

      d.scriptSteps = steps;
      d.scriptIndex = 0;
      d.phaseLabel = 'night';
      App.render();
    },

    finishNight(){
      const d = this.data;
      let died = null;
      if (d.nightKillTarget && d.nightKillTarget !== d.nightSaveTarget) died = d.nightKillTarget;
      if (died){ died.alive = false; d.eliminatedThisNight = died; }
      else d.eliminatedThisNight = null;

      const winner = this.checkWinner();
      if (winner){ d.winner = winner; d.phase = 'end'; App.render(); return; }
      this.startDay();
    },

    startDay(){
      const d = this.data;
      d.dayNumber += 1;
      const resultText = d.eliminatedThisNight
        ? `ღამით მოკვდა: ${d.eliminatedThisNight.name} (${ROLE_META[d.eliminatedThisNight.role].label}).`
        : 'ღამით არავინ მოკვდა.';
      d.scriptSteps = [
        { type:'narration', text: resultText + ' დღე დადგა — განიხილეთ ეჭვები.' },
        { type:'dayVote' }
      ];
      d.scriptIndex = 0;
      d.phaseLabel = 'day';
      App.render();
    },

    finishDay(selected){
      const d = this.data;
      let resultText;
      if (selected){
        selected.alive = false;
        resultText = `განდევნილია: ${selected.name} (${ROLE_META[selected.role].label}).`;
      } else {
        resultText = 'არავინ განიდევნა.';
      }
      const winner = this.checkWinner();
      if (winner){ d.winner = winner; d.phase = 'end'; App.render(); return; }
      d.nightNumber += 1;
      d.pendingNightIntro = resultText;
      this.startNight();
    },

    checkWinner(){
      const alive = this.alivePlayers();
      const aliveMafia = alive.filter(p => p.role === 'mafia').length;
      const aliveOthers = alive.length - aliveMafia;
      if (aliveMafia === 0) return 'citizens';
      if (aliveMafia >= aliveOthers) return 'mafia';
      return null;
    },

    renderGame(){
      const d = this.data;
      const wrap = this.topBar(true);
      const step = d.scriptSteps[d.scriptIndex];
      const panel = el(`<div class="panel"></div>`);
      panel.appendChild(el(`
        <div class="phase-banner ${d.phaseLabel}">
          <span class="dot"></span>${d.phaseLabel === 'night' ? 'ღამე ' + d.nightNumber : 'დღე ' + d.dayNumber}
        </div>
      `));

      if (step.type === 'narration'){
        panel.appendChild(el(`<div class="narration-box">${escapeHtml(step.text)}</div>`));
        const isLastNightStep = d.phaseLabel === 'night' && d.scriptIndex === d.scriptSteps.length - 1;
        const nextBtn = el(`<button class="btn" style="width:100%;">${isLastNightStep ? 'ღამის შედეგის გამოცხადება' : 'შემდეგი'}</button>`);
        nextBtn.addEventListener('click', () => {
          if (isLastNightStep) this.finishNight();
          else { d.scriptIndex += 1; App.render(); }
        });
        panel.appendChild(nextBtn);
      } else if (step.type === 'nightKill'){
        panel.appendChild(el(`<p style="text-align:center; color:var(--ink-soft); margin-top:-4px;">ვინ აირჩია მაფიამ მსხვერპლად?</p>`));
        const listEl = el(`<div class="pick-list"></div>`);
        this.alivePlayers().forEach(p => {
          const opt = el(`<button class="pick-option">${escapeHtml(p.name)}</button>`);
          opt.addEventListener('click', () => { d.nightKillTarget = p; d.scriptIndex += 1; App.render(); });
          listEl.appendChild(opt);
        });
        const noneOpt = el(`<button class="pick-option none-option">ვერ გადაწყვიტეს / არავინ აირჩია</button>`);
        noneOpt.addEventListener('click', () => { d.nightKillTarget = null; d.scriptIndex += 1; App.render(); });
        listEl.appendChild(noneOpt);
        panel.appendChild(listEl);
      } else if (step.type === 'nightSave'){
        panel.appendChild(el(`<p style="text-align:center; color:var(--ink-soft); margin-top:-4px;">ვინ იხსნა ექიმმა?</p>`));
        const listEl = el(`<div class="pick-list"></div>`);
        this.alivePlayers().forEach(p => {
          const opt = el(`<button class="pick-option">${escapeHtml(p.name)}</button>`);
          opt.addEventListener('click', () => { d.nightSaveTarget = p; d.scriptIndex += 1; App.render(); });
          listEl.appendChild(opt);
        });
        const noneOpt = el(`<button class="pick-option none-option">ექიმმა არავინ იხსნა</button>`);
        noneOpt.addEventListener('click', () => { d.nightSaveTarget = null; d.scriptIndex += 1; App.render(); });
        listEl.appendChild(noneOpt);
        panel.appendChild(listEl);
      } else if (step.type === 'dayVote'){
        panel.appendChild(el(`<p style="text-align:center; color:var(--ink-soft); margin-top:-4px;">ვინ გაირიცხა კენჭისყრით?</p>`));
        const listEl = el(`<div class="pick-list"></div>`);
        this.alivePlayers().forEach(p => {
          const opt = el(`<button class="pick-option">${escapeHtml(p.name)}</button>`);
          opt.addEventListener('click', () => this.finishDay(p));
          listEl.appendChild(opt);
        });
        const noneOpt = el(`<button class="pick-option none-option">არავინ გავარდა</button>`);
        noneOpt.addEventListener('click', () => this.finishDay(null));
        listEl.appendChild(noneOpt);
        panel.appendChild(listEl);
      }

      panel.appendChild(this.renderRoster());
      wrap.appendChild(panel);
      return wrap;
    },

    renderRoster(){
      const d = this.data;
      const box = el(`<div class="roster"><h4>მოთამაშეები</h4><ul class="roster-list"></ul></div>`);
      const ul = box.querySelector('ul');
      d.players.forEach(p => {
        const li = el(`
          <li class="${p.alive ? '' : 'eliminated'}">${escapeHtml(p.name)}${p.alive ? '' : `<span class="r-tag">${ROLE_META[p.role].label}</span>`}</li>
        `);
        ul.appendChild(li);
      });
      return box;
    },

    /* ----------------------- END SCREEN ----------------------- */
    renderEnd(){
      const d = this.data;
      const wrap = this.topBar(true);
      const panel = el(`<div class="panel"></div>`);
      panel.appendChild(el(`
        <div class="winner-banner">
          <div class="crown">${d.winner === 'mafia' ? '🕵️' : '🏆'}</div>
          <h3>${d.winner === 'mafia' ? 'გაიმარჯვა მაფიამ' : 'გაიმარჯვეს მშვიდობიანმა მოქალაქეებმა'}</h3>
        </div>
      `));

      const table = el(`<table class="review-table"><thead><tr><th>მოთამაშე</th><th>როლი</th><th>სტატუსი</th></tr></thead><tbody></tbody></table>`);
      const tbody = table.querySelector('tbody');
      d.players.forEach(p => {
        tbody.appendChild(el(`
          <tr><td>${escapeHtml(p.name)}</td><td>${ROLE_META[p.role].label}</td><td>${p.alive ? 'გადარჩა' : 'გარიცხულია'}</td></tr>
        `));
      });
      panel.appendChild(table);

      const actions = el(`<div class="action-row">
        <button class="btn">იგივე მოთამაშეებით თავიდან</button>
        <button class="btn ghost">მთავარ გვერდზე</button>
      </div>`);
      actions.children[0].addEventListener('click', () => {
        const names = d.players.map(p => p.name);
        const cfg = { mafiaCount: d.mafiaCount, doctorEnabled: d.doctorEnabled, detectiveEnabled: d.detectiveEnabled };
        this.init();
        this.data.players = names.slice();
        this.data.mafiaCount = cfg.mafiaCount;
        this.data.doctorEnabled = cfg.doctorEnabled;
        this.data.detectiveEnabled = cfg.detectiveEnabled;
        App.render();
      });
      actions.children[1].addEventListener('click', () => App.goHome());
      panel.appendChild(actions);

      wrap.appendChild(panel);
      return wrap;
    }
  };

  /* ========================================================================
     GAME 4: დურაკი (DURAK) — 36-card attack/defend game, 2-5 players,
     pass-and-play on one device. Public table state (trump, deck, cards on
     the table, card counts) is always visible; each player's own hand is
     hidden behind a one-tap "pass the phone" gate that only reopens when
     the acting player changes.

     House-rule simplifications (spelled out in the in-app rulebook):
     - Only the main attacker may add extra cards — no side-player throw-ins.
     - Cards are played one at a time rather than several at once.
  ======================================================================== */
  const SUITS = ['♠','♥','♦','♣'];
  const RED_SUITS = ['♥','♦'];
  const RANKS = [6,7,8,9,10,11,12,13,14];
  function rankLabel(r){ return ({11:'J',12:'Q',13:'K',14:'A'})[r] || String(r); }
  function cardKey(c){ return c.rank + c.suit; }

  const Durak = {
    data: null,

    init(){
      this.data = {
        phase: 'setup',      // rules | setup | game | end
        previousPhase: 'setup',
        players: [],         // {name, hand:[card], out:bool}
        deck: [],
        trumpCard: null,
        trumpSuit: null,
        discardCount: 0,
        table: [],           // [{attack:card, defend:card|null}]
        attackerIndex: 0,
        defenderIndex: 1,
        activeIndex: 0,
        activeRole: 'attack',   // attack | attack-continue | defend
        gateRevealedFor: null,
        turnMessage: '',
        finishOrder: [],
        loser: null
      };
    },

    render(){
      const d = this.data;
      if (d.phase === 'rules') return this.renderRules();
      if (d.phase === 'setup') return this.renderSetup();
      if (d.phase === 'end') return this.renderEnd();
      return this.renderGame();
    },

    topBar(showBack){
      const wrap = el(`<div></div>`);
      const bar = el(`<div class="top-bar"></div>`);
      if (showBack){
        const back = el(`<button class="back-link">← მთავარ გვერდზე</button>`);
        back.addEventListener('click', () => App.goHome());
        bar.appendChild(back);
      } else {
        bar.appendChild(el(`<span></span>`));
      }
      const rulesLink = el(`<button class="rules-link">📖 წესები</button>`);
      rulesLink.addEventListener('click', () => {
        this.data.previousPhase = this.data.phase;
        this.data.phase = 'rules';
        App.render();
      });
      bar.appendChild(rulesLink);
      wrap.appendChild(bar);
      return wrap;
    },

    /* ----------------------- RULEBOOK ----------------------- */
    renderRules(){
      const wrap = el(`<div></div>`);
      const back = el(`<button class="back-link">← უკან</button>`);
      back.addEventListener('click', () => { this.data.phase = this.data.previousPhase || 'setup'; App.render(); });
      wrap.appendChild(back);

      const panel = el(`<div class="panel rulebook"><h2>დურაკის წესები</h2></div>`);
